---
# Scoped identities for the forge. Values live ONLY in 1Password
# (vault home-infra), never in Git, never in a session.
#   minio-forge-pg      ACCESS_KEY (= forge-pg)      SECRET_KEY (40, alnum)
#   minio-forge-volsync ACCESS_KEY (= forge-volsync) SECRET_KEY (40, alnum)
# RESTIC_PASSWORD on minio-forge-volsync is deliberately NOT pulled here: the
# IAM Job does not need it (its restic check uses a throwaway repo password).
#
# Root is NOT pulled by this ExternalSecret: the Job reads MINIO_ROOT_USER /
# MINIO_ROOT_PASSWORD from the existing storage/minio-secret, which already
# exists in this namespace for MinIO itself. No new copy of root is made.
#
# creationPolicy Owner: run.sh deletes this ExternalSecret after the Job and
# the Secret is garbage-collected with it.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-iam-forge
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minio-iam-forge
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: FORGE_PG_ACCESS_KEY
      remoteRef: {key: minio-forge-pg, property: ACCESS_KEY}
    - secretKey: FORGE_PG_SECRET_KEY
      remoteRef: {key: minio-forge-pg, property: SECRET_KEY}
    - secretKey: FORGE_VOLSYNC_ACCESS_KEY
      remoteRef: {key: minio-forge-volsync, property: ACCESS_KEY}
    - secretKey: FORGE_VOLSYNC_SECRET_KEY
      remoteRef: {key: minio-forge-volsync, property: SECRET_KEY}
