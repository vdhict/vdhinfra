---
# Scoped identity for family-ai VolSync. Values live ONLY in 1Password
# (vault home-infra), never in Git, never in a session.
#   minio-family-ai-volsync  ACCESS_KEY (= family-ai-volsync)
#                            SECRET_KEY (40, alnum)   RESTIC_PASSWORD
# RESTIC_PASSWORD is NOT pulled here (the Job's restic check uses a
# throwaway repo password). Root comes from storage/minio-secret, key by key.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-iam-family-ai
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: minio-iam-family-ai
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - secretKey: FAMILY_AI_VOLSYNC_ACCESS_KEY
      remoteRef: {key: minio-family-ai-volsync, property: ACCESS_KEY}
    - secretKey: FAMILY_AI_VOLSYNC_SECRET_KEY
      remoteRef: {key: minio-family-ai-volsync, property: SECRET_KEY}
