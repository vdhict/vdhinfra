---
# promtool unit tests for MacNodeDown and MacAgentStale (aiops-hosts group,
# LAN dead man's switch 2026-10-13). Not deployed. Run like
# aiops-renovate-landed.test.yaml (rules.yaml = aiops PrometheusRule .spec,
# annotations stripped).
rule_files:
  - rules.yaml
evaluation_interval: 1m

tests:
  # mini: node_exporter down from minute 10 -> silent at 24m (14 min),
  #       FIRES at 26m (16 min, for: 15m).
  # studio: up, agent runs every 5 min -> SILENT on both rules.
  - interval: 1m
    input_series:
      - series: 'up{job="mac-node", instance="172.16.2.201:9100", host="vdhmini01"}'
        values: '1x9 0x50'
      - series: 'up{job="mac-node", instance="172.16.2.200:9100", host="vdhllmsrv01"}'
        values: '1x60'
      - series: 'mac_aiops_agent_last_run_timestamp_seconds{job="mac-node", instance="172.16.2.200:9100", host="vdhllmsrv01"}'
        values: '0 0 0 0 0 300 300 300 300 300 600 600 600 600 600 900 900 900 900 900 1200 1200 1200 1200 1200 1500 1500 1500 1500 1500 1800'
    alert_rule_test:
      - eval_time: 24m
        alertname: MacNodeDown
        exp_alerts: []
      - eval_time: 26m
        alertname: MacNodeDown
        exp_alerts:
          - exp_labels:
              severity: warning
              component: aiops-hosts
              job: mac-node
              instance: 172.16.2.201:9100
              host: vdhmini01
      - eval_time: 30m
        alertname: MacAgentStale
        exp_alerts: []

  # studio answers, but its agent last ran at t=0 (unloaded, like the Mini
  # on 2026-10-13 05:50Z): stale > 1800 s from minute 31, + for 15m.
  - interval: 1m
    input_series:
      - series: 'up{job="mac-node", instance="172.16.2.200:9100", host="vdhllmsrv01"}'
        values: '1x80'
      - series: 'mac_aiops_agent_last_run_timestamp_seconds{job="mac-node", instance="172.16.2.200:9100", host="vdhllmsrv01"}'
        values: '0x80'
    alert_rule_test:
      - eval_time: 44m
        alertname: MacAgentStale
        exp_alerts: []
      - eval_time: 47m
        alertname: MacAgentStale
        exp_alerts:
          - exp_labels:
              severity: warning
              component: aiops-hosts
              job: mac-node
              instance: 172.16.2.200:9100
              host: vdhllmsrv01
