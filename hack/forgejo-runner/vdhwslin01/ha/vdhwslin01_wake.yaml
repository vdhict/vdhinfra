# Home Assistant package: vdhwslin01 team wake (chg-2026-10-05-031, Argus R12).
# For Hestia to install (owner: ha-engineer). The waker (launchd on vdhmini01 since
# 2026-11-03; no cluster component) uses NO HA token: it can only POST this
# local-only webhook, and the 4 boots/day cap lives HERE, so the waker cannot
# bypass it.
#
# secrets.yaml needs:  vdhwslin01_wake_webhook_id: <webhook_id>
#   value = the Mini file ~/.config/vdhwslin01/ha-webhook-id (0600, made by
#   hack/forgejo-runner/vdhwslin01/mini/make-webhook-id.sh). Pipe it in over
#   stdin; never echo it, never on argv. The Mini (172.16.2.201) is on the LAN,
#   so local_only holds.
#
# Test after install (R12): POST the webhook 5x in one day with the box OFF ->
# the counter stops at 4 and the 5th call does not press the button
# (logbook shows "refused: daily cap").
counter:
  vdhwslin01_team_boots:
    name: vdhwslin01 team boots today
    icon: mdi:desktop-tower
    initial: 0
    restore: true
    step: 1

automation:
  - id: vdhwslin01_team_wake_webhook
    alias: vdhwslin01 team wake (webhook, max 4 per day)
    description: >-
      chg-2026-10-05-031. Called by the Mini waker when the forge has queued
      jobs and the box is off. Presses the WoL button at most 4 times per day.
    mode: single
    max_exceeded: silent
    triggers:
      - trigger: webhook
        webhook_id: !secret vdhwslin01_wake_webhook_id
        allowed_methods: [POST]
        local_only: true
    actions:
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ states('counter.vdhwslin01_team_boots') | int(99) < 4 }}"
            sequence:
              - action: counter.increment
                target:
                  entity_id: counter.vdhwslin01_team_boots
              - action: button.press
                target:
                  entity_id: button.wake_on_lan_d8_bb_c1_94_90_c0
              - action: logbook.log
                data:
                  name: vdhwslin01
                  message: "team wake {{ states('counter.vdhwslin01_team_boots') }}/4 (queued jobs: {{ trigger.json.jobs | default('?') }})"
                  entity_id: counter.vdhwslin01_team_boots
        default:
          - action: logbook.log
            data:
              name: vdhwslin01
              message: "team wake refused: daily cap 4 reached"
              entity_id: counter.vdhwslin01_team_boots
          - stop: daily cap reached

  - id: vdhwslin01_team_boots_reset
    alias: vdhwslin01 team boot counter reset (midnight)
    mode: single
    triggers:
      - trigger: time
        at: "00:00:00"
    actions:
      - action: counter.reset
        target:
          entity_id: counter.vdhwslin01_team_boots
