---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/scrapeconfig_v1alpha1.json
#
# node_exporter on the two always-on Macs (chg-2026-10-12-009). Installed by
# hack/aiops/mac/install.sh. On each Mac node_exporter itself listens on
# 127.0.0.1:9100 only; the LAN-side :9100 socket is owned by launchd, which
# hands each connection to Apple-signed /usr/bin/nc -> 127.0.0.1:9100
# (the Studio's application firewall allows launchd; it would block the
# ad-hoc-signed Homebrew binary). See hack/aiops/README.md.
#
# This scrape is also the CLUSTER half of the dead man's switch: up == 0 here
# is MacHostDown (PrometheusRule aiops-hosts).
apiVersion: monitoring.coreos.com/v1alpha1
kind: ScrapeConfig
metadata:
  name: mac-node
  namespace: observability
spec:
  jobName: mac-node
  scrapeInterval: 60s
  scrapeTimeout: 15s
  staticConfigs:
    - targets: ["172.16.2.201:9100"]
      labels:
        host: vdhmini01
        role: agent-host
    - targets: ["172.16.2.200:9100"]
      labels:
        host: vdhllmsrv01
        role: local-model-host
