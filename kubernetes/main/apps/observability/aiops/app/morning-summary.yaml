---
# aiops-morning-summary (chg-2026-10-12-009): at 07:00 Europe/Amsterdam, post
# one ntfy summary of the night's silent (priority 1) alerts.
# See scripts/morning_summary.py.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: aiops-morning-summary
  namespace: observability
spec:
  schedule: "0 7 * * *"
  # Posts to the self-hosted ntfy (topic "alerts") since 2026-10-13; reads the
  # night from Prometheus. Never ntfy.sh.
  suspend: false
  timeZone: Europe/Amsterdam
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 172800
      template:
        metadata:
          labels:
            # Allowed in by the ntfy CNP (kubernetes/main/apps/ntfy/network-policies).
            app.kubernetes.io/name: aiops-morning-summary
        spec:
          serviceAccountName: aiops
          automountServiceAccountToken: false
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: summary
              image: ghcr.io/vdhict/cluster-health:sha-de00b79
              imagePullPolicy: IfNotPresent
              command: ["python3", "/scripts/morning_summary.py"]
              env:
                - name: NTFY_URL
                  value: http://ntfy.ntfy.svc.cluster.local/alerts
                - name: NTFY_TOKEN_FILE
                  value: /secrets/ntfy/token
                - name: PROM_URL
                  value: http://kube-prometheus-stack-prometheus.observability.svc:9090
              resources:
                requests: {cpu: 5m, memory: 32Mi}
                limits: {memory: 96Mi}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                - name: ntfy-token
                  mountPath: /secrets/ntfy
                  readOnly: true
          volumes:
            - name: ntfy-token
              secret:
                secretName: ntfy-alertmanager-token
                defaultMode: 0440
            - name: scripts
              configMap:
                name: aiops-scripts
                defaultMode: 0555
