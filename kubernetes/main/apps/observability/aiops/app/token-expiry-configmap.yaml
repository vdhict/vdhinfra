---
# Token expiry register (chg-2026-10-12-009). NAMES AND DATES ONLY: never a
# value, a prefix, a hash or a length of any credential. Public repo.
#
# Read by aiops-exporter on every scrape -> aiops_token_expiry_timestamp_seconds
# -> PrometheusRule aiops-tokens: warning at 14 days, critical at 3 days.
# Edit this file (and only this file) when a token is issued, rotated or
# retired. "expires" is the moment the credential stops working: its own
# expiry, or a scheduled forced revocation (backstop), whichever is first.
#
# Seeded 2026-10-12 from metadata readable without exposing values:
#   - Cloudflare: GET /user/tokens/verify -> result.expires_on
#   - Home Assistant long-lived tokens: JWT "exp" claim
#   - mack-dev forge token: schedule of devtools/cronjob mack-dev-revoke-backstop
#     (0 14 11 11 *, Etc/UTC)
# Checked but NOT listed because they carry no expiry: the 1Password Connect
# tokens (security/onepassword-connect-secret, security/onepassword-mypka-token,
# lab-passkey/onepassword-connect-lab-passkey, lab-passkey/onepassword-connect-
# lab-passkey-devapp, passkey-point-e2e/onepassword-passkey-point-dev-token:
# JWTs without an exp claim), the other Forgejo access tokens (Forgejo tokens
# do not expire), and GitHub App installation tokens (minted per run, 1 h).
# Rotate-by entries (policy date, not a technical expiry): devtenant-ops-write-token, standing in
# devtenant-build since 2026-10-13 (chg-2026-10-13-004), 90 days; Atlas rotates and moves the date on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: aiops-token-expiry
  namespace: observability
data:
  tokens.json: |
    {
      "tokens": [
        {"name": "forgejo/mack-dev-package (revoke backstop)", "kind": "forge", "owner": "k8s-engineer",
         "expires": "2026-11-11T14:00:00Z"},
        {"name": "1password-connect/devtenant-ops-write-token (rotate-by, standing since 2026-10-13)", "kind": "1password-connect",
         "owner": "atlas", "expires": "2027-01-11T09:00:00Z"},
        {"name": "cloudflare/cert-manager-dns01", "kind": "cloudflare", "owner": "k8s-engineer",
         "expires": "2028-01-31T23:59:59Z"},
        {"name": "cloudflare/external-dns", "kind": "cloudflare", "owner": "udm-engineer",
         "expires": "2028-01-31T23:59:59Z"},
        {"name": "home-assistant/llat-prometheus-scrape", "kind": "ha-llat", "owner": "ha-engineer",
         "expires": "2036-05-02T06:46:58Z"},
        {"name": "home-assistant/llat-grafana-infinity", "kind": "ha-llat", "owner": "observability-engineer",
         "expires": "2036-05-02T06:46:58Z"},
        {"name": "home-assistant/llat-cluster-health", "kind": "ha-llat", "owner": "observability-engineer",
         "expires": "2036-03-30T05:18:34Z"}
      ]
    }
