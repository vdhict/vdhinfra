---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./token-expiry-configmap.yaml
  - ./exporter.yaml
  - ./morning-summary.yaml
  - ./scrapeconfig-macs.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: aiops-scripts
    namespace: observability
    options:
      annotations:
        kustomize.toolkit.fluxcd.io/substitute: disabled
    files:
      - scripts/aiops_exporter.py
      - scripts/morning_summary.py
