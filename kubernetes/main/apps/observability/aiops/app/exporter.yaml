---
# aiops-exporter (chg-2026-10-12-009): token expiry + Renovate health metrics.
# See scripts/aiops_exporter.py for the metric contract.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aiops
  namespace: observability
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-exporter
  namespace: observability
  labels:
    app.kubernetes.io/name: aiops-exporter
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: aiops-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aiops-exporter
    spec:
      serviceAccountName: aiops
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        # secret files are root-owned; fsGroup makes the 0440 key readable.
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          image: ghcr.io/vdhict/cluster-health:sha-de00b79
          imagePullPolicy: IfNotPresent
          command: ["python3", "/scripts/aiops_exporter.py"]
          env:
            - name: TOKENS_FILE
              value: /config/tokens.json
            - name: GITHUB_REPO
              value: vdhict/vdhinfra
            # GitHub App identifiers: non-secret, same App as cluster-health.
            - name: GITHUB_APP_ID
              value: "3302753"
            - name: GITHUB_APP_INSTALLATION_ID
              value: "122063656"
            - name: GITHUB_APP_KEY_PATH
              value: /secrets/github-app-key.pem
            - name: GITHUB_INTERVAL
              value: "900"
          ports:
            - name: metrics
              containerPort: 9900
          readinessProbe:
            httpGet:
              path: /healthz
              port: metrics
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            periodSeconds: 60
          resources:
            requests: {cpu: 5m, memory: 32Mi}
            limits: {memory: 96Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
            - name: tokens
              mountPath: /config
            # ONLY the App key from the cluster-health secret, nothing else.
            - name: github-app-key
              mountPath: /secrets
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: aiops-scripts
            defaultMode: 0555
        - name: tokens
          configMap:
            name: aiops-token-expiry
        - name: github-app-key
          secret:
            secretName: cluster-health-secret
            optional: true
            defaultMode: 0440
            items:
              - key: github-app-key.pem
                path: github-app-key.pem
        - name: tmp
          emptyDir:
            sizeLimit: 8Mi
---
apiVersion: v1
kind: Service
metadata:
  name: aiops-exporter
  namespace: observability
  labels:
    # component, not name: Flux commonMetadata overwrites app.kubernetes.io/name.
    app.kubernetes.io/component: aiops-exporter
spec:
  selector:
    app.kubernetes.io/name: aiops-exporter
  ports:
    - name: metrics
      port: 9900
      targetPort: metrics
---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: aiops-exporter
  namespace: observability
spec:
  jobLabel: app.kubernetes.io/component
  selector:
    matchLabels:
      app.kubernetes.io/component: aiops-exporter
  endpoints:
    - port: metrics
      interval: 60s
      scrapeTimeout: 10s
