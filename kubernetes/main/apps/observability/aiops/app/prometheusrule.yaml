---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/prometheusrule_v1.json
#
# AIOps step 1 rules (chg-2026-10-12-009). Every rule carries
# component=aiops-<group>; Alertmanager sends these warnings and criticals to
# ntfy (loud 07-23, silent 23-07) and the criticals to HA only by day.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: aiops
  namespace: observability
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    # ── Certificates: will a cert-manager certificate run out? ─────────────────
    - name: aiops-certs
      interval: 5m
      rules:
        - alert: CertificateExpiresIn30d
          # 30-day warning, gated on "renewal is overdue". Several certs here
          # renew at 10 or 15 days left by design (lab-passkey, oidc-proxy,
          # tesla-proxy), so a bare "< 30d" would fire for weeks on every
          # healthy renewal cycle. For the Let's Encrypt certs (renew at 30 d)
          # this is exactly "under 30 days and not renewed".
          expr: |
            (certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 86400)
            and on (name, exported_namespace)
            (certmanager_certificate_renewal_timestamp_seconds < time() - 3600)
          for: 1h
          labels:
            severity: warning
            component: aiops-certs
          annotations:
            summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }} and its renewal is overdue"
            description: cert-manager should already have renewed this certificate. Check `kubectl -n {{ $labels.exported_namespace }} describe certificate {{ $labels.name }}` and the CertificateRequest/Order events.
        - alert: CertificateExpiresIn7d
          expr: certmanager_certificate_expiration_timestamp_seconds - time() < 7 * 86400
          for: 15m
          labels:
            severity: critical
            component: aiops-certs
          annotations:
            summary: "Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
            description: Less than 7 days left. Every certificate here renews at 10 days or more before expiry, so this is a failed renewal.

    # ── Tokens: is a credential about to stop working? ─────────────────────────
    - name: aiops-tokens
      interval: 5m
      rules:
        - alert: TokenExpiresIn14d
          expr: aiops_token_expiry_timestamp_seconds - time() < 14 * 86400
          for: 10m
          labels:
            severity: warning
            component: aiops-tokens
          annotations:
            summary: "Token {{ $labels.token }} ({{ $labels.kind }}, owner {{ $labels.owner }}) expires in {{ $value | humanizeDuration }}"
            description: Rotate it, then update the date in kubernetes/main/apps/observability/aiops/app/token-expiry-configmap.yaml.
        - alert: TokenExpiresIn3d
          expr: aiops_token_expiry_timestamp_seconds - time() < 3 * 86400
          for: 10m
          labels:
            severity: critical
            component: aiops-tokens
          annotations:
            summary: "Token {{ $labels.token }} ({{ $labels.kind }}, owner {{ $labels.owner }}) expires in {{ $value | humanizeDuration }}"
            description: Less than 3 days left. Rotate it, then update token-expiry-configmap.yaml.
        - alert: TokenRegisterBroken
          expr: aiops_tokens_config_valid == 0 or absent(up{job="aiops-exporter"} == 1)
          for: 15m
          labels:
            severity: warning
            component: aiops-tokens
          annotations:
            summary: "Token-expiry register unreadable or aiops-exporter down: token alerts are blind"
            description: Check `kubectl -n observability logs deploy/aiops-exporter` and the JSON in configmap aiops-token-expiry.

    # ── Renovate: are dependency updates still flowing? ────────────────────────
    - name: aiops-renovate
      interval: 5m
      rules:
        - alert: RenovateNoRun48h
          # Proxy for "Renovate ran": newest update by renovate[bot] on any
          # issue or PR (dashboard edits, PR rebases, new PRs).
          expr: time() - renovate_last_activity_timestamp_seconds > 48 * 3600
          for: 30m
          labels:
            severity: warning
            component: aiops-renovate
          annotations:
            summary: "No Renovate activity on vdhict/vdhinfra for {{ $value | humanizeDuration }}"
            description: Renovate (hosted GitHub app) has not touched any issue or PR for over 48 h. Check the Dependency Dashboard and the app's job log.
        - alert: RenovateNoContainerCommit14d
          # RenovateNoRun48h stayed green through the 2026-10 stall: the bot
          # kept touching issues/PRs while nothing landed. This asks the
          # outcome question instead: did a renovate[bot] "(container)"
          # commit reach main in the last 14 days? 0 = none in the last 100.
          expr: time() - renovate_last_main_container_commit_timestamp_seconds > 14 * 86400
          for: 1h
          labels:
            severity: warning
            component: aiops-renovate
          annotations:
            summary: "No Renovate container update landed on main for {{ $value | humanizeDuration }}"
            description: Renovate is active but no "(container)" commit by renovate[bot] reached main in 14 days. Check the Dependency Dashboard for stuck/awaiting-schedule updates, the automerge rules and failing checks on open Renovate PRs.
        - alert: RenovatePROlderThan14d
          expr: time() - renovate_pr_created_timestamp_seconds > 14 * 86400
          for: 1h
          labels:
            severity: warning
            component: aiops-renovate
          annotations:
            summary: "Renovate PR #{{ $labels.number }} has been open for {{ $value | humanizeDuration }}"
            description: https://github.com/vdhict/vdhinfra/pull/{{ $labels.number }} - merge, close or ignore it in the Renovate config.
        - alert: RenovateMonitorBlind
          expr: time() - aiops_github_last_success_timestamp_seconds > 3 * 3600
          for: 15m
          labels:
            severity: warning
            component: aiops-renovate
          annotations:
            summary: "aiops-exporter has not reached the GitHub API for {{ $value | humanizeDuration }}: Renovate alerts are blind"
            description: Check `kubectl -n observability logs deploy/aiops-exporter` (App key mount, token exchange, API rate limit).

    # ── Hosts outside the cluster: the Macs and the NAS ────────────────────────
    - name: aiops-hosts
      interval: 1m
      rules:
        - alert: MacNodeDown
          # Cluster half of the LAN dead man's switch (2026-10-13; was
          # MacHostDown). The Macs watch the cluster by reading the active
          # Watchdog from Alertmanager over the LAN; see hack/aiops/README.md.
          expr: up{job="mac-node"} == 0
          for: 15m
          labels:
            severity: warning
            component: aiops-hosts
          annotations:
            summary: "{{ $labels.host }} ({{ $labels.instance }}) not answering node_exporter for 15 min"
            description: Either the Mac is down or asleep, or its launchd node_exporter jobs stopped. Compare with the BlackboxProbeFailure on the same host (ssh port) to tell which.
        - alert: MacAgentStale
          # The Mac answers, but aiops-mac-agent stopped running (unloaded,
          # broken config): then nobody on that Mac watches the cluster.
          expr: up{job="mac-node"} == 1 and on(instance) (time() - mac_aiops_agent_last_run_timestamp_seconds{job="mac-node"} > 1800)
          for: 15m
          labels:
            severity: warning
            component: aiops-hosts
          annotations:
            summary: "{{ $labels.host }}: aiops-mac-agent has not run for {{ $value | humanizeDuration }}"
            description: Check `launchctl print gui/$(id -u)/com.vdhict.aiops-mac-agent` and ~/Library/Logs/aiops-mac-agent.log on the host.
        - alert: MacRebooted
          expr: changes(node_boot_time_seconds{job="mac-node"}[30m]) > 0
          labels:
            severity: warning
            component: aiops-hosts
          annotations:
            summary: "{{ $labels.host }} rebooted in the last 30 min"
            description: Check `mac_diagnostic_report_last_timestamp_seconds{kind="panic"}` for a kernel panic, otherwise a power cut or update.
        - alert: MacKernelPanic
          expr: time() - mac_diagnostic_report_last_timestamp_seconds{kind="panic"} < 6 * 3600
          labels:
            severity: warning
            component: aiops-hosts
          annotations:
            summary: "{{ $labels.host }} wrote a kernel panic report {{ $value | humanizeDuration }} ago"
            description: See /Library/Logs/DiagnosticReports/*.panic on the host.
