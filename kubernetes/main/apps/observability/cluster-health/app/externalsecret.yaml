---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-health
  namespace: observability
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: cluster-health-secret
    creationPolicy: Owner
  # Direct field-to-key mapping. NO template — gotemplate substitution
  # mangles multi-line PEM values (collapses \n to spaces). Each entry
  # below pulls the named property from the 1P item verbatim.
  data:
    - secretKey: HA_TOKEN
      remoteRef:
        key: cluster-health
        property: HA_LONG_LIVED_TOKEN
    # HA_NOTIFY_TARGET is deliberately NOT pulled from 1Password any more.
    # It is a device id, not a credential, and sourcing it here made it
    # invisible in Git: a stale 1P value (mobile_app_s25_ultra_sander)
    # silently won over a repo that read correctly and killed the 08:00
    # digest push for 57 days (inc-2026-08-27-001 / chg-2026-09-07-002).
    # Any CronJob that needs it now declares it as a plain env var.
    # Do not re-add it here.
    - secretKey: UNIFI_API_KEY
      remoteRef:
        key: cluster-health
        property: UNIFI_API_KEY
    # Binary RSA private key for the cluster-health GitHub App. The
    # report cronjob signs a 9-minute JWT (RS256) with this key at
    # runtime via openssl, exchanges it for an installation token,
    # and uses that for the daily push.
    - secretKey: github-app-key.pem
      remoteRef:
        key: cluster-health
        property: GITHUB_APP_PRIVATE_KEY
