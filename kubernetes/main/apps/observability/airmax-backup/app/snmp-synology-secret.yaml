---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/external-secrets.io/externalsecret_v1beta1.json
# SNMPv3 auth for the Synology NAS (vdhnas01). Rendered as a second snmp.yml
# file (snmp_exporter merges multiple --config.file). Credentials come only
# from 1Password item "snmp vdhnas01" (fields rouser, password); the password
# may be rotated there and is picked up at the next refresh.
# DSM is set to SNMPv3 authPriv, SHA + AES (owner 2026-10-15; MD5/noPriv no longer answers).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snmp-exporter-synology
  namespace: observability
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: snmp-exporter-synology
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        synology-auth.yml: |
          auths:
            synology_v3:
              version: 3
              security_level: authPriv
              auth_protocol: SHA
              priv_protocol: AES
              username: "{{ .rouser }}"
              password: "{{ .password }}"
              priv_password: "{{ .password }}"
  data:
    - secretKey: rouser
      remoteRef:
        key: snmp vdhnas01
        property: rouser
    - secretKey: password
      remoteRef:
        key: snmp vdhnas01
        property: password
