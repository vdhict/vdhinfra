---
# chg-2026-10-30-004 item 2 (tsk-2026-10-30-010), redesign after inc-2026-11-13-003.
# A dedicated blackbox exporter for the Snapmaker U1 heartbeat ONLY. The shared
# exporter stays fully denied the printer subnet; this one has egress
# default-deny and may reach nothing but 172.16.7.10 TCP 7125 with GET on two
# read-only Moonraker paths (CiliumNetworkPolicy blackbox-printer). Its config
# holds only the two printer modules. Pinned to the worker nodes: the UDM
# allows only .81-.83 to the printer (Argus firewall review 2026-11-13).
# yaml-language-server: $schema=https://schemas.zinn.ca/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blackbox-printer
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: ["vdhclu01node01", "vdhclu01node02", "vdhclu01node03"]
    controllers:
      blackbox-printer:
        annotations:
          reloader.stakater.com/auto: "true"
        replicas: 1
        containers:
          app:
            image:
              repository: quay.io/prometheus/blackbox-exporter
              tag: v0.27.0@sha256:a50c4c0eda297baa1678cd4dc4712a67fdea713b832d43ce7fcc5f9bea05094d
              pullPolicy: IfNotPresent
            args:
              - --config.file=/etc/blackbox/blackbox.yml
              - --web.listen-address=:9115
            resources:
              limits:
                memory: 32Mi
              requests:
                cpu: 5m
                memory: 16Mi
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /-/healthy, port: 9115}
                  initialDelaySeconds: 5
                  periodSeconds: 30
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: {path: /-/healthy, port: 9115}
                  initialDelaySeconds: 5
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
    persistence:
      config:
        type: configMap
        name: blackbox-printer-config
        globalMounts:
          - path: /etc/blackbox/blackbox.yml
            subPath: blackbox.yml
            readOnly: true
    service:
      app:
        controller: blackbox-printer
        ports:
          http:
            port: 9115
