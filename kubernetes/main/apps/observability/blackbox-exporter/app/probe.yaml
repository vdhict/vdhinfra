---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/probe_v1.json
# Probes the SLZB-06 Zigbee coordinator's TCP socket. Catches the
# half-open-session wedge where the chip is L2-fine but won't accept a
# new TCP client — the failure mode that produced the 30h z2m outage.
# Direct TCP probe sees this; the L1/L2 unifi-exporter metrics don't.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: slzb-tcp
  namespace: observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  jobName: blackbox-tcp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
  module: tcp_lan_5s
  interval: 30s
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        - slzb.vdh.lan:6638
      labels:
        target_friendly: slzb-06
        target_role: zigbee-coordinator
---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/probe_v1.json
#
# Hosts outside the cluster that the household depends on (chg-2026-10-12-009).
# TCP, not ICMP: the Studio runs the macOS application firewall, and a TCP
# connect to sshd (allowed incoming on both Macs) proves the host and its
# network stack answer, independent of the node_exporter launchd jobs that
# MacHostDown watches. NAS: DSM https (5001) and NFS (2049), the two services
# media and backups actually use. The NAS has no SNMP enabled today (tested
# 2026-10-12: no answer on v1/v2c with either community), so no snmp scrape.
# Failures surface through the generic BlackboxProbeFailure rule.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: lan-hosts-tcp
  namespace: observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  jobName: blackbox-lan-hosts
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
  module: tcp_lan_5s
  interval: 60s
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        - 172.16.2.201:22
        - 172.16.2.200:22
        - 172.16.2.246:5001
        - 172.16.2.246:2049
      relabelingConfigs:
        - sourceLabels: [__param_target]
          regex: "172\\.16\\.2\\.201:.*"
          targetLabel: target_friendly
          replacement: vdhmini01
        - sourceLabels: [__param_target]
          regex: "172\\.16\\.2\\.200:.*"
          targetLabel: target_friendly
          replacement: vdhllmsrv01
        - sourceLabels: [__param_target]
          regex: "172\\.16\\.2\\.246:.*"
          targetLabel: target_friendly
          replacement: synology-nas
---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/probe_v1.json
#
# PiKVM: the out-of-band console for worker nodes node01-03 (chg-2026-10-21-005).
# Losing it means losing console access to the workers, so watch it from two
# angles. HTTPS by FQDN: the device serves a Let's Encrypt cert for
# pikvm.bluejungle.net, so http_2xx verifies TLS for real (the bare IP fails
# verification). /login/ is the unauthenticated page and answers 200; "/"
# redirects there. Measured from the running exporter 2026-10-21:
# probe_success 1, probe_http_status_code 200, probe_http_ssl 1.
# Failures surface through the generic BlackboxProbeFailure rule (warning).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: pikvm-https
  namespace: observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  jobName: blackbox-pikvm-https
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
  module: http_2xx
  interval: 60s
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        - https://pikvm.bluejungle.net/login/
      labels:
        target_friendly: pikvm
        target_role: oob-console
---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/probe_v1.json
#
# PiKVM ICMP by IP, deliberately not by name: a DNS fault must not read as
# "PiKVM down", and https failing while icmp passes points at kvmd-nginx
# rather than the host. Measured 2026-10-21: probe_success 1.
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: pikvm-icmp
  namespace: observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  jobName: blackbox-pikvm-icmp
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
  module: icmp_lan
  interval: 60s
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        - 172.16.3.115
      labels:
        target_friendly: pikvm
        target_role: oob-console
---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/probe_v1.json
#
# chg-2026-10-25-006 (Argus F2): Jellyfin's startup wizard and Dispatcharr's
# initialize-superuser must stay CLOSED. Both are blocked on their routes;
# this catches the state behind the block (data loss, a PVC recreate). In-
# cluster ClusterIP targets; both namespaces' CNPs admit blackbox-exporter
# on the app port. Failures surface through the generic
# BlackboxProbeFailure rule (warning, 3m).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: setup-closed
  namespace: observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  jobName: blackbox-setup-closed
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
  module: http_jellyfin_setup_closed
  interval: 5m
  scrapeTimeout: 10s
  targets:
    staticConfig:
      static:
        - http://jellyfin.jellyfin.svc.cluster.local:8096/System/Info/Public
      labels:
        target_friendly: jellyfin-setup-closed
---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/probe_v1.json
# Same check for Dispatcharr (a Probe takes one module, hence two Probes).
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: setup-closed-dispatcharr
  namespace: observability
  labels:
    app.kubernetes.io/name: blackbox-exporter
spec:
  jobName: blackbox-setup-closed
  prober:
    url: blackbox-exporter.observability.svc.cluster.local:9115
    path: /probe
  interval: 5m
  scrapeTimeout: 10s
  module: http_dispatcharr_setup_closed
  targets:
    staticConfig:
      static:
        - http://dispatcharr.dispatcharr.svc.cluster.local:9191/api/accounts/initialize-superuser/
      labels:
        target_friendly: dispatcharr-setup-closed
