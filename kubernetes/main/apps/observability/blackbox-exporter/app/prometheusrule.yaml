---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: blackbox-exporter
  namespace: observability
  labels:
    app.kubernetes.io/part-of: kube-prometheus-stack
spec:
  groups:
    - name: blackbox-exporter.health
      interval: 1m
      rules:
        - alert: BlackboxProbeFailure
          # `probe_success == 0` for any target. Generic alert so future
          # probes get coverage automatically.
          expr: probe_success == 0
          for: 3m
          labels:
            severity: warning
            component: blackbox-exporter
          annotations:
            summary: "Probe failing: {{ $labels.target_friendly }} ({{ $labels.instance }})"
            description: |
              Blackbox probe to {{ $labels.instance }} (module {{ $labels.module }})
              has been failing for 3+ minutes. Service-level reachability
              from inside the cluster is broken even if L1/L2 looks fine.

        - alert: ZigbeeCoordinatorTcpDown
          # Tighter alert for the SLZB specifically — this is the bridge
          # auto-recovery's primary signal source. 2-min for: matches the
          # z2m watchdog's 10-min offline threshold (covers 4 probe cycles).
          expr: probe_success{target_friendly="slzb-06"} == 0
          for: 2m
          labels:
            severity: warning
            component: blackbox-exporter
          annotations:
            summary: "Zigbee coordinator TCP wedged: {{ $labels.instance }}"
            description: |
              The SLZB-06 is not accepting TCP connections on 6638 from
              inside the cluster, even though physical-layer alerts may
              be silent. This is the failure mode the z2m watchdog
              (health-z2m-watchdog CronJob) restarts the bridge for.
              If the watchdog is in DRY_RUN, restart manually:
              `kubectl -n home-automation rollout restart deploy/zigbee2mqtt`

    # ── Household AI edge: does it still refuse unauthenticated callers? ──────
    #
    # Guards the ONE thing our change log cannot see. api.bluejungle.net's
    # authentication lives in a Caddy config on the Mac Studio, operated by the
    # myPKA agent team — outside this repo, outside ops/changes.jsonl. Nothing
    # else in the estate would notice if it were dropped.
    #
    # WHY THESE ARE SPLIT BY STATUS CLASS RATHER THAN "alert on any non-401":
    # the obvious rule `probe_success == 0` — or any rule that treats every
    # non-401 alike — pages on a 503. And 503 is exactly what the gateway
    # returns whenever the Mac Studio is asleep, rebooting, or Caddy is
    # mid-build. That is a desktop machine and a normal daily event, so such a
    # rule would page the household routinely and then be muted, taking the
    # real security signal down with it.
    #
    # The failure modes were measured on 2026-09-21 rather than assumed:
    #   auth working ........ probe_http_status_code 401
    #   backend unhealthy ... probe_http_status_code 503  (chat, "building")
    #   host unreachable .... probe_http_status_code 0
    #   NXDOMAIN ............ probe_http_status_code 0
    # so status class cleanly separates "security regression" from "the Studio
    # is off", and the three buckets below do not overlap:
    #   2xx/3xx  -> critical, pages          (served an unauthenticated request)
    #   4xx!=401 -> warning                  (auth semantics changed)
    #   5xx / 0  -> the generic BlackboxProbeFailure above, warning, no page
    - name: blackbox-exporter.ai-edge-auth
      interval: 1m
      rules:
        # Q: "Did the AI endpoint just answer someone who presented no key?"
        # The regression, and the only rule here worth waking anyone for.
        - alert: AiEdgeUnauthenticatedAccessPossible
          expr: |
            probe_http_status_code{job="blackbox-ai-edge-auth"} >= 200
              and
            probe_http_status_code{job="blackbox-ai-edge-auth"} < 400
          for: 2m
          labels:
            severity: critical
            component: blackbox-exporter
            gateway: envoy-internal
          annotations:
            summary: "AI edge answered UNAUTHENTICATED request: HTTP {{ $value }} on {{ $labels.instance }}"
            description: |
              {{ $labels.instance }} returned {{ $value }} to a request carrying
              NO API key. It must return 401. The household LLM API is reachable
              from the whole internal LAN and is now, on this evidence, serving
              anyone who asks.
              Auth for this endpoint is enforced by Caddy on the Mac Studio
              (172.16.2.200) — a config outside this repo. Check with the myPKA
              agent team whether that config changed.
              Confirm by hand:
                curl -s -o /dev/null -w '%{http_code}\n' https://api.bluejungle.net/v1/models

        # Q: "Did the rejection change shape — 403, 404, 429 instead of 401?"
        # Not necessarily a breach, but the assertion this probe rests on is no
        # longer true, so the probe has stopped meaning what it claims to mean.
        - alert: AiEdgeAuthAssertionUnexpectedStatus
          expr: |
            probe_http_status_code{job="blackbox-ai-edge-auth"} >= 400
              and
            probe_http_status_code{job="blackbox-ai-edge-auth"} < 500
              and
            probe_http_status_code{job="blackbox-ai-edge-auth"} != 401
          for: 15m
          labels:
            severity: warning
            component: blackbox-exporter
            gateway: envoy-internal
          annotations:
            summary: "AI edge returned {{ $value }} instead of 401 on {{ $labels.instance }}"
            description: |
              Still refusing the caller, so this is not an exposure — but the
              refusal is no longer a 401 and the http_401_unauthenticated module
              will read as failing. Either Caddy's rejection semantics changed,
              or the route now lands somewhere other than the LLM API.
              Re-check what the endpoint should assert before editing the module.
