---
# yaml-language-server: $schema=https://json.schemastore.org/gateway.networking.k8s.io.httproute_v1.json
# LAN heartbeat endpoint for the Macs' aiops-mac-agent (2026-10-13, Mack
# AGR-078): the agents read the active Watchdog alert here instead of an
# ntfy.sh heartbeat topic. envoy-internal only, and only ONE read-only call:
# GET /api/v2/alerts (query string allowed). Silences, the UI, POSTs and every
# other path are not routed, so nothing on the LAN can silence or inject
# alerts through this name. (The chart's alertmanager Ingress uses ingress
# class "internal", which does not exist, so it never served anything.)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alertmanager-heartbeat
  namespace: observability
spec:
  hostnames:
    - "alertmanager.${SECRET_DOMAIN}"
  parentRefs:
    - name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: kube-prometheus-stack-alertmanager
          port: 9093
      matches:
        - method: GET
          path:
            type: Exact
            value: /api/v2/alerts
