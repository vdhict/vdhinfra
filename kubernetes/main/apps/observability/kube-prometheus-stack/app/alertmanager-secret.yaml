---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/v1/secret.json
#
# Alertmanager routing (chg-2026-10-12-009, AIOps step 1).
#
# Story: every warning or critical alert reaches a human on ntfy, loud by day
# and silent by night, and the Watchdog proves the path works.
#
#   InfoInhibitor          -> "null"
#   Watchdog               -> "null"        (dead man's switch source, LAN only:
#                                            the Macs read the ACTIVE Watchdog
#                                            from GET /api/v2/alerts through
#                                            envoy-internal, HTTPRoute
#                                            alertmanager-heartbeat; ntfy only
#                                            for a real loss. See
#                                            hack/aiops/README.md.)
#   Mac host alerts        -> ntfy-team-day 07-23 (p3) / ntfy-team-night 23-07
#   (host or target_friendly  (p1), topic pka-team, continue: true, so they
#    =~ vdhmini01|vdhllmsrv01) ALSO follow every route below (chg-2026-10-24-003)
#   component=mypka-wires  -> ntfy-day 07-23 / ntfy-night 23-07, never HA
#   severity=critical      -> ha-critical   (UNCHANGED HA webhook), continue
#   critical, 07-23 local  -> ntfy-critical (priority 4)
#   warning,  07-23 local  -> ntfy-day      (priority 3)
#   warn/crit 23-07 local  -> ntfy-night    (priority 1 = no sound, no vibration;
#                                            the 07:00 aiops-morning-summary
#                                            CronJob re-posts the night's list)
#   anything else (info)   -> ntfy-low      (priority 1, never sounds)
#
# ntfy server: the SELF-HOSTED ntfy (chg-2026-10-13-005), topic "alerts",
# in-cluster http://ntfy.ntfy.svc.cluster.local/alerts. Auth: bearer token
# from Secret ntfy-alertmanager-token (write-only on "alerts" and "pka-team"), mounted by
# alertmanagerSpec.secrets at /etc/alertmanager/secrets/ntfy-alertmanager-token/
# and read via credentials_file. The cluster sends NOTHING to ntfy.sh any more
# (2026-10-13: the public relay's 250/day per-IP quota was exhausted, Mack
# AGR-078; critical-only mode 64a4b36 ended with this switch).
# The URL query carries only the message template and priority (tpl=1, p, t,
# m), no secret. Repeat: 24h for warning and info, 12h for critical.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secret
  namespace: observability
stringData:
  alertmanager.yaml: |
    route:
      receiver: ntfy-low
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 24h
      routes:
        - matchers:
            - alertname = InfoInhibitor
          receiver: "null"
        # Dead man's switch: Watchdog -> null. Its presence in Alertmanager
        # IS the heartbeat; the Macs poll it over the LAN (see header).
        - matchers:
            - alertname = Watchdog
          receiver: "null"
        # Mac host alerts -> team channel ntfy topic pka-team, IN ADDITION to
        # everything below (chg-2026-10-24-003, Larry 24-10, inc-2026-10-23-002
        # option c). Scope: alerts about the two always-on Macs. node_exporter
        # alerts (job mac-node: MacDiskSpaceLow/Critical, MacNodeDown,
        # MacAgentStale, MacRebooted, MacKernelPanic, PkaChecker*) carry the
        # scrape label host; the blackbox ssh/ping probes carry target_friendly
        # instead, hence two sibling routes (matchers AND, no OR across labels).
        # Every route here has continue: true, so the existing ntfy "alerts" /
        # HA routing below sees each alert unchanged. No phone subscribes to
        # pka-team; night (23-07) still goes out at priority 1. Critical ones
        # also get one handoff line to Larry per day from the Mini
        # (hack/ops/host-alert-handoff.sh, launchd net.vdhict.host-alert-handoff).
        - matchers:
            - host =~ "vdhmini01|vdhllmsrv01"
          receiver: ntfy-team-night
          continue: true
          routes:
            - matchers:
                - host =~ "vdhmini01|vdhllmsrv01"
              receiver: ntfy-team-day
              active_time_intervals:
                - daytime-amsterdam
              continue: true
            - matchers:
                - host =~ "vdhmini01|vdhllmsrv01"
              receiver: ntfy-team-night
              active_time_intervals:
                - night-amsterdam
        - matchers:
            - target_friendly =~ "vdhmini01|vdhllmsrv01"
          receiver: ntfy-team-night
          continue: true
          routes:
            - matchers:
                - target_friendly =~ "vdhmini01|vdhllmsrv01"
              receiver: ntfy-team-day
              active_time_intervals:
                - daytime-amsterdam
              continue: true
            - matchers:
                - target_friendly =~ "vdhmini01|vdhllmsrv01"
              receiver: ntfy-team-night
              active_time_intervals:
                - night-amsterdam
        # mypka CronJob heartbeat + failed-Job alerts (chg-2026-10-07-007,
        # PrometheusRule mypka-wires-heartbeat). ntfy only, never HA: this
        # route sits BEFORE the severity=critical/ha-critical route and has
        # no continue, so nothing below sees these alerts. 07-23 local ->
        # ntfy-day (priority 3); 23-07 -> ntfy-night (priority 1, silent),
        # re-posted by the 07:00 morning summary.
        - matchers:
            - component = mypka-wires
          receiver: ntfy-night
          routes:
            - matchers:
                - component = mypka-wires
              receiver: ntfy-day
              active_time_intervals:
                - daytime-amsterdam
              # Routing ignores time intervals (they only mute), so continue
              # is needed for the night sibling to be reached at all.
              continue: true
            - matchers:
                - component = mypka-wires
              receiver: ntfy-night
              active_time_intervals:
                - night-amsterdam
        - matchers:
            - severity = critical
          receiver: ha-critical
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          continue: true
          routes:
            # vikunja-sync (chg-2026-10-01-001): a nice-to-have sync, so it
            # never notifies at night. active_time_intervals mutes BOTH
            # firing and resolved notifications outside 07:00-23:00
            # Europe/Amsterdam (DST-correct; the image ships
            # usr/share/zoneinfo). A failure still firing at 07:00 is sent
            # then. Receiver inherited (ha-critical); no other alert affected.
            - matchers:
                - component = vikunja-sync
              active_time_intervals:
                - daytime-amsterdam
            # AIOps rules (chg-2026-10-12-009): their criticals (cert < 7d,
            # token < 3d, ...) reach HA only by day; at night they go to the
            # silent ntfy-night route below and the morning summary.
            - matchers:
                - component =~ "aiops-.*"
              active_time_intervals:
                - daytime-amsterdam
        - matchers:
            - severity = critical
          receiver: ntfy-critical
          repeat_interval: 12h
          active_time_intervals:
            - daytime-amsterdam
          continue: true
        - matchers:
            - severity = warning
          receiver: ntfy-day
          active_time_intervals:
            - daytime-amsterdam
          continue: true
        - matchers:
            - severity =~ "warning|critical"
          receiver: ntfy-night
          active_time_intervals:
            - night-amsterdam
    inhibit_rules:
      # Chart defaults that were lost when this file replaced the chart config.
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ "warning|info"
        equal: ["namespace", "alertname"]
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal: ["namespace", "alertname"]
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal: ["namespace"]
    time_intervals:
      - name: daytime-amsterdam
        time_intervals:
          - times:
              - start_time: "07:00"
                end_time: "23:00"
            location: Europe/Amsterdam
      - name: night-amsterdam
        time_intervals:
          - times:
              - start_time: "23:00"
                end_time: "24:00"
              - start_time: "00:00"
                end_time: "07:00"
            location: Europe/Amsterdam
    receivers:
      - name: "null"
      - name: ha-critical
        webhook_configs:
          - url: http://home-assistant.home-automation.svc.cluster.local:8123/api/webhook/alertmanager-critical
            send_resolved: true
      - name: ntfy-critical
        webhook_configs:
          - url: "http://ntfy.ntfy.svc.cluster.local/alerts?tpl=1&p=4&t=%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7Dresolved%7B%7Belse%7D%7D%7B%7Bor%20.commonLabels.severity%20%22alert%22%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.commonLabels.alertname%20.groupLabels.alertname%20%22grouped%22%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%201%7D%7D%20%28x%7B%7Blen%20.alerts%7D%7D%29%7B%7Bend%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DRESOLVED%7B%7Belse%7D%7DFIRING%7B%7Bend%7D%7D%20%7B%7B.labels.alertname%7D%7D%7B%7Bif%20.labels.namespace%7D%7D%20ns%3D%7B%7B.labels.namespace%7D%7D%7B%7Bend%7D%7D%7B%7Bif%20.labels.instance%7D%7D%20%7B%7B.labels.instance%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.annotations.summary%20.annotations.description%20%22%28no%20summary%29%22%7D%7D%0A%7B%7Bend%7D%7D"
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager-token/token
            send_resolved: true
            max_alerts: 10
      - name: ntfy-day
        webhook_configs:
          - url: "http://ntfy.ntfy.svc.cluster.local/alerts?tpl=1&p=3&t=%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7Dresolved%7B%7Belse%7D%7D%7B%7Bor%20.commonLabels.severity%20%22alert%22%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.commonLabels.alertname%20.groupLabels.alertname%20%22grouped%22%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%201%7D%7D%20%28x%7B%7Blen%20.alerts%7D%7D%29%7B%7Bend%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DRESOLVED%7B%7Belse%7D%7DFIRING%7B%7Bend%7D%7D%20%7B%7B.labels.alertname%7D%7D%7B%7Bif%20.labels.namespace%7D%7D%20ns%3D%7B%7B.labels.namespace%7D%7D%7B%7Bend%7D%7D%7B%7Bif%20.labels.instance%7D%7D%20%7B%7B.labels.instance%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.annotations.summary%20.annotations.description%20%22%28no%20summary%29%22%7D%7D%0A%7B%7Bend%7D%7D"
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager-token/token
            send_resolved: true
            max_alerts: 10
      - name: ntfy-night
        webhook_configs:
          - url: "http://ntfy.ntfy.svc.cluster.local/alerts?tpl=1&p=1&t=%5Bnight%5D%20%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7Dresolved%7B%7Belse%7D%7D%7B%7Bor%20.commonLabels.severity%20%22alert%22%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.commonLabels.alertname%20.groupLabels.alertname%20%22grouped%22%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%201%7D%7D%20%28x%7B%7Blen%20.alerts%7D%7D%29%7B%7Bend%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DRESOLVED%7B%7Belse%7D%7DFIRING%7B%7Bend%7D%7D%20%7B%7B.labels.alertname%7D%7D%7B%7Bif%20.labels.namespace%7D%7D%20ns%3D%7B%7B.labels.namespace%7D%7D%7B%7Bend%7D%7D%7B%7Bif%20.labels.instance%7D%7D%20%7B%7B.labels.instance%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.annotations.summary%20.annotations.description%20%22%28no%20summary%29%22%7D%7D%0A%7B%7Bend%7D%7D"
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager-token/token
            send_resolved: true
            max_alerts: 10
      # Team channel (chg-2026-10-24-003): same templates as ntfy-day /
      # ntfy-night, topic pka-team instead of alerts. Same bearer token;
      # its ACL is alertmanager:pka-team:wo (ntfy HelmRelease NTFY_AUTH_ACCESS).
      - name: ntfy-team-day
        webhook_configs:
          - url: "http://ntfy.ntfy.svc.cluster.local/pka-team?tpl=1&p=3&t=%5Bteam%5D%20%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7Dresolved%7B%7Belse%7D%7D%7B%7Bor%20.commonLabels.severity%20%22alert%22%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.commonLabels.alertname%20.groupLabels.alertname%20%22grouped%22%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%201%7D%7D%20%28x%7B%7Blen%20.alerts%7D%7D%29%7B%7Bend%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DRESOLVED%7B%7Belse%7D%7DFIRING%7B%7Bend%7D%7D%20%7B%7B.labels.alertname%7D%7D%7B%7Bif%20.labels.namespace%7D%7D%20ns%3D%7B%7B.labels.namespace%7D%7D%7B%7Bend%7D%7D%7B%7Bif%20.labels.instance%7D%7D%20%7B%7B.labels.instance%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.annotations.summary%20.annotations.description%20%22%28no%20summary%29%22%7D%7D%0A%7B%7Bend%7D%7D"
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager-token/token
            send_resolved: true
            max_alerts: 10
      - name: ntfy-team-night
        webhook_configs:
          - url: "http://ntfy.ntfy.svc.cluster.local/pka-team?tpl=1&p=1&t=%5Bteam%5D%5Bnight%5D%20%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7Dresolved%7B%7Belse%7D%7D%7B%7Bor%20.commonLabels.severity%20%22alert%22%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.commonLabels.alertname%20.groupLabels.alertname%20%22grouped%22%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%201%7D%7D%20%28x%7B%7Blen%20.alerts%7D%7D%29%7B%7Bend%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DRESOLVED%7B%7Belse%7D%7DFIRING%7B%7Bend%7D%7D%20%7B%7B.labels.alertname%7D%7D%7B%7Bif%20.labels.namespace%7D%7D%20ns%3D%7B%7B.labels.namespace%7D%7D%7B%7Bend%7D%7D%7B%7Bif%20.labels.instance%7D%7D%20%7B%7B.labels.instance%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.annotations.summary%20.annotations.description%20%22%28no%20summary%29%22%7D%7D%0A%7B%7Bend%7D%7D"
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager-token/token
            send_resolved: true
            max_alerts: 10
      - name: ntfy-low
        webhook_configs:
          - url: "http://ntfy.ntfy.svc.cluster.local/alerts?tpl=1&p=1&t=%5Blow%5D%20%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7Dresolved%7B%7Belse%7D%7D%7B%7Bor%20.commonLabels.severity%20%22alert%22%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.commonLabels.alertname%20.groupLabels.alertname%20%22grouped%22%7D%7D%7B%7Bif%20gt%20%28len%20.alerts%29%201%7D%7D%20%28x%7B%7Blen%20.alerts%7D%7D%29%7B%7Bend%7D%7D&m=%7B%7Brange%20.alerts%7D%7D%7B%7Bif%20eq%20.status%20%22resolved%22%7D%7DRESOLVED%7B%7Belse%7D%7DFIRING%7B%7Bend%7D%7D%20%7B%7B.labels.alertname%7D%7D%7B%7Bif%20.labels.namespace%7D%7D%20ns%3D%7B%7B.labels.namespace%7D%7D%7B%7Bend%7D%7D%7B%7Bif%20.labels.instance%7D%7D%20%7B%7B.labels.instance%7D%7D%7B%7Bend%7D%7D%3A%20%7B%7Bor%20.annotations.summary%20.annotations.description%20%22%28no%20summary%29%22%7D%7D%0A%7B%7Bend%7D%7D"
            http_config:
              authorization:
                type: Bearer
                credentials_file: /etc/alertmanager/secrets/ntfy-alertmanager-token/token
            send_resolved: false
            max_alerts: 10
