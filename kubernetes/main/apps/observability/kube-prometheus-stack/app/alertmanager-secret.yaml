---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/v1/secret.json
#
# Alertmanager routing (chg-2026-10-12-009, AIOps step 1).
#
# Story: every warning or critical alert reaches a human on ntfy, loud by day
# and silent by night, and the Watchdog proves the path works.
#
#   InfoInhibitor          -> "null"        (the ONLY null route, by design)
#   component=mypka-wires  -> ntfy-day 07-23 / ntfy-night 23-07, never HA
#   Watchdog               -> heartbeat     (ntfy heartbeat topic every ~5 min;
#                                            the Mini and the Studio alert when
#                                            it stops, see hack/aiops/README.md)
#   severity=critical      -> ha-critical   (UNCHANGED HA webhook), continue
#   critical, 07-23 local  -> ntfy-critical (priority 4)
#   warning,  07-23 local  -> ntfy-day      (priority 3)
#   warn/crit 23-07 local  -> ntfy-night    (priority 1 = no sound, no vibration;
#                                            the 07:00 aiops-morning-summary
#                                            CronJob re-posts the night's list)
#   anything else (info)   -> ntfy-low      (priority 1, never sounds)
#
# The ntfy URLs (secret topic + message template + priority) are NOT in this
# file: they are read via url_file from the SOPS secret alertmanager-ntfy,
# mounted by alertmanagerSpec.secrets at /etc/alertmanager/secrets/.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secret
  namespace: observability
stringData:
  alertmanager.yaml: |
    route:
      receiver: ntfy-low
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers:
            - alertname = InfoInhibitor
          receiver: "null"
        # Dead man's switch THROTTLED 2026-10-13 (Mack, AGR-078): every 4 min on public ntfy.sh exhausted the
        # per-IP quota (250/day) shared with pka-alert. 12h until the heartbeat moves off ntfy.sh (LAN path).
        - matchers:
            - alertname = Watchdog
          receiver: heartbeat
          group_wait: 0s
          group_interval: 1m
          repeat_interval: 12h
        # mypka CronJob heartbeat + failed-Job alerts (chg-2026-10-07-007,
        # PrometheusRule mypka-wires-heartbeat). ntfy only, never HA: this
        # route sits BEFORE the severity=critical/ha-critical route and has
        # no continue, so nothing below sees these alerts. 07-23 local ->
        # ntfy-day (priority 3); 23-07 -> ntfy-night (priority 1, silent),
        # re-posted by the 07:00 morning summary.
        - matchers:
            - component = mypka-wires
          receiver: ntfy-night
          routes:
            - matchers:
                - component = mypka-wires
              receiver: ntfy-day
              active_time_intervals:
                - daytime-amsterdam
              # Routing ignores time intervals (they only mute), so continue
              # is needed for the night sibling to be reached at all.
              continue: true
            - matchers:
                - component = mypka-wires
              receiver: ntfy-night
              active_time_intervals:
                - night-amsterdam
        - matchers:
            - severity = critical
          receiver: ha-critical
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          continue: true
          routes:
            # vikunja-sync (chg-2026-10-01-001): a nice-to-have sync, so it
            # never notifies at night. active_time_intervals mutes BOTH
            # firing and resolved notifications outside 07:00-23:00
            # Europe/Amsterdam (DST-correct; the image ships
            # usr/share/zoneinfo). A failure still firing at 07:00 is sent
            # then. Receiver inherited (ha-critical); no other alert affected.
            - matchers:
                - component = vikunja-sync
              active_time_intervals:
                - daytime-amsterdam
            # AIOps rules (chg-2026-10-12-009): their criticals (cert < 7d,
            # token < 3d, ...) reach HA only by day; at night they go to the
            # silent ntfy-night route below and the morning summary.
            - matchers:
                - component =~ "aiops-.*"
              active_time_intervals:
                - daytime-amsterdam
        - matchers:
            - severity = critical
          receiver: ntfy-critical
          active_time_intervals:
            - daytime-amsterdam
          continue: true
        - matchers:
            - severity = warning
          receiver: ntfy-day
          active_time_intervals:
            - daytime-amsterdam
          continue: true
        - matchers:
            - severity =~ "warning|critical"
          receiver: ntfy-night
          active_time_intervals:
            - night-amsterdam
    inhibit_rules:
      # Chart defaults that were lost when this file replaced the chart config.
      - source_matchers:
          - severity = critical
        target_matchers:
          - severity =~ "warning|info"
        equal: ["namespace", "alertname"]
      - source_matchers:
          - severity = warning
        target_matchers:
          - severity = info
        equal: ["namespace", "alertname"]
      - source_matchers:
          - alertname = InfoInhibitor
        target_matchers:
          - severity = info
        equal: ["namespace"]
    time_intervals:
      - name: daytime-amsterdam
        time_intervals:
          - times:
              - start_time: "07:00"
                end_time: "23:00"
            location: Europe/Amsterdam
      - name: night-amsterdam
        time_intervals:
          - times:
              - start_time: "23:00"
                end_time: "24:00"
              - start_time: "00:00"
                end_time: "07:00"
            location: Europe/Amsterdam
    receivers:
      - name: "null"
      - name: ha-critical
        webhook_configs:
          - url: http://home-assistant.home-automation.svc.cluster.local:8123/api/webhook/alertmanager-critical
            send_resolved: true
      - name: heartbeat
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/heartbeat-url
            send_resolved: false
            max_alerts: 1
      - name: ntfy-critical
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/critical-url
            send_resolved: true
            max_alerts: 10
      - name: ntfy-day
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/day-url
            send_resolved: true
            max_alerts: 10
      - name: ntfy-night
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/night-url
            send_resolved: true
            max_alerts: 10
      - name: ntfy-low
        webhook_configs:
          - url_file: /etc/alertmanager/secrets/alertmanager-ntfy/low-url
            send_resolved: false
            max_alerts: 10
