---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/v1/secret.json
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-secret
  namespace: observability
stringData:
  alertmanager.yaml: |
    route:
      receiver: "null"
      group_by: ["alertname", "severity"]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers:
            - severity = critical
          receiver: ha-critical
          group_wait: 30s
          group_interval: 5m
          repeat_interval: 12h
          routes:
            # vikunja-sync (chg-2026-10-01-001): a nice-to-have sync, so it
            # never notifies at night. active_time_intervals mutes BOTH
            # firing and resolved notifications outside 07:00-23:00
            # Europe/Amsterdam (DST-correct; the image ships
            # usr/share/zoneinfo). A failure still firing at 07:00 is sent
            # then. Receiver inherited (ha-critical); no other alert affected.
            - matchers:
                - component = vikunja-sync
              active_time_intervals:
                - daytime-amsterdam
    time_intervals:
      - name: daytime-amsterdam
        time_intervals:
          - times:
              - start_time: "07:00"
                end_time: "23:00"
            location: Europe/Amsterdam
    receivers:
      - name: "null"
      - name: ha-critical
        webhook_configs:
          - url: http://home-assistant.home-automation.svc.cluster.local:8123/api/webhook/alertmanager-critical
            send_resolved: true
