---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# Heartbeat + failed-Job alerts for the mypka cluster-wires CronJobs
# (chg-2026-10-07-007). Lives in observability, not in the tenant namespace:
# the rule is ours, so the tenant Kustomization (cluster-wires) can never
# prune or alter it.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mypka-wires-alerts
  namespace: flux-system
spec:
  targetNamespace: observability
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  interval: 1h
  retryInterval: 1m
  timeout: 5m
  prune: true
  path: ./kubernetes/main/apps/observability/mypka-wires-alerts/app
  sourceRef:
    kind: GitRepository
    name: flux-system
