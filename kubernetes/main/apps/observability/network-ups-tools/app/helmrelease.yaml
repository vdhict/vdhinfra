---
# yaml-language-server: $schema=https://schemas.zinn.ca/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: network-ups-tools
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    defaultPodOptions:
      nodeSelector:
        feature.node.kubernetes.io/ups: "true"
    controllers:
      network-ups-tools:
        replicas: 1
        containers:
          network-ups-tools:
            image:
              repository: ghcr.io/jr0dd/network-ups-tools
              tag: v2.8.3@sha256:9f8e14d155c6ef05940cee6f8861e259e951eb11750aeddd02539d986dac1ca0
              pullPolicy: IfNotPresent
            resources:
              limits:
                memory: 128Mi
              requests:
                cpu: 25m
                memory: 128Mi
            probes:
              # The default TCP probe only proves upsd listens. On 2026-07-13
              # the usbhid-ups driver lost the UPS (USB still enumerated) and
              # upsd served "Data stale" for 3 months behind a green probe;
              # nut-exporter logged EOF the whole time. Probe the DATA instead:
              # upsc exits 1 on "Data stale", so kubelet restarts the pod and
              # the driver re-attaches. 60 s x 5 = 5 min of stale data first.
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: ["sh", "-c", "upsc kubernetes@localhost ups.status >/dev/null 2>&1"]
                  initialDelaySeconds: 120
                  periodSeconds: 60
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness:
                enabled: true
            securityContext:
              privileged: true
    service:
      network-ups-tools:
        controller: network-ups-tools
        ports:
          http:
            port: 3493
            protocol: TCP
    persistence:
      # /etc/nut is ONE projected volume: the plain config from the ConfigMap
      # below plus upsd.users from the SOPS Secret, so the NUT admin password
      # never sits in a ConfigMap (chg-2026-10-13-011, UPS calibration).
      config:
        type: custom
        volumeSpec:
          projected:
            defaultMode: 0400
            sources:
              - configMap:
                  name: network-ups-tools-config
              - secret:
                  name: network-ups-tools-users
        globalMounts:
          - path: /etc/nut
    configMaps:
      config:
        data:
          nut.conf: |-
            MODE=netserver
          upsd.conf: |-
            LISTEN 0.0.0.0 3493
          ups.conf: |-
            [kubernetes]
            driver = usbhid-ups
            port = auto
            desc = "APC Back-UPS 900"
