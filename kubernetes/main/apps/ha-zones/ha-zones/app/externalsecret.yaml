---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
# ha-zones credentials, ALL from 1Password (vault home-infra, ClusterSecretStore
# onepassword-connect) via ESO. Nothing is SOPS and nothing is in Git: this
# repo is public. Coordinates never enter Git or a ConfigMap (Argus C6).
#
# Two items, both PLACEHOLDER names until created (attended, C6):
#
#   item `ha-zones` (C6: its own item, NOT item cluster-wires)
#     field HA_ADMIN_TOKEN      the LLAT of the dedicated HA user (a JWT)
#     field HA_HOME_LATLON      "lat,lon" in decimal degrees (home)
#     field HA_PROTECTED_LATLON "lat,lon;lat,lon" (C5), or the literal word
#                               none when there are no protected places.
#                               The field must exist; "none" renders empty,
#                               which zones_apply reads as no places.
#   -> Secret ha-zones, used ONLY as env (secretKeyRef) in the apply
#      container; never mounted, never in the init container.
#
#   item `ha-zones-git`
#     field exchange_key  READ-ONLY forge deploy key on VDHICT/cluster-wires-exchange
#                         ONLY (C7; never the exchange-rw key)
#     field source_key    READ-ONLY forge deploy key on source/pka-trip-autopilot
#                         ONLY (the code at the pinned commit)
#   -> Secret ha-zones-git, mounted ONLY in the fetch init container.
#
# Shape checks fail the ExternalSecret (and the Flux Kustomization, wait:
# true) instead of every Job. The fail messages are constants; they never
# echo a value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-zones
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ha-zones
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        HA_ADMIN_TOKEN: >-
          {{- $t := trim .HA_ADMIN_TOKEN -}}
          {{- if not (hasPrefix "eyJ" $t) -}}{{- /* guard: ha-zones: HA_ADMIN_TOKEN is not a JWT */ -}}{{- $.ESO_GUARD_REFUSED_TO_RENDER -}}{{- end -}}
          {{ $t }}
        HA_HOME_LATLON: >-
          {{- $h := trim .HA_HOME_LATLON -}}
          {{- if not (regexMatch "^-?[0-9]{1,3}\\.[0-9]+,-?[0-9]{1,3}\\.[0-9]+$" $h) -}}{{- /* guard: ha-zones: HA_HOME_LATLON is not lat,lon */ -}}{{- $.ESO_GUARD_REFUSED_TO_RENDER -}}{{- end -}}
          {{ $h }}
        HA_PROTECTED_LATLON: >-
          {{- $p := trim .HA_PROTECTED_LATLON -}}
          {{- if ne $p "none" -}}
          {{- if not (regexMatch "^-?[0-9]{1,3}\\.[0-9]+,-?[0-9]{1,3}\\.[0-9]+(;-?[0-9]{1,3}\\.[0-9]+,-?[0-9]{1,3}\\.[0-9]+)*$" $p) -}}{{- /* guard: ha-zones: HA_PROTECTED_LATLON is not lat,lon;... or none */ -}}{{- $.ESO_GUARD_REFUSED_TO_RENDER -}}{{- end -}}
          {{ $p }}
          {{- end -}}
  data:
    - secretKey: HA_ADMIN_TOKEN
      remoteRef: {key: ha-zones, property: HA_ADMIN_TOKEN}
    - secretKey: HA_HOME_LATLON
      remoteRef: {key: ha-zones, property: HA_HOME_LATLON}
    - secretKey: HA_PROTECTED_LATLON
      remoteRef: {key: ha-zones, property: HA_PROTECTED_LATLON}
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ha-zones-git
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: ha-zones-git
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        exchange_key: >-
          {{- if not (hasPrefix "-----BEGIN OPENSSH PRIVATE KEY-----" (trim .exchange_key)) -}}{{- /* guard: ha-zones: exchange_key is not an OpenSSH private key */ -}}{{- $.ESO_GUARD_REFUSED_TO_RENDER -}}{{- end -}}
          {{ .exchange_key }}
        source_key: >-
          {{- if not (hasPrefix "-----BEGIN OPENSSH PRIVATE KEY-----" (trim .source_key)) -}}{{- /* guard: ha-zones: source_key is not an OpenSSH private key */ -}}{{- $.ESO_GUARD_REFUSED_TO_RENDER -}}{{- end -}}
          {{ .source_key }}
  data:
    - secretKey: exchange_key
      remoteRef: {key: ha-zones-git, property: exchange_key}
    - secretKey: source_key
      remoteRef: {key: ha-zones-git, property: source_key}
