---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The ha-zones CNPs land BEFORE the job (ha-zones dependsOn this), so no
# ha-zones pod ever runs with open egress, on every path: a combined push,
# a DR rebuild or a re-bootstrap.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ha-zones-network-policies
  namespace: flux-system
spec:
  targetNamespace: ha-zones
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: ha-zones
  path: ./kubernetes/main/apps/ha-zones/network-policies/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
