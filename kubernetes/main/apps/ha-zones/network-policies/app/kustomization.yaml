---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# ha-zones network policy (wq-097 C7). Same model as vikunja:
#   default-deny for every pod in the namespace (no ingress, no egress), then
#   ha-zones  in:  nothing
#             out: DNS (three names), Home Assistant TCP 8123, Forgejo pod
#                  (devtools) TCP 2222.
# No internet, no envoy-internal (inc-2026-09-26-001), no API server.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./default-deny.yaml
  - ./ha-zones.yaml
