---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app home-assistant
spec:
  interval: 30m
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      home-assistant:
        initContainers:
          init-db:
            image:
              repository: ghcr.io/onedr0p/postgres-init
              tag: 16
            envFrom: &envFrom
              - secretRef:
                  name: home-assistant-secret
        containers:
          # code-server sidecar removed (chg-2026-11-21-002, inc-2026-09-26-001):
          # it was an unauthenticated root shell on /config. Edit config via git/kubectl.
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.11.2@sha256:28ae630554f1f2dd43ecbdecad9d974f09f02b17a0a769a290ceec094ec427dc
            env:
              HASS_EXTERNAL_URL: https://hass.${SECRET_DOMAIN}
              HASS_PURGE_KEEP_DAYS: 30
              HASS_UNIT_SYSTEM: metric
              TZ: "Europe/Amsterdam"
              POSTGRES_HOST:
              POSTGRES_DB: home_assistant
              HASS_HTTP_TRUSTED_PROXY_1: 10.43.0.0/16
              HASS_HTTP_TRUSTED_PROXY_2: 172.16.2.0/23
              HASS_HTTP_TRUSTED_PROXY_3: 192.168.12.0/24
            envFrom: *envFrom
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 5Gi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL

    defaultPodOptions:
      hostNetwork: true
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 0
        fsGroupChangePolicy: OnRootMismatch

    route:
      # LAN-only since chg-2026-10-05-020 (public tunnel decommissioned).
      # Remote access is Nabu Casa (HA external_url, set in HA's own config,
      # not here). controller:none keeps both Cloudflare external-dns
      # instances off; external-dns-unifi still writes the LAN A record
      # (hass -> envoy-internal LB IP), owner TXT resource unchanged because
      # the route keeps its name (home-assistant-main).
      main:
        annotations:
          external-dns.alpha.kubernetes.io/controller: none
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - hass.${SECRET_DOMAIN}
        rules:
          - backendRefs:
              - name: home-assistant
                port: 8123
      # LAN-only kiosk hostname. No Cloudflare DNS entry; no AAAA leakage.
      # Lets the kitchen tablet keep `local_only: True` on its user.
      kiosk:
        annotations:
          external-dns.alpha.kubernetes.io/controller: none
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - keuken.${SECRET_DOMAIN}
          - kantoor.${SECRET_DOMAIN}
        rules:
          - backendRefs:
              - name: home-assistant
                port: 8123

    persistence:
      config:
        type: persistentVolumeClaim
        storageClass: rook-ceph-block
        accessMode: ReadWriteOnce
        size: 75Gi
        globalMounts:
          - path: /config
      tmp:
        type: emptyDir
      homedir:
        type: persistentVolumeClaim
        storageClass: rook-ceph-block
        accessMode: ReadWriteOnce
        size: 10Gi
        globalMounts:
          - path: /root

    service:
      app:
        controller: *app
        annotations:
          lbipam.cilium.io/ips: "172.16.2.237"
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: 8123
