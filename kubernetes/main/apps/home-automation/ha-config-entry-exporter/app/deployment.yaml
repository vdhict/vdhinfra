---
# yaml-language-server: $schema=https://kubernetes-schemas.ok8.sh/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ha-config-entry-exporter
  labels:
    app.kubernetes.io/name: ha-config-entry-exporter
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: ha-config-entry-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ha-config-entry-exporter
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: exporter
          # Same image as ceph-smart-exporter (python3 stdlib only is used here).
          image: ghcr.io/vdhict/cluster-health:v0.3.0@sha256:18d770e1e59f08f0fa884992844ffd38f842475e4700b2aa0224a529c592764c
          imagePullPolicy: IfNotPresent
          command: ["python3", "-I", "/scripts/exporter.py"]
          env:
            - name: HA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: home-assistant-prometheus-token
                  key: token
            - name: POLL_INTERVAL
              value: "60"
            - name: LISTEN_PORT
              value: "9102"
          ports:
            - name: metrics
              containerPort: 9102
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 30
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 30
            periodSeconds: 60
            failureThreshold: 5
          resources:
            requests:
              cpu: 5m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 96Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: exceptions
              mountPath: /exceptions
              readOnly: true
      volumes:
        - name: scripts
          configMap:
            name: ha-config-entry-exporter-scripts
            defaultMode: 0555
        - name: exceptions
          configMap:
            name: ha-config-entry-exceptions
            optional: true
