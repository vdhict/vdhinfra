---
# MinIO root creds mapped to the AWS S3 client env names barman expects.
# Reuses the existing 1Password "minio" item - no new 1P fields needed -
# exactly as database/postgres16 does. The bucket differs (forge-backups,
# not cnpg-backups); see the comment in cluster.yaml for why that matters.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forge-pg-backup
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forge-pg-backup-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: minio
        property: MINIO_ROOT_USER
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: minio
        property: MINIO_ROOT_PASSWORD
