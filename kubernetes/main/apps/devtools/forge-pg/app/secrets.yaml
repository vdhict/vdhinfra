---
# barman's S3 credentials: the SCOPED MinIO user `forge-pg`, NOT MinIO root.
#
# WHY SCOPED - do not "simplify" this back to the shared `minio` item:
#   MinIO root reads EVERY bucket, including s3://cnpg-backups, which holds
#   the household's authelia / lldap / home_assistant / grafana barman dumps
#   gzip-compressed and NOT encrypted. devtools hosts the forge and, from P7,
#   CI runners that execute third-party code. Root here would let anything
#   that reads this Secret read the family's password hashes and TOTP seeds,
#   and delete backups that the offsite mirror then deletes from Azure too.
#   (Argus sec-01/sec-02 on chg-2026-09-18-002.)
#
#   `forge-pg` carries exactly one policy, forge-backups-rw: list/get/put/
#   delete on s3://forge-backups and nothing else. DeleteObject is in it
#   because barman enforces retentionPolicy 14d by deleting expired objects.
#   Proven: HTTP 403 on every other bucket and on the admin API
#   (hack/minio-iam, chg-2026-09-23-002).
#
# The values live in their OWN 1Password item, `minio-forge-pg`, never in the
# `minio` item: the shared item also holds the root pair, VOLSYNC_REPO_PASSWORD
# and AZURE_STORAGE_KEY, and this namespace should never need to reference it.
#
# The MinIO user must exist BEFORE this lands (hack/minio-iam/run.sh apply);
# after a MinIO rebuild it must be re-created (DR runbook section A.4b), or
# every backup fails with AccessDenied.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forge-pg-backup
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forge-pg-backup-secret
    creationPolicy: Owner
  data:
    - secretKey: AWS_ACCESS_KEY_ID
      remoteRef:
        key: minio-forge-pg
        property: ACCESS_KEY
    - secretKey: AWS_SECRET_ACCESS_KEY
      remoteRef:
        key: minio-forge-pg
        property: SECRET_KEY
