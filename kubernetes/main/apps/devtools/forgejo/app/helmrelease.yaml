---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: forgejo
spec:
  interval: 30m
  maxHistory: 2
  chartRef:
    kind: OCIRepository
    name: forgejo
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  # P4-K2: the SSH LoadBalancer must NOT allocate a NodePort. The devtools
  # ResourceQuota sets services.nodeports: 0 on purpose (P1), and a default
  # LoadBalancer Service asks for one, so without this the Service is
  # rejected at admission (measured: "exceeded quota: devtools, requested:
  # services.nodeports=1") and the Helm upgrade fails. It also keeps SSH off
  # a high port on every node IP. Cilium kube-proxy replacement serves the
  # LB IP itself and does not need the NodePort. The chart has no value for
  # this field, hence the post-render patch. First use of both
  # allocateLoadBalancerNodePorts:false and postRenderers in this estate -
  # the K2 end-to-end SSH test is what proves it.
  postRenderers:
    - kustomize:
        patches:
          - target:
              version: v1
              kind: Service
              name: forgejo-ssh
            patch: |
              - op: add
                path: /spec/allocateLoadBalancerNodePorts
                value: false
  values:
    image:
      # Chart default is rootless: true and the chart's image helper appends
      # the "-rootless" suffix itself, so tag stays bare and digest is set
      # separately. Resolved image:
      #   code.forgejo.org/forgejo/forgejo:15.0.9-rootless@sha256:caf1bc...
      # Digest verified against the registry as a multi-arch index with a
      # linux/amd64 child.
      tag: 15.0.9
      digest: sha256:caf1bca332f95cdcf124227a4bfa3b49bbbfbbc8a5e4a97406921cb581165413

    # Single replica. Forgejo is not safe to run multi-replica against an
    # RWO volume, and the chart's own strategy default is Recreate.
    replicaCount: 1

    test:
      # The chart's test-connection hook Pod runs `busybox:latest` - an
      # unpinned, non-digest tag, which this repo pins everywhere else.
      # Flux does not run Helm tests unless spec.test.enable is set, so the
      # hook would never execute, but disabling it keeps an unpinned :latest
      # reference out of the release manifest entirely.
      enabled: false

    service:
      http:
        type: ClusterIP
        port: 3000
      ssh:
        # ── P4-K2: git over SSH on its OWN LAN LoadBalancer IP ────────────
        # 172.16.2.248 was proven free ON THE NETWORK by Iris
        # (chg-2026-09-23-001): not a Cilium allocation, not a UniFi fixed-IP
        # reservation, never seen in 1 year of client history, outside the
        # CLIENT-VLAN DHCP scope (.3.x), nc + ARP negative with positive
        # controls. The Cilium l2-pool spans 172.16.2.0/23 and includes the
        # default gateway (inc-2026-09-18-001), so this pin is the ONLY thing
        # choosing the address: if the annotation is ever dropped or garbled,
        # Cilium hands out the lowest free address instead. After landing,
        # status.loadBalancer.ingress MUST read 172.16.2.248; anything else
        # (especially .0 or .1) = revert immediately.
        #
        # ⚠ Hostname is forge-ssh, NEVER forge: external-dns-unifi (which reads
        # this prefixed key) would otherwise write a SECOND `forge` A record
        # (-> .248) beside the HTTPS one (-> .241), and round-robin DNS would
        # send ~half of HTTPS clients to an address with nothing on 443.
        # SSH_DOMAIN below matches. The devtools ResourceQuota allows exactly
        # one LoadBalancer in this namespace - this is it.
        type: LoadBalancer
        port: 22
        annotations:
          lbipam.cilium.io/ips: "172.16.2.248"
          external-dns-unifi.bluejungle.net/hostname: forge-ssh.${SECRET_DOMAIN}

    # ── P4-K1: the HTTPS route is a standalone file (httproute.yaml), NOT the
    # chart's httpRoute block, so it can land and be reverted without a Helm
    # upgrade or a pod restart. Keep this disabled. ROOT_URL/DOMAIN below are
    # pinned explicitly, so the route does not change Forgejo's idea of its
    # own URL.
    httpRoute:
      enabled: false

    persistence:
      enabled: true
      create: true
      claimName: forgejo-data
      size: 50Gi
      accessModes:
        - ReadWriteOnce
      storageClass: rook-ceph-block
      annotations:
        # Chart default, kept deliberately: an uninstall or a Flux prune
        # must not take the git object store with it.
        helm.sh/resource-policy: keep

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        # Memory only. No CPU limit - git gc and clone bursts are exactly
        # the workload CFS throttling hurts. See the devtools ResourceQuota.
        memory: 2Gi

    gitea:
      admin:
        # Bootstrap admin, needed to get in before P5 (Authelia OIDC) exists.
        # PREREQUISITE BEFORE LANDING: a 1Password item named "forgejo" with
        # fields FORGEJO_ADMIN_USER and FORGEJO_ADMIN_PASS. Without it the
        # ExternalSecret stays NotReady and this HelmRelease never goes Ready.
        existingSecret: forgejo-admin-secret
        email: admin@${SECRET_DOMAIN}
        # keepUpdated would re-sync the password from the secret on every
        # pod start, silently reverting a password changed in the UI.
        # initialOnlyNoReset sets it once at creation and then leaves it be.
        passwordMode: initialOnlyNoReset

      metrics:
        # ── SEAM FOR P6 (chg-2026-09-18-004) ─────────────────────────────
        # The chart ships its own ServiceMonitor template; P6 flips these
        # two flags rather than authoring a second ServiceMonitor, which
        # would double-scrape.
        enabled: false
        serviceMonitor:
          enabled: false

      # ── SEAM FOR P5 (Argus + Authelia OIDC, NOT authored here) ─────────
      # P5 appends a single entry here with `existingSecret:` pointing at a
      # 1Password-backed secret and `autoDiscoverUrl` on Authelia. No other
      # values change is required.
      oauth: []

      # The DB password never appears in app.ini as plaintext in Git. The
      # chart's init-app-ini container runs config_environment.sh, which
      # folds FORGEJO__<section>__<key> env vars into app.ini at start-up.
      additionalConfigFromEnvs:
        - name: FORGEJO__database__PASSWD
          valueFrom:
            secretKeyRef:
              # Generated and owned by CNPG for the forge-pg cluster's app
              # role. Nothing to rotate by hand, and no postgres-init
              # initContainer is needed because forge-pg is dedicated and
              # bootstraps the forgejo DB and owner itself.
              name: forge-pg-app
              key: password

      config:
        APP_NAME: "VDH Forge"
        RUN_MODE: prod

        database:
          DB_TYPE: postgres
          HOST: forge-pg-rw.devtools.svc.cluster.local:5432
          NAME: forgejo
          USER: forgejo
          SSL_MODE: require

        server:
          # Pinned NOW, before P4 exists. If these were left to the chart's
          # defaulting they would be derived from httpRoute.hostnames, so
          # turning the route on later would silently change Forgejo's idea
          # of its own URL - which breaks clone URLs and OIDC redirect URIs.
          DOMAIN: forge.${SECRET_DOMAIN}
          ROOT_URL: https://forge.${SECRET_DOMAIN}
          PROTOCOL: http
          HTTP_PORT: 3000
          # forge-ssh, not forge - see the service.ssh comment above. Pinned
          # now so clone URLs do not change when K2 lands.
          SSH_DOMAIN: forge-ssh.${SECRET_DOMAIN}
          SSH_PORT: 22
          SSH_LISTEN_PORT: 2222
          # false since P4-K2: SSH is exposed on 172.16.2.248 (service.ssh).
          # Reverting K2 must set this back to true in the same commit, or
          # the UI advertises git@forge-ssh... clone URLs that lead nowhere.
          DISABLE_SSH: false
          # No SHA-1 on the SSH server (Argus). Forgejo v15.0.9 defaults
          # (modules/setting/ssh.go:60-61) also offer diffie-hellman-group14-
          # sha1 and hmac-sha1. Both lists below are subsets of those
          # defaults, so the bundled golang.org/x/crypto v0.56.0 supports
          # every name. Read from [server] (ssh.go loadSSHFrom).
          SSH_SERVER_KEY_EXCHANGES: mlkem768x25519-sha256,curve25519-sha256,ecdh-sha2-nistp256
          SSH_SERVER_MACS: hmac-sha2-256-etm@openssh.com,hmac-sha2-256
          LFS_START_SERVER: true
          OFFLINE_MODE: true

        service:
          # This forge holds client repositories. Self-registration off,
          # no open sign-up, and new repos private by default.
          DISABLE_REGISTRATION: true
          REQUIRE_SIGNIN_VIEW: true
          DEFAULT_KEEP_EMAIL_PRIVATE: true
          DEFAULT_ALLOW_CREATE_ORGANIZATION: false

        repository:
          DEFAULT_PRIVATE: private
          DEFAULT_PUSH_CREATE_PRIVATE: true
          # Nobody - not even an admin - can make a repository public.
          # Repository visibility changes are outside the programme approval
          # (chg-2026-09-15-003), and the forge holds client and personal data.
          FORCE_PRIVATE: true

        mirror:
          # No user of this forge may create a PUSH mirror, i.e. may not
          # configure a client repository to replicate itself to an external
          # host. Off-site copying of client repos is explicitly NOT covered
          # by chg-2026-09-15-003 and the default is NO, so the feature that
          # would do it is off at the server.
          #
          # PULL mirrors are left enabled - they bring code IN, which is a
          # legitimate way to onboard an existing repository.
          DISABLE_NEW_PUSH: true

        security:
          INSTALL_LOCK: true

        # Single replica on one PVC, so in-process memory/level backends are
        # correct here and there is no Redis/Valkey to run.
        session:
          PROVIDER: db
        cache:
          ADAPTER: memory
        queue:
          TYPE: level

        log:
          LEVEL: Info

        actions:
          # ── SEAM FOR P7 (Studio runner) ────────────────────────────────
          # Enabled so the runner can register later without a Forgejo
          # restart. No runner is registered by this change, so nothing runs.
          ENABLED: true
