---
# Bootstrap admin credentials for Forgejo.
#
# PREREQUISITE BEFORE THIS CAN LAND: a 1Password item named "forgejo" must
# exist in the vault that onepassword-connect serves, with the two fields
# below. It does not exist yet and cannot be created from the cluster. If it
# is missing, this ExternalSecret stays NotReady, the referenced Secret is
# never created, and the HelmRelease will not reach Ready.
#
# Key names are `username` and `password` because that is what the chart's
# deployment template reads out of gitea.admin.existingSecret.
#
# This account is only the way in before P5 (Authelia OIDC) exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: forgejo
        property: FORGEJO_ADMIN_USER
    - secretKey: password
      remoteRef:
        key: forgejo
        property: FORGEJO_ADMIN_PASS
