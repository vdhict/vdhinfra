---
# Bootstrap admin credentials for Forgejo.
#
# 1Password item "forgejo" (vault home-infra), fields FORGEJO_ADMIN_USER and
# FORGEJO_ADMIN_PASS. Created by Sander 2026-09-20; labels verified by Atlas
# (chg-2026-09-18-003). If it goes missing, this ExternalSecret stays
# NotReady, the Secret is never created, and the HelmRelease never goes Ready.
#
# ⚠ FORGEJO_ADMIN_USER must NOT be a reserved name - "admin", "ghost", "user",
# "api", "login", "org" ... (models/user/user.go reservedUsernames, v15.0.9) - the
# chart's configure-gitea init container would fail and the pod never
# starts). Password: at least 8 characters (Forgejo MIN_PASSWORD_LENGTH).
# The chart creates this user ONCE (passwordMode initialOnlyNoReset); a later
# change in 1Password does not reset it.
#
# Key names are `username` and `password` because that is what the chart's
# deployment template reads out of gitea.admin.existingSecret.
#
# This account is the only way in until P5 (Authelia OIDC) exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: forgejo-admin
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: forgejo-admin-secret
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: forgejo
        property: FORGEJO_ADMIN_USER
    - secretKey: password
      remoteRef:
        key: forgejo
        property: FORGEJO_ADMIN_PASS
