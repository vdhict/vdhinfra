---
# Egress allow-list for the waker pod only (it holds the unlock secret).
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: vdhwslin01-waker-egress
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: vdhwslin01-waker
      app.kubernetes.io/component: controller
  egress:
    - toEntities: [kube-apiserver]
      toPorts:
        - ports: [{port: "6443", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: devtools
            app.kubernetes.io/name: forgejo
      toPorts:
        - ports: [{port: "3000", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: home-automation
            app.kubernetes.io/name: home-assistant
      toPorts:
        - ports: [{port: "8123", protocol: TCP}]
    - toCIDR: [172.16.3.205/32]
      toPorts:
        - ports:
            - {port: "22", protocol: TCP}
            - {port: "2222", protocol: TCP}
