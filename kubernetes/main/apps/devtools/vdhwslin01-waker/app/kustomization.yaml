---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secrets.yaml
  - ./rbac.yaml
  - ./state-configmap.yaml
  - ./networkpolicy.yaml
  - ./cronjob.yaml
configMapGenerator:
  - name: vdhwslin01-waker-app
    files:
      - controller.py
  # PUBLIC host keys of the box's initramfs unlock server, as printed by
  # provision.sh. Empty = the controller refuses to wake (fail closed).
  - name: vdhwslin01-waker-known-hosts
    files:
      - known_hosts
  # Forgejo tokens cannot expire; the waker enforces this date itself (Argus
  # F5). Token: mypka-bot, read:repository, restricted to
  # mypka-bot/passkey-point-dotnet, minted 2026-10-13 by
  # hack/forgejo-runner/vdhwslin01/mint-waker-forge-token.py (+90 days).
  # Rotate with that script, then bump this date.
  - name: vdhwslin01-waker-config
    literals:
      - forge_token_expires=2027-01-11
generatorOptions:
  labels:
    app.kubernetes.io/part-of: vdhwslin01-waker
