---
# Unlock material for the vdhwslin01 waker, generated IN-CLUSTER (never on the
# Mini, never printed): an ed25519 keypair for the initramfs ssh unlock server,
# the controller's LUKS keyslot passphrase, and the HA webhook id (Argus R12).
# refreshPolicy CreatedOnce: generated once; rotating means re-running the
# box-side steps, so it never rotates by itself. Prune is disabled so a Flux
# rename can never silently regenerate it.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: vdhwslin01-waker-random
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - luks_passphrase
    - webhook_id
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/generators.external-secrets.io/sshkey_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: SSHKey
metadata:
  name: vdhwslin01-waker-unlock-key
spec:
  keyType: ed25519
  comment: vdhwslin01-waker
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vdhwslin01-waker-unlock
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  refreshPolicy: CreatedOnce
  target:
    name: vdhwslin01-waker-unlock
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: vdhwslin01-waker-random
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: SSHKey
          name: vdhwslin01-waker-unlock-key
---
# The passphrase and webhook id go to 1Password (home-infra, item
# vdhwslin01-controller-unlock) so that Sander can feed the passphrase to
# provision.sh on stdin and Hestia can put the webhook id in HA. The private
# key is NOT pushed: it only ever exists in this namespace.
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/pushsecret_v1alpha1.json
apiVersion: external-secrets.io/v1alpha1
kind: PushSecret
metadata:
  name: vdhwslin01-waker-unlock-to-1p
spec:
  refreshInterval: 1h
  updatePolicy: Replace
  deletionPolicy: None
  secretStoreRefs:
    - name: onepassword-connect
      kind: ClusterSecretStore
  selector:
    secret:
      name: vdhwslin01-waker-unlock
  data:
    - match:
        secretKey: luks_passphrase
        remoteRef:
          remoteKey: vdhwslin01-controller-unlock
          property: luks_passphrase
    - match:
        secretKey: webhook_id
        remoteRef:
          remoteKey: vdhwslin01-controller-unlock
          property: webhook_id
    - match:
        secretKey: publicKey
        remoteRef:
          remoteKey: vdhwslin01-controller-unlock
          property: dropbear_public_key
