---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vdhwslin01-waker
---
# Read/patch its own state ConfigMap, nothing else.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vdhwslin01-waker
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["vdhwslin01-waker-state"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vdhwslin01-waker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: vdhwslin01-waker
subjects:
  - kind: ServiceAccount
    name: vdhwslin01-waker
