---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# vdhwslin01 waker (chg-2026-10-05-031): wakes + unlocks Sander's workstation
# when the forge has queued jobs for its runner. Never powers it off.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vdhwslin01-waker
  namespace: flux-system
spec:
  targetNamespace: devtools
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: external-secrets-stores
    - name: forgejo
  path: ./kubernetes/main/apps/devtools/vdhwslin01-waker/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
