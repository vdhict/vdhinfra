---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The family CNPs land BEFORE the workload (courseware dependsOn this), so no
# courseware pod ever runs with open ingress or egress, on every path:
# a combined push, a DR rebuild or a re-bootstrap.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app family-network-policies
  namespace: flux-system
spec:
  targetNamespace: family
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: family
  path: ./kubernetes/main/apps/family/network-policies/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
