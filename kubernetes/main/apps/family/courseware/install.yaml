---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# courseware (chg-2026-09-21-004): the family AI course, static site, LAN only.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app courseware
  namespace: flux-system
spec:
  targetNamespace: family
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: family
  dependsOn:
    # The CNPs must exist before any courseware pod, on every path.
    - name: family-network-policies
    - name: external-secrets-stores
  path: ./kubernetes/main/apps/family/courseware/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
