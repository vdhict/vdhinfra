---
# https://cursus.${SECRET_DOMAIN} -> envoy-internal (172.16.2.241:443,
# wildcard cert) -> courseware:8080. LAN (and WireGuard) only.
#
# NEVER envoy-external, never the Cloudflare tunnel: household content.
#
# DNS, same as vikunja/forgejo:
#   * external-dns.alpha.kubernetes.io/controller: none keeps BOTH
#     Cloudflare instances off. Without it external-dns-cloudflare-internal
#     would publish a PUBLIC CNAME cursus -> internal.${SECRET_DOMAIN} plus a
#     world-readable TXT naming this route.
#   * external-dns-unifi does NOT read that key (its annotation prefix is
#     external-dns-unifi.bluejungle.net/), so it DOES write the LAN record
#     cursus.${SECRET_DOMAIN} A 172.16.2.241 on the UDM, and removes it on
#     revert. Do NOT also hand-write a static A record.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: courseware
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - cursus.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: courseware
          port: 8080
