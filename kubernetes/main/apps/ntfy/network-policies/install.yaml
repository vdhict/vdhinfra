---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The ntfy CNPs land BEFORE the workload (ntfy dependsOn this), so no ntfy
# pod ever runs with open ingress or egress, on every path: a combined push,
# a DR rebuild or a re-bootstrap.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ntfy-network-policies
  namespace: flux-system
spec:
  targetNamespace: ntfy
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: ntfy
  path: ./kubernetes/main/apps/ntfy/network-policies/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
