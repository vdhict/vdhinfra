---
# ntfy server pod.
#
# In:
#   * envoy-internal (the ntfy.${SECRET_DOMAIN} route: LAN + WireGuard
#     senders, and the phone app) on 8080;
#   * Alertmanager pods, the aiops-morning-summary Job pod and the family-ai
#     gezinsdienst pod (in-cluster
#     publish to the Service, no Envoy hop) on 8080;
#   * Prometheus on the metrics port 9090.
# Out: nothing. Not even DNS: ntfy resolves no names with this config
# (upstream-base-url, Firebase, SMTP and web push are all unset). If iOS
# instant delivery is ever enabled (upstream-base-url), this policy needs an
# explicit toFQDNs ntfy.sh:443 rule plus DNS for that one name - and every
# message then costs one ntfy.sh poll request from the shared public IP.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ntfy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: ntfy
      app.kubernetes.io/controller: ntfy
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: alertmanager
        # The 07:00 aiops morning summary posts with the same write-only
        # token (Sibyl, 2026-10-13).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: aiops-morning-summary
        # gezinsdienst publishes parent alerts (topics gezin/gezin-test)
        # straight to the Service; it must not egress to envoy
        # (inc-2026-09-26-001). Its own egress rule lives in
        # family-ai/network-policies (family-ai gates).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: family-ai
            app.kubernetes.io/name: gezinsdienst
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports: [{port: "9090", protocol: TCP}]
