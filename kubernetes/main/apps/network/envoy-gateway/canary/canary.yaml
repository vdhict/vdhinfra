---
# chg-2026-11-20-080 (wq-017) envoy-gateway upgrade canary. TEMPORARY: pruned after
# the last hop. Two negative probes that must never answer 200:
#   R4b  extAuth to a Service without endpoints, failOpen false -> 403/5xx.
#   R6   BackendTLSPolicy with a wrong validation.hostname     -> 503.
# envoy-internal ONLY (Argus G4). Hostnames are under .invalid, so no
# external-dns instance (domainFilter = cluster domain) creates a record.
# The routes carry no data: R4b answers from a directResponse filter, R6 can
# only reach an upstream if TLS validation wrongly passes (that is the failure).
apiVersion: v1
kind: Service
metadata:
  name: chg080-canary-noep
spec:
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: HTTPRouteFilter
metadata:
  name: chg080-canary-ok
spec:
  directResponse:
    contentType: text/plain
    statusCode: 200
    body:
      type: Inline
      inline: "chg080 canary: extAuth failed OPEN"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chg080-canary-authz
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  hostnames:
    - chg080-canary-authz.invalid
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: gateway.envoyproxy.io
            kind: HTTPRouteFilter
            name: chg080-canary-ok
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: chg080-canary-authz
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: chg080-canary-authz
  extAuth:
    failOpen: false
    headersToExtAuth: [cookie, authorization, x-forwarded-proto, x-forwarded-host, accept, user-agent]
    http:
      backendRefs:
        - name: chg080-canary-noep
          port: 8888
      path: /api/authz/ext-authz/
      headersToBackend: [remote-user, remote-groups]
---
apiVersion: v1
kind: Service
metadata:
  name: chg080-canary-btls
spec:
  type: ClusterIP
  ports:
    - name: https
      port: 5001
      targetPort: 5001
      protocol: TCP
      appProtocol: https
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: chg080-canary-btls
  labels:
    kubernetes.io/service-name: chg080-canary-btls
addressType: IPv4
ports:
  - name: https
    port: 5001
    protocol: TCP
    appProtocol: https
endpoints:
  - addresses:
      - 172.16.2.246
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: chg080-canary-btls
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: chg080-canary-btls
      sectionName: https
  validation:
    wellKnownCACertificates: System
    hostname: wrong-hostname.invalid
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chg080-canary-btls
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  hostnames:
    - chg080-canary-btls.invalid
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  rules:
    - backendRefs:
        - name: chg080-canary-btls
          port: 5001
