---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        replicas: 2
        container:
          resources:
            requests:
              cpu: 100m
            limits:
              memory: 1Gi
      envoyService:
        externalTrafficPolicy: Cluster
  shutdown:
    drainTimeout: 180s
  # telemetry.metrics.prometheus.compression removed 2026-04-08 — Envoy
  # Gateway v1.3.0 generates a Gzip compression block without the
  # `override` subfield required by envoy:distroless-v1.33.x. Result:
  # the proxy fails to start with "Proto constraint validation failed
  # (field: 'override', reason: is required)" and the rolling update
  # gets stuck with zombie pods on the failed RS while the working
  # pods on the previous RS keep serving traffic. Re-enable when
  # bumping envoy-gateway to a version that emits the proper config.
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy
    namespace: network
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  # NO spec.addresses here, on purpose (inc-2026-10-12-013). The IP is pinned by
  # the lbipam.cilium.io/ips annotation below; Cilium LB-IPAM writes it to
  # Service.status.loadBalancer.ingress, and envoy-gateway v1.3.0 then reports
  # exactly that IP in Gateway.status.addresses (internal/gatewayapi/status/
  # gateway.go: no spec.addresses + type LoadBalancer -> ingress IPs).
  # With spec.addresses set, envoy-gateway (a) copies them into
  # Service.spec.externalIPs on EVERY reconcile (any backend EndpointSlice
  # change), which makes Cilium's L2 announcer see an ExternalIPs frontend,
  # drop the service (l2-policy has externalIPs: false) and delete the lease,
  # and (b) reports externalIPs-or-ClusterIP in status. That is the whole
  # reason the status-keeper CronJob existed. Do not re-add spec.addresses.
  infrastructure:
    annotations:
      external-dns.alpha.kubernetes.io/hostname: external.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "${ENVOY_EXTERNAL_LB_IP}"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  annotations:
    external-dns.alpha.kubernetes.io/target: internal.${SECRET_DOMAIN}
spec:
  gatewayClassName: envoy
  # No spec.addresses: see envoy-external above (inc-2026-10-12-013).
  infrastructure:
    annotations:
      external-dns-unifi.bluejungle.net/hostname: internal.${SECRET_DOMAIN}
      lbipam.cilium.io/ips: "${ENVOY_INTERNAL_LB_IP}"
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: ${SECRET_DOMAIN/./-}-production-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: http
    - name: envoy-internal
      namespace: network
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
