---
# Off-cluster backend wiring for the household AI edge: Caddy on the Mac
# Studio (172.16.2.200:443). Same shape as synology-nas in this namespace —
# a selectorless Service plus a hand-managed EndpointSlice — because the
# Studio is not in the cluster and the envoyproxy.io Backend CRD is not
# enabled on this EnvoyProxy config.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/v1/service.json
apiVersion: v1
kind: Service
metadata:
  name: studio-ai
  namespace: network
spec:
  type: ClusterIP
  # No selector: endpoints supplied manually via the EndpointSlice below.
  ports:
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
      appProtocol: https
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/discovery.k8s.io/endpointslice_v1.json
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: studio-ai
  namespace: network
  labels:
    kubernetes.io/service-name: studio-ai
addressType: IPv4
ports:
  - name: https
    port: 443
    protocol: TCP
    appProtocol: https
endpoints:
  - addresses:
      - 172.16.2.200
    conditions:
      ready: true
