---
# Caddy's internal root CA from the Mac Studio (172.16.2.200), used by
# BackendTLSPolicy to VERIFY the Envoy -> Caddy leg rather than skipping
# verification.
#
# This is a PUBLIC certificate, not a secret. It is committed deliberately.
#
# PROVENANCE - verified independently before committing, because it arrived
# over a shared filesystem from an agent:
#   file sha256   b5a5113b4e9fd3976e33941d4379f74de2d86129cfc1e08cccad19fce6edb414
#   cert SHA-256  57:79:A1:CC:F9:B9:2F:31:0D:99:D2:EB:FF:14:4A:8D:1B:99:D7:08:
#                 44:B6:11:22:42:B6:77:05:37:35:90:5E
#   subject == issuer (self-signed root), CA:TRUE pathlen:1,
#   Key Usage: Certificate Sign, CRL Sign
#   valid 2026-09-21 -> 2036-07-30
#   live: all three SNIs on 172.16.2.200:443 chain to this root,
#         openssl verify return code 0
#
# WHY THE ROOT AND NOT A LEAF: Caddy's internal CA issues TWELVE-HOUR leaves
# and renews them continuously. Pinning a leaf would break the route twice a
# day. The root is valid for ten years.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/v1/configmap.json
