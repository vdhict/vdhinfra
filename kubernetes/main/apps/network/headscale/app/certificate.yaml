---
# Headscale terminates TLS itself (own LoadBalancer IP; Envoy Gateway v1.3 cannot pass the control-protocol upgrade).
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: headscale
spec:
  secretName: headscale-tls
  dnsNames:
    - headscale.${SECRET_DOMAIN}
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  issuerRef:
    kind: ClusterIssuer
    name: letsencrypt-production
  usages:
    - digital signature
    - server auth
