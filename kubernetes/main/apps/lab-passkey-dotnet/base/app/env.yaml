# .NET LAB config (chg-2026-10-20-001), non-secret only. Values copied from lab-passkey/passkey-point/app/env-v01.yaml
# (the same dev tenant 7m5b27gbc, the same AR1/AR2/AR3 registrations, key FILE PATHS, thumbprints, SKU ids, synthetic
# persona UPNs), with these deltas for the .NET desk e7fbe8a:
#   * PP_TAP_SERVICE=o365-mds (Security Requirements v1.0, O365 Management Database Service). The retired
#     PP_TAP_SERVICE=customer and every PP_TAP_CUSTOMER_* key are ABSENT: the e7fbe8a loader refuses them at start
#     (ConfigLoader.cs:382/387, exit 78), even next to the new form. PP_O365_MDS_* (dev-fake, loopback TapSim) are set
#     on the api container (desk/app/api.yaml), like PP_TAP_CUSTOMER_* were in lab-passkey. No Secret carried a
#     PP_TAP_CUSTOMER_* value (measured 2026-10-20: key names of every Opaque Secret in lab-passkey,
#     passkey-point-e2e, devtenant-*), so no secret value had to be re-keyed.
#   * PP_TAP_SERVICE_CLIENT_ID / _CERT_* unchanged (ar3), graph-dev not used here.
#   * PP_PUBLIC_ORIGIN = this LAB's own host; PP_DB_ENGINE=postgres (PP_DB_URL from Secret pp-dotnet-pg-runtime-url).
#   * PP_ENV_RENDERED_FROM dropped (TS render-env.py guard; the .NET loader has no such key).
