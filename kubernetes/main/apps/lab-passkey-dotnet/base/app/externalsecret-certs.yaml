spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-lab-passkey-dotnet-devapp
  refreshInterval: 1h
  target:
    name: passkey-point-ar2-cert
    creationPolicy: Owner
  data:
    - secretKey: tls.key
      remoteRef:
        key: pp-v01-AR2-cert
        property: private key
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-ar3-cert
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-lab-passkey-dotnet-devapp
  refreshInterval: 1h
  target:
    name: passkey-point-ar3-cert
    creationPolicy: Owner
  data:
    - secretKey: tls.key
      remoteRef:
        key: pp-v01-AR3-cert
        property: private key
