---
# The v0.1 app keys, same items as lab-passkey (the same dev-tenant app registrations). Only the private key, as
# tls.key at the *_CERT_PRIVATE_KEY_PATH in env.yaml. web mounts ar1 (ENTRA_*); api mounts ar1 + ar2 (PP_EMPLOYEE_*)
# + ar3 (PP_TAP_SERVICE_*, unchanged by the o365-mds rename).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-ar1-cert
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-lab-passkey-dotnet-devapp
  refreshInterval: 1h
  target:
    name: passkey-point-ar1-cert
    creationPolicy: Owner
  data:
    - secretKey: tls.key
      remoteRef:
        key: pp-v01-AR1-cert
        property: private key
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
