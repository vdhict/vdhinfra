---
# Same pattern as lab-passkey/secretstore-devapp.yaml: a READ-ONLY Connect token scoped to vault
# passkey-point-dev-app (item op-connect-token-passkey-point-dev-app, field credential, in home-infra), for the three
# v0.1 app keys (pp-v01-AR1/AR2/AR3-cert). Namespaced store: only this namespace can use it. Never the WRITE token.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-connect-lab-passkey-dotnet-devapp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: onepassword-connect-lab-passkey-dotnet-devapp
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: op-connect-token-passkey-point-dev-app
        property: credential
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-lab-passkey-dotnet-devapp
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        passkey-point-dev-app: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-lab-passkey-dotnet-devapp
            key: token
