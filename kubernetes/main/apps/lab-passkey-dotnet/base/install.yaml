---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lab-passkey-dotnet-base
  namespace: flux-system
spec:
  dependsOn:
    - name: lab-passkey-dotnet-network-policies
  targetNamespace: lab-passkey-dotnet
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: lab-passkey-dotnet
  path: ./kubernetes/main/apps/lab-passkey-dotnet/base/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 2m
  timeout: 5m
