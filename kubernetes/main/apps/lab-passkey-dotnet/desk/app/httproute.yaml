---
# https://passkey-point-dotnet-lab.${SECRET_DOMAIN} -> envoy-internal (wildcard cert) -> passkey-point-web:8080 in
# lab-passkey-dotnet. LAN and WireGuard only, NEVER envoy-external, no forward-auth (the app's own Entra sign-in).
# DNS exactly as lab-passkey: controller none keeps both Cloudflare instances off; external-dns-unifi writes the LAN
# record (do NOT hand-write one). Entra: the AR1 (/auth/callback) and AR2 (/employee/callback) registrations need
# this host as a redirect URI before a sign-in works (dev-tenant write, ops token).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: passkey-point-dotnet-lab
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - passkey-point-dotnet-lab.${SECRET_DOMAIN}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: passkey-point-web
          port: 8080
