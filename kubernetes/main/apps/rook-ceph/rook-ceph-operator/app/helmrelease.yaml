---
# yaml-language-server: $schema=https://schemas.zinn.ca/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: rook-ceph-operator
spec:
  interval: 1h
  # chg-2026-11-20-080: Rook cannot be downgraded once daemons roll. The
  # cluster-apps default remediation is a helm rollback, so do not let a slow
  # rollout count as a failed upgrade: no helm wait, health is gated by hand.
  timeout: 15m
  upgrade:
    disableWait: true
    disableWaitForJobs: true
  chart:
    spec:
      chart: rook-ceph
      version: v1.17.9
      sourceRef:
        kind: HelmRepository
        name: rook-ceph
        namespace: flux-system
  values:
    crds:
      enabled: true
    csi:
      enableCephfsDriver: true
      enableCephfsSnapshotter: true
      cephFSKernelMountOptions: ms_mode=prefer-crc
      enableLiveness: true
      serviceMonitor:
        enabled: true
    monitoring:
      enabled: true
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits: {}
