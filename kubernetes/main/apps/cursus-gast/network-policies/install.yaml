---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The cursus-gast CNPs land BEFORE any workload (courseware-gast and
# cloudflared dependsOn this), so no pod in the namespace ever runs with
# open ingress or egress, on every path: a combined push, a DR rebuild or a
# re-bootstrap. (chg-2026-10-28-002)
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cursus-gast-network-policies
  namespace: flux-system
spec:
  targetNamespace: cursus-gast
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: cursus-gast
  path: ./kubernetes/main/apps/cursus-gast/network-policies/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
