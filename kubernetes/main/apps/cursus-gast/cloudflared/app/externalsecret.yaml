---
# cloudflared-tunnel: the tunnel RUN token and nothing else (Argus C2).
#   1Password vault cursus-gast (NOT home-infra), item cloudflared-tunnel,
#   field label "credential". Read via ClusterSecretStore
#   onepassword-cursus-gast, which only this namespace can use.
# The run token can only connect a connector to THIS tunnel; it cannot edit
# tunnels, DNS or Access. No Cloudflare API token is ever synced here.
# Values only in 1Password; agents do not read them.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflared-tunnel
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-cursus-gast
  target:
    name: cloudflared-tunnel
    creationPolicy: Owner
  data:
    - secretKey: TUNNEL_TOKEN
      remoteRef: {key: cloudflared-tunnel, property: credential}
