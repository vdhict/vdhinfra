---
# courseware-gast-pull (chg-2026-10-28-002): read-only registry credential for
# the guest image. forge runs with REQUIRE_SIGNIN_VIEW=true, so the kubelet
# cannot pull anonymously.
#   1Password vault cursus-gast (NOT home-infra), item forge-pull, fields
#   "username" and "credential": a read:package token of the forge bot that
#   owns ONLY the cursus-gast package. Read via ClusterSecretStore
#   onepassword-cursus-gast, which only this namespace can use.
# The auth key is path-scoped to the one image repository, so the kubelet
# offers it for nothing else on forge. Values only in 1Password; agents do
# not read them. Keep the path in step with the image in helmrelease.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: courseware-gast-pull
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-cursus-gast
  target:
    name: courseware-gast-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: |-
          {"auths":{"forge.bluejungle.net/cursus-publisher/cursus-gast":{"username":"{{ .username }}","password":"{{ .credential }}","auth":"{{ printf "%s:%s" .username .credential | b64enc }}"}}}
  data:
    - secretKey: username
      remoteRef: {key: forge-pull, property: username}
    - secretKey: credential
      remoteRef: {key: forge-pull, property: credential}
