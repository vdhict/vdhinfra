---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app plex
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: rook-ceph-cluster
      namespace: flux-system
    - name: node-feature-discovery
      namespace: flux-system
    - name: external-secrets-stores   # components/volsync ExternalSecret
      namespace: flux-system
    - name: volsync
      namespace: flux-system
  path: ./kubernetes/main/apps/media/plex/app
  postBuild:
    substitute:
      # components/volsync (chg-2026-10-26-001)
      APP: *app
      VOLSYNC_CLAIM: plex
      VOLSYNC_CAPACITY: 5Gi
      # Plex's uid/gid, so the mover can read the clone
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  timeout: 5m
