---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
# Backup of PVC plex (library DB + settings): the shared component,
# s3://volsync/plex on MinIO (restic, shared repo password). It adds only a
# ReplicationSource and an ExternalSecret; PVC plex itself stays outside
# Flux. plex-cache is deliberately NOT backed up (regenerable).
# Variables (APP, VOLSYNC_CLAIM, VOLSYNC_PUID/PGID, VOLSYNC_CAPACITY) come
# from postBuild in ../install.yaml (chg-2026-10-26-001).
components:
  - ../../../../components/volsync
patches:
  # :45 staggers it from the other movers (:00/:15/:20/:25/:30/:35/:40/:50).
  - target:
      group: volsync.backube
      version: v1alpha1
      kind: ReplicationSource
    patch: |-
      - op: replace
        path: /spec/trigger/schedule
        value: "45 * * * *"
