---
# bcrypt digest of the Open WebUI OIDC client secret, for Authelia's
# client `open-webui` (chg-2026-09-26-001 v4).
#
# The plaintext lives ONLY in 1Password (item family-ai, field
# OAUTH_CLIENT_SECRET) and is rendered into family-ai-openwebui for Open
# WebUI. Here ESO turns the SAME field into a bcrypt digest (sprig
# `bcrypt`, cost 10, `$2a$`), so no human ever computes or types a hash.
#
# refreshInterval "0" = render ONCE. bcrypt salts randomly, so every
# re-render yields a different (equally valid) digest; a periodic refresh
# would rewrite this Secret and make Reloader restart Authelia each time.
# ROTATION: change the 1P field, then
#   kubectl -n security annotate es authelia-oidc-open-webui force-sync=$(date +%s) --overwrite
#   and the same for family-ai/family-ai-openwebui (then restart open-webui).
#
# Guard: 32..72 alphanumeric (bcrypt reads at most 72 bytes; sprig's
# bcrypt returns an error STRING above that, which must never become the
# digest). The render fails instead, and Authelia keeps its old env.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc-open-webui
  annotations:
    # Go-template variables ($s, $k) must reach ESO untouched by Flux postBuild.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authelia-oidc-open-webui
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OPEN_WEBUI_OAUTH_CLIENT_DIGEST: >-
          {{- $s := trim .OAUTH_CLIENT_SECRET -}}
          {{- if or (lt (len $s) 32) (gt (len $s) 72) (not (regexMatch "^[A-Za-z0-9]+$" $s)) -}}{{- fail "authelia-oidc-open-webui: OAUTH_CLIENT_SECRET must be 32..72 alphanumeric" -}}{{- end -}}
          {{ bcrypt $s }}
  data:
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef: {key: family-ai, property: OAUTH_CLIENT_SECRET}
