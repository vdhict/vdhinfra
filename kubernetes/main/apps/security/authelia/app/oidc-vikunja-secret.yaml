---
# bcrypt digest of the Vikunja OIDC client secret, for Authelia's client
# `vikunja` (chg-2026-09-28-003). Same shape as oidc-open-webui-secret.yaml.
#
# The plaintext lives ONLY in 1Password (item vikunja, field
# OIDC_CLIENT_SECRET) and is rendered into vikunja/vikunja-secret for
# Vikunja. Here ESO turns the SAME field into a bcrypt digest (sprig
# `bcrypt`, cost 10, `$2a$`), so no human ever computes or types a hash.
#
# refreshInterval "0" = render ONCE. bcrypt salts randomly, so every
# re-render yields a different (equally valid) digest. A periodic refresh
# would rewrite this Secret and make Reloader restart Authelia each time.
# ROTATION: change the 1P field, then
#   kubectl -n security annotate es authelia-oidc-vikunja force-sync=$(date +%s) --overwrite
#   kubectl -n vikunja annotate es vikunja force-sync=$(date +%s) --overwrite
# (Reloader then restarts both Authelia and Vikunja.)
#
# Guard: 32..72 alphanumeric. bcrypt reads at most 72 bytes, and sprig's
# bcrypt returns an error STRING above that, which must never become the
# digest. The render fails instead, and Authelia keeps its old env.
#
# ⚠ LANDING ORDER: the 1Password field must exist BEFORE this lands. If it
# is missing, this Secret is never created and a NEW Authelia pod cannot
# start (CreateContainerConfigError on the envFrom below). The 2 running
# pods keep serving, because the RollingUpdate cannot make progress, but
# Authelia is then stuck mid-rollout until the item exists.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authelia-oidc-vikunja
  annotations:
    # Go-template variables ($s) must reach ESO untouched by Flux postBuild.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: "0"
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: authelia-oidc-vikunja
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VIKUNJA_OAUTH_CLIENT_DIGEST: >-
          {{- $s := trim .OIDC_CLIENT_SECRET -}}
          {{- if or (lt (len $s) 32) (gt (len $s) 72) (not (regexMatch "^[A-Za-z0-9]+$" $s)) -}}{{- fail "authelia-oidc-vikunja: OIDC_CLIENT_SECRET must be 32..72 alphanumeric" -}}{{- end -}}
          {{ bcrypt $s }}
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: {key: vikunja, property: OIDC_CLIENT_SECRET}
