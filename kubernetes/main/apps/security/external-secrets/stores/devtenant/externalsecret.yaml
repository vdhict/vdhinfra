---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
# The vault-scoped READ tokens of the two dev-tenant vaults, created by the
# owner in home-infra as API Credential items (field label "credential", as
# for onepassword-mypka). Agents do not read the item contents.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-devtenant-build-token
  namespace: security
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-devtenant-build-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: op-connect-token-passkey-point-devtenant-build, property: credential}
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-devtenant-ops-token
  namespace: security
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-devtenant-ops-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: op-connect-token-passkey-point-devtenant-ops, property: credential}
