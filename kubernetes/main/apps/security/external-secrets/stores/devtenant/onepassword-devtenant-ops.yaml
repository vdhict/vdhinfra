---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/clustersecretstore_v1.json
# Ops vault (atlas-devtenant-ops key, pp-v01-baseline). Usable from
# devtenant-ops and devtenant-build (build runs write the ops token).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-devtenant-ops
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        passkey-point-devtenant-ops: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-devtenant-ops-token
            key: token
            namespace: security
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: ["devtenant-ops", "devtenant-build"]
