---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/clustersecretstore_v1.json
# Build vault (atlas-devtenant-build key, dev/dev-app write tokens). Usable
# ONLY from devtenant-build; devtenant-ops can never fetch from it.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-devtenant-build
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        passkey-point-devtenant-build: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-devtenant-build-token
            key: token
            namespace: security
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: ["devtenant-build"]
