---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/clustersecretstore_v1.json
# Second store, for the myPKA tenant only: same Connect server, vault
# mypka-cluster only, its own vault-scoped (read-only) token, usable ONLY
# from namespaces mypka and flux-system. Tenant ExternalSecrets use
#   secretStoreRef: {kind: ClusterSecretStore, name: onepassword-mypka}
# flux-system is admitted for ONE object only: our ExternalSecret
# flux-system/cluster-wires-deploy-key (item cluster-wires, field flux-key,
# which the owner keeps in mypka-cluster). The tenant cannot create objects
# in flux-system (boundary/app/rbac.yaml is namespace-scoped to mypka).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-mypka
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        mypka-cluster: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-mypka-token
            key: token
            namespace: security
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: ["mypka", "flux-system"]
