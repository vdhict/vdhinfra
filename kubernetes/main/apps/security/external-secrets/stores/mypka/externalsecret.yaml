---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
# The Connect token for the mypka-cluster vault ONLY. The owner creates it on
# the existing Connect server with access to mypka-cluster alone and stores
# it in vault home-infra, item onepassword-mypka, field token (CONCEALED).
# Lives in namespace security, read through the home-infra store; mypka can
# never read it (store condition NotIn [mypka], and it is not in mypka).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-mypka-token
  namespace: security
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-mypka-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: onepassword-mypka, property: token}
