---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
# The Connect token for the mypka-cluster vault ONLY (read-only), on the
# existing Connect server. The owner stores it in vault home-infra, item
# onepassword-mypka, category API Credential (API_CREDENTIAL).
#
# property: ESO v2.4.1's onepassword provider matches remoteRef.property
# against the field LABEL, exactly, and requires exactly one such field
# (providers/v1/onepassword/onepassword.go getField/countFieldsWithLabel).
# The API Credential category's built-in secret field is "credential"
# (field id and label; 1Password's own terraform provider reads it as id
# "credential" and its fixtures label it "credential"). The label on THIS
# item was not read (agents do not read 1P items): test T5a checks that this
# ExternalSecret reaches SecretSynced before anything depends on the store.
# Lives in namespace security, read through the home-infra store; mypka can
# never read it (store condition NotIn [mypka], and it is not in mypka).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-mypka-token
  namespace: security
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-mypka-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: onepassword-mypka, property: credential}
