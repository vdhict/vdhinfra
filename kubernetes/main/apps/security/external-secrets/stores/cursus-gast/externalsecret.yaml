---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
# The vault-scoped READ token of the cursus-gast vault, created by the owner
# in home-infra as an API Credential item (field label "credential", as for
# onepassword-mypka and the devtenant stores). Agents do not read the item.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-cursus-gast-token
  namespace: security
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-cursus-gast-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef: {key: op-connect-token-cursus-gast, property: credential}
