---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/clustersecretstore_v1.json
# cursus-gast vault ONLY, usable ONLY from namespace cursus-gast
# (chg-2026-10-28-002, Argus C2). The vault holds exactly one item the
# cluster syncs: cloudflared-tunnel/credential, the tunnel RUN token. No
# Cloudflare API token is ever synced into the cluster.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-cursus-gast
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        cursus-gast: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-cursus-gast-token
            key: token
            namespace: security
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: In
            values: ["cursus-gast"]
