---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: onepassword-connect
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        home-infra: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-secret
            key: token
            namespace: security
  # chg-2026-10-05-003: every namespace EXCEPT the myPKA tenant may use the
  # home-infra store. A NotIn selector (not a list of namespaces) so the
  # existing namespaces and any new one keep working unchanged. mypka uses
  # onepassword-mypka (vault mypka-cluster only). kubernetes.io/metadata.name
  # is set by the API server and cannot be forged. Supported by the live ESO
  # v2.4.1 (CRD external-secrets.io/v1 spec.conditions[].namespaceSelector
  # is a LabelSelector with matchExpressions, measured 2026-10-05).
  conditions:
    - namespaceSelector:
        matchExpressions:
          - key: kubernetes.io/metadata.name
            operator: NotIn
            values: ["mypka"]
