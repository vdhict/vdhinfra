---
# passkey-point-roster (entra): scope sync, image default `node scripts/roster.ts
# sync --every 300`. Graph app-only as its OWN app registration (roster-sync-entra-key).
# Writes today's list and its own repo, both on pp-roster; no pp-data. No listener.
#
# Common (chg-2026-10-05-009, a184498, ENTRA dev tenant, pod network):
#   * image tag@INDEX digest; gate PASS: cosign key 6ad2a90a..66e9 3/3, SLSA 3/3,
#     trivy + grype recorded (9 High no-fix OpenSSL/zlib, lab acceptance PP-F2).
#   * envFrom = this workload's OWN non-secret ConfigMap (rendered from Mack's
#     out/lab/*.env by hack/passkey-point/render-env.py); explicit env below wins.
#   * secrets only as read-only 0440 files / one secretKeyRef, from the scoped
#     SecretStore onepassword-lab-passkey. No dataFrom.
#   * NODE_ENV=production (below); PSA restricted, uid 10001, drop
#     ALL, ro rootfs, automount false; replicas 1 + Recreate (SQLite on RWO).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passkey-point-roster
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: passkey-point-roster
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passkey-point-roster
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # ndots 1 (Themis B1): absolute names are queried as-is first, so the Cilium
      # DNS allow-list never sees search-expanded variants.
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: passkey-point-lab-pull
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: passkey-point-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: roster
          image: forge.bluejungle.net/vdhict/passkey-point:roster-d3f4de5@sha256:b9b22fcbb1fb94ec6a6137a943cadda0aed4e6fbe9bcda14b7dcb406e50d2f0b
          envFrom:
            - configMapRef:
                name: passkey-point-roster-env
          env:
            # B2 guard (Themis): only hack/passkey-point/render-env.py writes this key. A
            # placeholder ConfigMap lacks it -> CreateContainerConfigError, so the
            # supplier code never starts on an unrendered config.
            - name: PP_ENV_RENDERED_FROM
              valueFrom:
                configMapKeyRef:
                  name: passkey-point-roster-env
                  key: PP_ENV_RENDERED_FROM
                  optional: false
            - name: PP_MODE
              value: "entra"
            # NODE_ENV production (M14 decision): no listener (tls.ts never runs);
            # in-app guards active: client secret refused (app-only.ts:38), https
            # origin, delegated refused, data dir not under /tmp.
            - name: NODE_ENV
              value: "production"
            # inc-2026-10-06-005: production refuses a non-https PP_PUBLIC_ORIGIN
            # (config.ts:678; default http://localhost:<PORT>). render-env.py drops the
            # file value as "Deployment sets it", so THIS Deployment must set it.
            - name: PP_PUBLIC_ORIGIN
              value: "https://passkey-point-lab.${SECRET_DOMAIN}"
            # Own repo on the roster volume, NOT the api's pp-data (supplier layout
            # out/lab/passkey-point.lab.roster-sync.env; scripts/roster.ts opens its
            # repo in PP_DATA_DIR): least privilege, the sync never touches the api data.
            - name: PP_DATA_DIR
              value: "/var/lib/passkey-point-roster"
            - name: HOME
              value: "/tmp"
            - name: PP_ROSTER_DIR
              value: "/var/lib/passkey-point-roster"
            - name: ROSTER_SYNC_CERT_PRIVATE_KEY_PATH
              value: "/etc/passkey-point/entra/key.pem"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: entra
              mountPath: /etc/passkey-point/entra
              readOnly: true
            - name: roster
              mountPath: /var/lib/passkey-point-roster
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: entra
          secret:
            secretName: passkey-point-roster-sync-entra
            defaultMode: 0440
        - name: roster
          persistentVolumeClaim:
            claimName: pp-roster
