---
# v0.1 (chg-2026-10-12-004): image palamedes/passkey-point web-v01-56c9f57, config passkey-point-v01-env
# (lab.env batch 7), AR1 key at /var/run/secrets/passkey-point/ar1, pinned to node02.
# passkey-point-web (entra): BFF/UI behind envoy-internal (plain 8080, TLS at Envoy).
# Signs users in against Entra (login.microsoftonline.com only; app mode: no Graph
# from web), calls the api over mTLS. Own Entra key file (web-entra-key).
#
# Common (chg-2026-10-05-009, a184498, ENTRA dev tenant, pod network):
#   * image tag@INDEX digest; gate PASS: cosign key 6ad2a90a..66e9 3/3, SLSA 3/3,
#     trivy + grype recorded (9 High no-fix OpenSSL/zlib, lab acceptance PP-F2).
#   * envFrom = this workload's OWN non-secret ConfigMap (rendered from Mack's
#     out/lab/*.env by hack/passkey-point/render-env.py); explicit env below wins.
#   * secrets only as read-only 0440 files / one secretKeyRef, from the scoped
#     SecretStore onepassword-lab-passkey. No dataFrom.
#   * NODE_ENV UNSET: production refuses this plain-HTTP listener behind envoy
#     (tls.ts:49). Its guards are held by render-env.py + this manifest instead
#     (see runbook); in-pod TLS via BackendTLSPolicy is the follow-up. PSA restricted, uid 10001, drop
#     ALL, ro rootfs, automount false; replicas 1 + Recreate (SQLite on RWO).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passkey-point-web
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: passkey-point-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passkey-point-web
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # ndots 1 (Themis B1): absolute names are queried as-is first, so the Cilium
      # DNS allow-list never sees search-expanded variants.
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
      terminationGracePeriodSeconds: 20
      nodeSelector:
        kubernetes.io/hostname: vdhclu01node02
      imagePullSecrets:
        - name: passkey-point-palamedes-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: forge.bluejungle.net/palamedes/passkey-point@sha256:3c6d4cb31ecc7de2b4de5cb84ea2e2ec888ebb134144375eebdfd5e28490246a
          envFrom:
            - configMapRef:
                name: passkey-point-v01-env
          env:
            # B2 guard (Themis): only hack/passkey-point/render-env.py writes this key. A
            # placeholder ConfigMap lacks it -> CreateContainerConfigError, so the
            # supplier code never starts on an unrendered config.
            - name: PP_ENV_RENDERED_FROM
              valueFrom:
                configMapKeyRef:
                  name: passkey-point-v01-env
                  key: PP_ENV_RENDERED_FROM
                  optional: false
            - name: PP_MODE
              value: "entra"
            # Split build: the scope AR1 exposes (Mack 2026-10-12; bootstrap labEnv will write it later).
            - name: PP_API_SCOPE
              value: "api://6e05d927-e0c2-418b-9f01-ab909aec5699/access_as_user"
            - name: PP_WEB_CLIENT_ID
              value: "6e05d927-e0c2-418b-9f01-ab909aec5699"
            - name: PP_DATA_DIR
              value: "/var/lib/passkey-point"
            - name: HOME
              value: "/tmp"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: PP_PUBLIC_ORIGIN
              value: "https://passkey-point-lab.${SECRET_DOMAIN}"
            - name: PP_ALLOW_PLAIN_HTTP
              value: "true"
            - name: PP_API_URL
              value: "https://passkey-point-api.lab-passkey.svc.cluster.local:8443"
            - name: PP_API_CA_FILE
              value: "/tls/client/ca.crt"
            - name: PP_API_CLIENT_CERT_FILE
              value: "/tls/client/tls.crt"
            - name: PP_API_CLIENT_KEY_FILE
              value: "/tls/client/tls.key"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls-client
              mountPath: /tls/client
              readOnly: true
            - name: ar1
              mountPath: /var/run/secrets/passkey-point/ar1
              readOnly: true
            - name: data
              mountPath: /var/lib/passkey-point
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: tls-client
          secret:
            secretName: passkey-point-web-client-tls
            defaultMode: 0440
        - name: ar1
          secret:
            secretName: passkey-point-ar1-cert
            defaultMode: 0440
        - name: data
          emptyDir:
            sizeLimit: 256Mi
