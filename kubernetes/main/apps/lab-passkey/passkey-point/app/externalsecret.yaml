---
# Passkey Point secrets, ENTRA mode. All from item passkey-point-lab in the
# scoped vault passkey-point-lab (SecretStore onepassword-lab-passkey). One
# Secret per workload and purpose, `data:` only, NO dataFrom extract (closes
# Argus "all workloads see all item fields"). Entra keys are FILES
# (src/auth/credential.ts reads *_CERT_PRIVATE_KEY_PATH), mounted read-only
# 0440 at /etc/passkey-point/entra/key.pem (and the portal's own key at
# /etc/passkey-point/entra-portal/key.pem).
#
# Pull credential: fields registry-username / registry-token, a Forgejo
# token with read:package ONLY (owner/Mack to create; NOT the mypka tenant
# token, NOT the forgejo admin).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-lab-pull
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-lab-passkey
  refreshInterval: 1h
  target:
    name: passkey-point-lab-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"forge.bluejungle.net":{"username":"{{ .user }}","password":"{{ .token }}"}}}'
  data:
    - secretKey: user
      remoteRef:
        key: passkey-point-lab
        property: registry-username
    - secretKey: token
      remoteRef:
        key: passkey-point-lab
        property: registry-token
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-web-entra
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-lab-passkey
  refreshInterval: 1h
  target:
    name: passkey-point-web-entra
    creationPolicy: Owner
  data:
    - secretKey: key.pem
      remoteRef:
        key: passkey-point-lab
        property: web-entra-key
