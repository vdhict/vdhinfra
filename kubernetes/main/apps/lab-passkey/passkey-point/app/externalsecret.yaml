---
# Registry pull credential for forge.bluejungle.net, in THIS namespace only.
# Source: 1P item passkey-point-lab (vault home-infra, design
# image-signature-admission.md: the pull credential lives in this item).
# Field labels registry-username / registry-token are UNVERIFIED (the
# handoff doc is not readable from vdhinfra). A wrong label = ES
# SecretSyncedError + ImagePullBackOff, nothing else.
# ACCESS WINDOW: the item was shared for 2026-10-05 17:00 -> 2026-10-06
# 17:00. creationPolicy Owner keeps the last synced Secret when a refresh
# fails, so pulls keep working after the window closes, but a NEW sync
# (first push after 17:00, or a re-create) needs the window renewed.
# The image is never re-pulled while it stays on the node (IfNotPresent
# for a digest), so a closed window cannot break a running pod.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-lab-pull
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: passkey-point-lab-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"forge.bluejungle.net":{"username":"{{ .user }}","password":"{{ .token }}"}}}'
  data:
    - secretKey: user
      remoteRef:
        key: passkey-point-lab
        property: registry-username
    - secretKey: token
      remoteRef:
        key: passkey-point-lab
        property: registry-token
