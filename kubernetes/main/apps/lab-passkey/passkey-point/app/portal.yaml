---
# passkey-point-portal: the list portal, from the ROSTER image (package.json
# start:portal = node --env-file-if-exists=.env src/portal/server.ts; run
# directly: no npm, no .env). Plain HTTP 8080, NO Service and NO route:
# unreachable by design tonight (opening it = its own route + review).
# MOCK mode: generates its own mock IdP pair in-process. Shares pp-data with
# the api (same node via podAffinity).
#
# Common (chg-2026-10-05-009, Passkey Point a184498, MOCK mode):
#   * image tag@INDEX digest (gate: tag->digest via the forge pull secret,
#     cosign key verify, SLSA provenance, our own trivy).
#   * PSA restricted: uid/gid 10001, drop ALL, ro rootfs, /tmp emptyDir,
#     automount false. replicas 1 + Recreate (SQLite on RWO).
#   * CNPs in ../../network-policies (default-deny first).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passkey-point-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: passkey-point-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passkey-point-portal
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: passkey-point-lab-pull
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: passkey-point-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: forge.bluejungle.net/vdhict/passkey-point:roster-a184498@sha256:27d0768f77cb02e1a8e4a9776cb55e286c6c968ea2871c7f60ff822bef9d263d
          command: ["node", "src/portal/server.ts"]
          env:
            - name: PP_MODE
              value: "mock"
            - name: PP_DATA_DIR
              value: "/var/lib/passkey-point"
            - name: HOME
              value: "/tmp"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            - name: PP_ALLOW_PLAIN_HTTP
              value: "true"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: data
              mountPath: /var/lib/passkey-point
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: data
          persistentVolumeClaim:
            claimName: pp-data
