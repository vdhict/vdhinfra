---
# passkey-point-portal (entra): the list portal (roster image, src/portal/server.ts),
# on envoy-internal as passkey-point-portal-lab (plain 8080, TLS at Envoy). Signs list
# owners in with its own app (portal-entra-key); read-only directory checks with the
# roster-sync key. Writes today's list (pp-roster). MAC key as env (portal only).
#
# Common (chg-2026-10-05-009, a184498, ENTRA dev tenant, pod network):
#   * image tag@INDEX digest; gate PASS: cosign key 6ad2a90a..66e9 3/3, SLSA 3/3,
#     trivy + grype recorded (9 High no-fix OpenSSL/zlib, lab acceptance PP-F2).
#   * envFrom = this workload's OWN non-secret ConfigMap (rendered from Mack's
#     out/lab/*.env by hack/passkey-point/render-env.py); explicit env below wins.
#   * secrets only as read-only 0440 files / one secretKeyRef, from the scoped
#     SecretStore onepassword-lab-passkey. No dataFrom.
#   * NODE_ENV UNSET: production refuses this plain-HTTP listener behind envoy
#     (tls.ts:49). Its guards are held by render-env.py + this manifest instead
#     (see runbook); in-pod TLS via BackendTLSPolicy is the follow-up. PSA restricted, uid 10001, drop
#     ALL, ro rootfs, automount false; replicas 1 + Recreate (SQLite on RWO).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passkey-point-portal
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: passkey-point-portal
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passkey-point-portal
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # ndots 1 (Themis B1): absolute names are queried as-is first, so the Cilium
      # DNS allow-list never sees search-expanded variants.
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: passkey-point-lab-pull
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: passkey-point-api
              topologyKey: kubernetes.io/hostname
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: portal
          image: forge.bluejungle.net/vdhict/passkey-point:roster-a184498@sha256:27d0768f77cb02e1a8e4a9776cb55e286c6c968ea2871c7f60ff822bef9d263d
          command: ["node", "src/portal/server.ts"]
          envFrom:
            - configMapRef:
                name: passkey-point-portal-env
          env:
            # B2 guard (Themis): only hack/passkey-point/render-env.py writes this key. A
            # placeholder ConfigMap lacks it -> CreateContainerConfigError, so the
            # supplier code never starts on an unrendered config.
            - name: PP_ENV_RENDERED_FROM
              valueFrom:
                configMapKeyRef:
                  name: passkey-point-portal-env
                  key: PP_ENV_RENDERED_FROM
                  optional: false
            - name: PP_MODE
              value: "entra"
            - name: PP_DATA_DIR
              value: "/var/lib/passkey-point"
            - name: HOME
              value: "/tmp"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8080"
            # inc-2026-10-06-005: render-env.py drops the file's PP_PUBLIC_ORIGIN as
            # "Deployment sets it", so THIS Deployment sets it (portal origin, as in the file).
            - name: PP_PUBLIC_ORIGIN
              value: "https://passkey-point-portal-lab.${SECRET_DOMAIN}"
            - name: PP_PORTAL_PUBLIC_ORIGIN
              value: "https://passkey-point-portal-lab.${SECRET_DOMAIN}"
            - name: PP_ALLOW_PLAIN_HTTP
              value: "true"
            - name: PP_ROSTER_DIR
              value: "/var/lib/passkey-point-roster"
            - name: PORTAL_CERT_PRIVATE_KEY_PATH
              value: "/etc/passkey-point/entra-portal/key.pem"
            - name: ROSTER_SYNC_CERT_PRIVATE_KEY_PATH
              value: "/etc/passkey-point/entra/key.pem"
            - name: PP_PORTAL_MAC_KEY
              valueFrom:
                secretKeyRef:
                  name: passkey-point-portal-mac
                  key: PP_PORTAL_MAC_KEY
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
              scheme: HTTP
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: entra
              mountPath: /etc/passkey-point/entra
              readOnly: true
            - name: entra-portal
              mountPath: /etc/passkey-point/entra-portal
              readOnly: true
            - name: data
              mountPath: /var/lib/passkey-point
            - name: roster
              mountPath: /var/lib/passkey-point-roster
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: entra
          secret:
            secretName: passkey-point-roster-sync-entra
            defaultMode: 0440
        - name: entra-portal
          secret:
            secretName: passkey-point-portal-entra
            defaultMode: 0440
        - name: data
          emptyDir:
            sizeLimit: 256Mi
        - name: roster
          persistentVolumeClaim:
            claimName: pp-roster
