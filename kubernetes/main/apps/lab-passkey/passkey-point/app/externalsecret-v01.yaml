---
# v0.1 app credentials (chg-2026-10-12-004) from vault passkey-point-dev-app, written by bootstrap-v01
# (ensureCert: fields "private key", "certificate", "thumbprint sha256"). Only the private key is mounted, as
# tls.key at the *_CERT_PRIVATE_KEY_PATH that lab.env names: /var/run/secrets/passkey-point/ar{1,2,3}/tls.key.
# web mounts ar1 only (ENTRA_*, role web); api mounts ar1 + ar2 (PP_EMPLOYEE_*) + ar3 (PP_TAP_SERVICE_*)
# (src/config.ts @418e47e: employee and TAP identities load only for the backend role).
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-ar1-cert
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-lab-passkey-devapp
  refreshInterval: 1h
  target:
    name: passkey-point-ar1-cert
    creationPolicy: Owner
  data:
    - secretKey: tls.key
      remoteRef:
        key: pp-v01-AR1-cert
        property: private key
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-ar2-cert
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-lab-passkey-devapp
  refreshInterval: 1h
  target:
    name: passkey-point-ar2-cert
    creationPolicy: Owner
  data:
    - secretKey: tls.key
      remoteRef:
        key: pp-v01-AR2-cert
        property: private key
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-ar3-cert
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-lab-passkey-devapp
  refreshInterval: 1h
  target:
    name: passkey-point-ar3-cert
    creationPolicy: Owner
  data:
    - secretKey: tls.key
      remoteRef:
        key: pp-v01-AR3-cert
        property: private key
---
# Pull secret for the palamedes registry (the v0.1 images moved there), from the read-only forge-pull item
# (username, credential), the same shape as devtenant-pull. The old passkey-point-lab-pull stays for the
# scaled-down v0.9 portal/roster.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-palamedes-pull
spec:
  secretStoreRef:
    kind: SecretStore
    name: onepassword-lab-passkey-devapp
  refreshInterval: 12h
  target:
    name: passkey-point-palamedes-pull
    creationPolicy: Owner
    template:
      engineVersion: v2
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"forge.bluejungle.net":{"username":"{{ .username }}","password":"{{ .token }}"}}}'
  data:
    - secretKey: username
      remoteRef:
        key: forge-pull
        property: username
    - secretKey: token
      remoteRef:
        key: forge-pull
        property: credential
