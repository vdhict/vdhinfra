---
# Scoped 1Password store for lab-passkey (Argus R3/C4: required before entra
# mode). Every Passkey Point secret comes from vault `passkey-point-lab`
# ONLY, through a Connect token scoped to that one vault (owner's names,
# 2026-10-06; token field `credential` UNVERIFIED until the owner confirms).
#
# OWNER ACTIONS (before the push; values never in Git):
#   1. 1Password: create vault `passkey-point-lab`; MOVE item passkey-point-lab
#      there (fields web-entra-key, api-entra-key, roster-sync-entra-key,
#      portal-entra-key, PP_PORTAL_MAC_KEY, registry-username,
#      registry-token).
#   2. Give the existing Connect server (security/onepassword-connect)
#      access to vault `passkey-point-lab`.
#   3. Issue a Connect token with READ access to vault `passkey-point-lab`
#      only; store it in home-infra item op-connect-token-passkey-point-lab
#      (field `credential`, to confirm).
#
# Bootstrap: the ONE ExternalSecret below still uses the home-infra cluster
# store, and it may only read that one item (Argus accepted the shared
# store for cluster-admin-only writers, R3). Everything else uses the scoped
# SecretStore.
#
# BETTER PATTERN (needs a cluster-scoped object, so not in this
# namespace-only commit): a ClusterSecretStore onepassword-lab-passkey with
# spec.conditions namespaceSelector = lab-passkey and the token Secret kept
# in ns security, like onepassword-mypka. The token then never sits in the
# tenant namespace and lab-passkey needs no home-infra ExternalSecret at
# all. Recommended as the follow-up (Argus to choose).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-connect-lab-passkey
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: onepassword-connect-lab-passkey
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: op-connect-token-passkey-point-lab
        property: credential
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-lab-passkey
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        passkey-point-lab: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-lab-passkey
            key: token
