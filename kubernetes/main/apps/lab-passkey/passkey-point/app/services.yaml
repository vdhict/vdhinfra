---
# ClusterIP only (quota: no LB, no NodePort). Entra: web, api and portal;
# the roster sync gets no Service (nothing reaches it).
apiVersion: v1
kind: Service
metadata:
  name: passkey-point-web
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: passkey-point-web
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: passkey-point-api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: passkey-point-api
  ports:
    - name: https
      port: 8443
      targetPort: 8443
      protocol: TCP
---
# Portal (entra): reached through envoy-internal as passkey-point-portal-lab.
apiVersion: v1
kind: Service
metadata:
  name: passkey-point-portal
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: passkey-point-portal
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
