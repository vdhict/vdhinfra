---
# LAB-only store for vault passkey-point-dev-app (chg-2026-10-12-004, Atlas/Mack option 2): the three v0.1 app
# certificates (pp-v01-AR1/AR2/AR3-cert) and the read-only palamedes pull item. Namespaced, so no cluster-wide
# resource: the token Secret lives in lab-passkey and only this namespace can use the store.
# Token = a READ-ONLY 1Password Connect token scoped to vault passkey-point-dev-app, item
# op-connect-token-passkey-point-dev-app (field credential) in home-infra, the same pattern as
# op-connect-token-passkey-point-lab. Never the dev-app WRITE token.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-connect-lab-passkey-devapp
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  refreshInterval: 1h
  target:
    name: onepassword-connect-lab-passkey-devapp
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: op-connect-token-passkey-point-dev-app
        property: credential
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-lab-passkey-devapp
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        passkey-point-dev-app: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-connect-lab-passkey-devapp
            key: token
