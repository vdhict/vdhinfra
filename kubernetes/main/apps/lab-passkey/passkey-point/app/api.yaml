---
# v0.1 (chg-2026-10-12-004): image palamedes/passkey-point api-v01-e0295a0, config passkey-point-v01-env
# (lab.env batch 7), AR1/AR2/AR3 keys at /var/run/secrets/passkey-point/ar{1,2,3}, pinned to node02,
# NODE_ENV unset (graph-dev), roster removed (gate G3).
# passkey-point-api (entra, app privilege mode): issues TAPs via Graph app-only.
# TLS 8443 + mTLS from web. pp-data rw; pp-roster (today's list) READ-ONLY
# (SEC-13). Own Entra key file (api-entra-key).
#
# Common (chg-2026-10-05-009, a184498, ENTRA dev tenant, pod network):
#   * image tag@INDEX digest; gate PASS: cosign key 6ad2a90a..66e9 3/3, SLSA 3/3,
#     trivy + grype recorded (9 High no-fix OpenSSL/zlib, lab acceptance PP-F2).
#   * envFrom = this workload's OWN non-secret ConfigMap (rendered from Mack's
#     out/lab/*.env by hack/passkey-point/render-env.py); explicit env below wins.
#   * secrets only as read-only 0440 files / one secretKeyRef, from the scoped
#     SecretStore onepassword-lab-passkey. No dataFrom.
#   * NODE_ENV=production (below); PSA restricted, uid 10001, drop
#     ALL, ro rootfs, automount false; replicas 1 + Recreate (SQLite on RWO).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passkey-point-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: passkey-point-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passkey-point-api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # ndots 1 (Themis B1): absolute names are queried as-is first, so the Cilium
      # DNS allow-list never sees search-expanded variants.
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
      terminationGracePeriodSeconds: 20
      nodeSelector:
        kubernetes.io/hostname: vdhclu01node02
      imagePullSecrets:
        - name: passkey-point-palamedes-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: forge.bluejungle.net/palamedes/passkey-point@sha256:eb3d18ecf44dd8b030d7976ad790df11b41db79cc4f309344ca69a73227b52d0
          envFrom:
            - configMapRef:
                name: passkey-point-v01-env
          env:
            # B2 guard (Themis): only hack/passkey-point/render-env.py writes this key. A
            # placeholder ConfigMap lacks it -> CreateContainerConfigError, so the
            # supplier code never starts on an unrendered config.
            - name: PP_ENV_RENDERED_FROM
              valueFrom:
                configMapKeyRef:
                  name: passkey-point-v01-env
                  key: PP_ENV_RENDERED_FROM
                  optional: false
            - name: PP_MODE
              value: "entra"
            # Split build (api + web): the azp the api accepts = AR1, the web tier sign-in client (Mack 2026-10-12;
            # lab.env was written for the one-process build; bootstrap labEnv will write it later).
            - name: PP_WEB_CLIENT_ID
              value: "6e05d927-e0c2-418b-9f01-ab909aec5699"
            # v2 ID token carries oid only with "openid profile" (run 15: employee_token_no_oid; Mack b79b052).
            - name: PP_EMPLOYEE_SCOPE
              value: "openid profile"
            # Dev tenant only (the app refuses it elsewhere and with NODE_ENV=production): contractor tenure in minutes
            # so the tenure rule is testable now (Sander 2026-10-12: tenure from the account creation date).
            - name: PP_CONTRACTOR_TENURE_MINUTES
              value: "30"
            - name: PP_API_SCOPE
              value: "api://6e05d927-e0c2-418b-9f01-ab909aec5699/access_as_user"
            # NODE_ENV unset (v0.1, chg-2026-10-12-004): PP_TAP_SERVICE=graph-dev (lab.env) is the dev-tenant
            # adapter and src/config.ts @418e47e refuses it under NODE_ENV=production. The api still serves its own
            # TLS/mTLS (PP_TLS_* below), so no plain listener.
            - name: PP_DATA_DIR
              value: "/var/lib/passkey-point"
            - name: HOME
              value: "/tmp"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8443"
            - name: PP_PUBLIC_ORIGIN
              value: "https://passkey-point-lab.${SECRET_DOMAIN}"
            - name: PP_TLS_CERT_FILE
              value: "/tls/server/tls.crt"
            - name: PP_TLS_KEY_FILE
              value: "/tls/server/tls.key"
            - name: PP_TLS_CLIENT_CA_FILE
              value: "/tls/server/ca.crt"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls-server
              mountPath: /tls/server
              readOnly: true
            - name: ar1
              mountPath: /var/run/secrets/passkey-point/ar1
              readOnly: true
            - name: ar2
              mountPath: /var/run/secrets/passkey-point/ar2
              readOnly: true
            - name: ar3
              mountPath: /var/run/secrets/passkey-point/ar3
              readOnly: true
            - name: data
              mountPath: /var/lib/passkey-point
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: tls-server
          secret:
            secretName: passkey-point-api-tls
            defaultMode: 0440
        - name: ar1
          secret:
            secretName: passkey-point-ar1-cert
            defaultMode: 0440
        - name: ar2
          secret:
            secretName: passkey-point-ar2-cert
            defaultMode: 0440
        - name: ar3
          secret:
            secretName: passkey-point-ar3-cert
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: pp-data
