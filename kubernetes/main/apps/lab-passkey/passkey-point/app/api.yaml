---
# passkey-point-api: the issuing service (node src/api/server.ts). TLS on 8443
# with the namespace CA; /v1 requires the web client cert. Owns pp-data
# (SQLite: data, audit trail, key register, and in MOCK mode today's list,
# which it seeds with the fictional demo tenant). Mock IdP PUBLIC key only.
#
# Common (chg-2026-10-05-009, Passkey Point a184498, MOCK mode):
#   * image tag@INDEX digest (gate: tag->digest via the forge pull secret,
#     cosign key verify, SLSA provenance, our own trivy).
#   * PSA restricted: uid/gid 10001, drop ALL, ro rootfs, /tmp emptyDir,
#     automount false. replicas 1 + Recreate (SQLite on RWO).
#   * CNPs in ../../network-policies (default-deny first).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/apps/deployment_v1.json
apiVersion: apps/v1
kind: Deployment
metadata:
  name: passkey-point-api
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: passkey-point-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: passkey-point-api
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # ndots 1 (Themis B1): PP_API_URL passkey-point-api.lab-passkey.svc.cluster.local
      # has 4 dots < the default ndots 5, so musl (node:24-alpine) would first
      # try the search-expanded names; the Cilium DNS proxy answers those
      # REFUSED (only the exact api name is allowed) and musl stops the search
      # on any rcode other than NXDOMAIN. With ndots 1 the name is queried
      # as-is first. Same fix as family-ai (open-webui, gezinsdienst, ...).
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
      terminationGracePeriodSeconds: 20
      imagePullSecrets:
        - name: passkey-point-lab-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: forge.bluejungle.net/vdhict/passkey-point:api-a184498@sha256:1d223dada89ac430af1a4a4ed642cdc0b901fcdf26f69bf6f98f476b5d46cdb9
          env:
            - name: PP_MODE
              value: "mock"
            - name: PP_DATA_DIR
              value: "/var/lib/passkey-point"
            - name: HOME
              value: "/tmp"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "8443"
            - name: PP_PUBLIC_ORIGIN
              value: "https://passkey-point-lab.${SECRET_DOMAIN}"
            - name: PP_TLS_CERT_FILE
              value: "/tls/server/tls.crt"
            - name: PP_TLS_KEY_FILE
              value: "/tls/server/tls.key"
            - name: PP_TLS_CLIENT_CA_FILE
              value: "/tls/server/ca.crt"
            - name: PP_MOCK_IDP_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: passkey-point-mock-idp
                  key: PP_MOCK_IDP_PUBLIC_KEY
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8443
              scheme: HTTPS
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: tls-server
              mountPath: /tls/server
              readOnly: true
            - name: data
              mountPath: /var/lib/passkey-point
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
        - name: tls-server
          secret:
            secretName: passkey-point-api-tls
            defaultMode: 0440
        - name: data
          persistentVolumeClaim:
            claimName: pp-data
