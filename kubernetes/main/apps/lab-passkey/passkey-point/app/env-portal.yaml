---
# PLACEHOLDER, NOT RENDERED. hack/passkey-point/render-env.py replaces this file from
# Mack's passkey-point.lab.*.env. Deliberately WITHOUT the guard key PP_ENV_RENDERED_FROM:
# passkey-point-portal references it with optional: false, so a push of this placeholder
# stops the pod with CreateContainerConfigError before any supplier code runs (Themis B2).
apiVersion: v1
kind: ConfigMap
metadata:
  name: passkey-point-portal-env
data:
  PP_ENV_PLACEHOLDER: "not rendered"
