---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# lab-passkey network policy, ENTRA mode. default-deny for every pod, then:
#   web     in:  envoy-internal :8080   out: api :8443, login.microsoftonline.com:443
#   api     in:  web :8443              out: login.microsoftonline.com, graph.microsoft.com :443
#   roster  in:  nothing                out: login.microsoftonline.com, graph.microsoft.com :443
#   portal  in:  envoy-internal :8080   out: login.microsoftonline.com, graph.microsoft.com :443
#   + DNS (kube-dns) for exactly those names. Hosts measured from the a184498
#   source (see passkey-point.yaml). Plain allow rules only: NO deny rules, NO
#   port ranges (inc-2026-10-05-002). NO egress to envoy-internal
#   (inc-2026-09-26-001), to any other namespace or to the LAN.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./default-deny.yaml
  - ./passkey-point.yaml
