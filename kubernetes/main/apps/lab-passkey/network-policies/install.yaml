---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The lab-passkey CNPs land BEFORE the workloads (lab-passkey-app dependsOn
# this), so no Passkey Point pod ever runs with open ingress or egress.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app lab-passkey-network-policies
  namespace: flux-system
spec:
  targetNamespace: lab-passkey
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: lab-passkey
  path: ./kubernetes/main/apps/lab-passkey/network-policies/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
