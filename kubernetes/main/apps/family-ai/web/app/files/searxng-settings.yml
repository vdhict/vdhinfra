# SearXNG for family-ai (chg-2026-09-26-001). One instance, used only by the
# Hermes agents' fixed web_search provider (q + format=json + pageno).
# Engines (land-12d, measured 2026-09-26 via our proxy from the home WAN IP):
#   duckduckgo  CAPTCHA (IP-level, also from the Mini) and did NOT enforce
#               strict safe search (land-9 T-SAFE fail) -> dropped
#   brave       HTTP 429 through our proxy while a browser-like client gets
#               200 (client fingerprinting) -> dropped
#   bing        keyless, 10 results via the proxy; strict (adlt=strict)
#               returns 0 for an adult query -> added
#   wikipedia   API 200 via the proxy -> kept (SearXNG's own requests got
#               429 earlier; re-measure after landing)
# land-12g: + braveapi = Brave's OFFICIAL Search API (api.search.brave.com,
#   key in X-Subscription-Token), not the scraped `brave` engine above. Any
#   safe_search > 0 is sent as safesearch=strict (engine source at d8ae3abd5).
#   The key is NOT here: api_key below is a placeholder that the render-settings
#   init container (files/searxng_render.py) fills from Secret
#   family-ai-searxng-brave into a memory-only emptyDir. No key -> the engine
#   is rendered inactive and bing + wikipedia keep working.
use_default_settings:
  engines:
    keep_only:
      - bing
      - wikipedia
      - braveapi
engines:
  - name: bing
    disabled: false     # disabled in SearXNG's defaults
    timeout: 5.0
  - name: wikipedia
    timeout: 4.0
  - name: braveapi
    inactive: false      # inactive in SearXNG's defaults (needs a key)
    api_key: "@@BRAVE_SEARCH_API_KEY@@"   # filled by searxng_render.py
    timeout: 5.0
general:
  instance_name: family-ai
  # never debug: debug mode logs every engine request with its query
  debug: false
  enable_metrics: false
server:
  # secret_key comes from env SEARXNG_SECRET (ESO Password generator)
  limiter: false
  public_instance: false
  image_proxy: false
  method: GET
search:
  # back off longer than the defaults (180 s) after a 429/deny, so a burst
  # from several agents does not get the home IP blocked for longer
  suspended_times:
    SearxEngineAccessDenied: 900
    SearxEngineCaptcha: 3600
    SearxEngineTooManyRequests: 900
  # STRICT (2) for everyone - the cheapest sound option: one instance, no
  # per-profile routing. The Hermes provider sends only q/format/pageno, the
  # value is also LOCKED below so a request parameter or cookie cannot lower
  # it, and nothing but the Hermes pods can reach this service (CNP).
  # Trade-off: profiel-1 gets strict results too (a 2nd instance would lift
  # that; not worth the extra pod now).
  safe_search: 2
  autocomplete: ""
  formats: [html, json]
# NO plugins (the user list REPLACES the defaults). In particular not
# tracker_url_remover: its init downloads the ClearURLs rules from the
# internet (not via our proxy -> fails + log noise); results go to an agent,
# not a browser, so there is nothing for it to protect.
plugins: {}
preferences:
  lock:
    - safesearch
outgoing:
  request_timeout: 6.0
  enable_http2: false
  # ALL engine traffic goes through the logging egress proxy (port 3128 =
  # the "search" port, which squid limits to the engines' domains);
  # searxng has no direct internet route (CNP).
  proxies:
    all://:
      - http://egress-proxy.family-ai.svc.cluster.local:3128
