# SearXNG for family-ai (chg-2026-09-26-001). One instance, used only by the
# Hermes agents' fixed web_search provider (q + format=json + pageno).
use_default_settings:
  engines:
    keep_only:
      - duckduckgo
      - wikipedia
      - brave
general:
  instance_name: family-ai
  # never debug: debug mode logs every engine request with its query
  debug: false
  enable_metrics: false
server:
  # secret_key comes from env SEARXNG_SECRET (ESO Password generator)
  limiter: false
  public_instance: false
  image_proxy: false
  method: GET
search:
  # STRICT (2) for everyone - the cheapest sound option: one instance, no
  # per-profile routing. The Hermes provider sends only q/format/pageno, the
  # value is also LOCKED below so a request parameter or cookie cannot lower
  # it, and nothing but the Hermes pods can reach this service (CNP).
  # Trade-off: profiel-1 gets strict results too (a 2nd instance would lift
  # that; not worth the extra pod now).
  safe_search: 2
  autocomplete: ""
  formats: [html, json]
# NO plugins (the user list REPLACES the defaults). In particular not
# tracker_url_remover: its init downloads the ClearURLs rules from the
# internet (not via our proxy -> fails + log noise); results go to an agent,
# not a browser, so there is nothing for it to protect.
plugins: {}
preferences:
  lock:
    - safesearch
outgoing:
  request_timeout: 6.0
  enable_http2: false
  # ALL engine traffic goes through the logging egress proxy (port 3128 =
  # the "search" port, which squid limits to the three engines' domains);
  # searxng has no direct internet route (CNP).
  proxies:
    all://:
      - http://egress-proxy.family-ai.svc.cluster.local:3128
