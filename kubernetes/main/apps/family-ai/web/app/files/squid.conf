# egress-proxy (family-ai): the ONLY internet egress for searxng, web-extract
# and the family-ai sandboxes. chg-2026-09-26-001.
#
# Policy: any public internet host on 80/443, NOTHING private. The dst ACL is
# evaluated on the IPs squid itself resolves and then connects to, so a DNS
# name that points (or re-points - rebinding) into a private range is denied.
# The pod's CiliumNetworkPolicy blocks the same ranges again at L3.
http_port 3128
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache deny all
cache_mem 8 MB
maximum_object_size_in_memory 64 KB

acl family_src src 10.42.0.0/16
acl safe_ports port 80 443
acl ssl_ports port 443
acl CONNECT method CONNECT
acl read_methods method GET HEAD CONNECT
# private, LAN, cluster, link-local/metadata, CGNAT, loopback, multicast,
# reserved - incl. 172.16.2.0/23 (LAN/Studio/gateway), 10.42/16 + 10.43/16
# (pods/services), 169.254.169.254 (metadata)
acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 ::ffff:0:0/96 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8
acl to_localnames dstdomain .local .lan .home.arpa .internal .cluster.local .svc bluejungle.net .bluejungle.net
# Hermes' keyless/SaaS tool back-ends: never reachable, even by mistake
acl saas_backends dstdomain .exa.ai .firecrawl.dev .parallel.ai .keenable.ai .tavily.com .perplexity.ai .x.ai .nousresearch.com

http_access deny !read_methods
http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access deny to_localnames
http_access deny to_private
http_access deny saas_backends
http_access allow family_src
http_access deny all

via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
httpd_suppress_version_string on

# LOG: minimal. Time, source pod IP, method, destination host:port, status,
# bytes. For HTTPS only the host is known (CONNECT); no paths, no query
# strings, no bodies. Kept on the egress-proxy-logs PVC, 7 daily files
# (rotated by run.sh), NOT on stdout - so the cluster log shipper never
# forwards it to Loki.
logformat family %{%Y-%m-%dT%H:%M:%S%z}tl %>a %rm %>rd:%>rP %>Hs %<st
access_log stdio:/var/log/squid/access.log family
logfile_rotate 6
cache_log /dev/stderr
strip_query_terms on
