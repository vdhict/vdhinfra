# egress-proxy (family-ai): the ONLY internet egress for searxng, web-extract
# and the family-ai sandboxes. chg-2026-09-26-001.
#
# Policy: any public internet host on 80/443, NOTHING private. The dst ACL is
# evaluated on the IPs squid itself resolves and then connects to, so a DNS
# name that points (or re-points - rebinding) into a private range is denied.
# The pod's CiliumNetworkPolicy blocks the same ranges again at L3.
# One port per caller, so the log can say WHICH profile a request is for
# without trusting anything the caller sends (the CNP decides who may reach
# which port):
#   3128        searxng only        -> may reach the search engines, nothing else
#   3131..3133  profiel-1..3        -> sandbox-profiel-N, and web-extract on
#                                      behalf of hermes-profiel-N
http_port 3128 name=searxng
http_port 3131 name=profiel-1
http_port 3132 name=profiel-2
http_port 3133 name=profiel-3
pid_filename /tmp/squid.pid
coredump_dir /tmp
cache deny all
cache_mem 8 MB
maximum_object_size_in_memory 64 KB

# pod CIDR (CLUSTER_CIDR); the CNP narrows it to searxng/web-extract/sandbox
acl family_src src 10.42.0.0/16
acl port_searxng myportname searxng
acl port_p1 myportname profiel-1
acl port_p2 myportname profiel-2
acl port_p3 myportname profiel-3
# the only hosts SearXNG's three engines need
acl search_engines dstdomain .bing.com .wikipedia.org
acl safe_ports port 80 443
acl ssl_ports port 443
acl CONNECT method CONNECT
acl read_methods method GET HEAD CONNECT
# private, LAN, cluster, link-local/metadata, CGNAT, loopback, multicast,
# reserved - incl. 172.16.2.0/23 (LAN/Studio/gateway), 10.42/16 + 10.43/16
# (pods/services), 169.254.169.254 (metadata)
acl to_private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.0.2.0/24 192.168.0.0/16 198.18.0.0/15 198.51.100.0/24 203.0.113.0/24 224.0.0.0/4 240.0.0.0/4 ::/128 ::1/128 64:ff9b::/96 fc00::/7 fe80::/10 ff00::/8 2001::/32 2002::/16 100::/64
# (.local also covers .cluster.local; .bluejungle.net matches the apex too.
# No ::ffff:0:0/96 - squid stores IPv4 as mapped, so that entry would equal
# 0.0.0.0/0; the IPv4 ranges above already cover mapped addresses.)
acl to_localnames dstdomain .local .lan .home.arpa .internal .svc .bluejungle.net
# Hermes' keyless/SaaS tool back-ends: never reachable, even by mistake
acl saas_backends dstdomain .exa.ai .firecrawl.dev .parallel.ai .keenable.ai .tavily.com .perplexity.ai .x.ai .nousresearch.com

http_access deny !read_methods
http_access deny !safe_ports
http_access deny CONNECT !ssl_ports
http_access deny to_localnames
http_access deny to_private
http_access deny saas_backends
http_access deny port_searxng !search_engines
http_access allow family_src
http_access deny all

# profile tag for the log line (port-derived, not caller-supplied)
note profile profiel-1 port_p1
note profile profiel-2 port_p2
note profile profiel-3 port_p3
note profile search port_searxng

via off
forwarded_for delete
request_header_access X-Forwarded-For deny all
httpd_suppress_version_string on

# LOG (chg-2026-09-26-001): time, profile, URL, status. Nothing else - no
# source IP, no bytes, no headers, no bodies. Query strings are stripped;
# for HTTPS (CONNECT) the "URL" is only host:443. Kept ONLY on the
# egress-proxy-logs PVC as 7 daily files (logfile_rotate 6, rotated daily by
# run.sh), NEVER on stdout, so the cluster log shipper cannot forward it to
# Loki. Not backed up. Readable only by cluster admins (exec into this pod
# or mount the PVC); not by Open WebUI admins, not by the agents.
logformat family %{%Y-%m-%dT%H:%M:%S%z}tl %{profile}note %ru %>Hs
access_log stdio:/var/log/squid/access.log family
logfile_rotate 6
# cache/error log can carry URLs: it goes to the same PVC with the same
# 7-file daily rotation (squid -k rotate rotates both), NEVER stderr/Loki.
# stdout/stderr get only squid's own startup lines, before this is read.
cache_log /var/log/squid/cache.log
strip_query_terms on
