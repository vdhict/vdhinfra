---
# family-ai (chg-2026-09-26-001): the household's family assistant.
#
#   open-webui          chat.bluejungle.net (own login form, NOT Authelia)
#   hermes-profiel-1..3 Hermes Agent, one per family profile, cluster-only
#   gezinsdienst        parent page gezin.bluejungle.net behind Authelia
#
# Pod Security Admission, measured against the images (not guessed):
#   * open-webui v0.11.3 image config User "0:0", CMD bash start.sh.
#   * hermes-agent v0.21.5 User "root", ENTRYPOINT entrypoint-dispatch.sh ->
#     s6-overlay /init as PID 1 -> s6-setuidgid hermes (UID 10000).
#     main-wrapper.sh exits 1 for any non-root UID other than 10000.
# Both need runAsNonRoot=false, which `restricted` forbids. Neither needs
# privileged, host namespaces, hostPath or capabilities beyond the runtime
# default set, so `baseline` admits both. baseline is ENFORCED; restricted
# is warn+audit only - same posture as devtools (chg-2026-09-18-003).
apiVersion: v1
kind: Namespace
metadata:
  name: family-ai
  labels:
    # Deleting this directory from Git must NOT delete the namespace and
    # with it every PVC (children's conversations). Rollback deletes the
    # namespace BY HAND, as a recorded step.
    kustomize.toolkit.fluxcd.io/prune: disabled
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
