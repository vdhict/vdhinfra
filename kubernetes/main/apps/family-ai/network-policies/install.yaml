---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# L2 (HIGH). Lands BEFORE any family-ai workload (L3), so no family-ai pod
# ever runs with open egress.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app family-ai-network-policies
  namespace: flux-system
spec:
  targetNamespace: family-ai
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: family-ai
  path: ./kubernetes/main/apps/family-ai/network-policies/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
