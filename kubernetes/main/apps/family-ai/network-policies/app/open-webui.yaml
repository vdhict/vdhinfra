---
# open-webui: in from envoy-internal only (the chat route); out to the three
# Hermes profiles, the Studio (172.16.2.200:443) and DNS.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: open-webui
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
  egress:
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hermes
      toPorts:
        - ports: [{port: "8642", protocol: TCP}]
    # The model API: Caddy on the Mac Studio, DIRECTLY (hostAlias
    # api.bluejungle.net -> 172.16.2.200). There is NO rule to the
    # envoy-internal pods or to 172.16.2.241 any more, so no envoy-internal
    # hostname is reachable from here at all (Sander D5).
    - toCIDR:
        - 172.16.2.200/32
      toPorts:
        - ports: [{port: "443", protocol: TCP}]
    # OIDC back-channel (v4, Mack addendum 1): discovery, JWKS, token and
    # userinfo, server-side. NOT via envoy-internal (that would reopen the
    # SNI/Host fronting path Argus closed). The oidc-proxy sidecar in the
    # open-webui pod terminates TLS for auth.bluejungle.net (hostAlias ->
    # 127.0.0.1, private CA) and forwards plain HTTP to the Authelia pods
    # with Host auth.bluejungle.net + X-Forwarded-Proto https, so the issuer
    # stays https://auth.bluejungle.net. nginx in the sidecar is the path
    # allow-list (the four OIDC calls, everything else 404).
    #
    # ⚠ THIS EDGE IS DELIBERATELY L4 (Argus option A, chg-2026-09-26-001).
    # A Cilium L7 `rules.http` block here sends the request through Cilium's
    # embedded Envoy, which OVERWRITES X-Forwarded-Proto; Authelia then
    # cannot derive the https issuer and answers 500. Measured on land-2
    # (2026-09-26 12:58Z): Hubble http-request FORWARDED -> http-response 500
    # for every header variant; the same request from an un-policed pod: 200
    # + correct issuer. Do NOT re-add L7 here without a tested fix for that.
    # Scope: the Authelia POD selector and TCP 8888 only - not the metrics
    # port 8080, not the rest of the security namespace. Residual (accepted
    # by Argus): the app container can reach other Authelia HTTP paths
    # in-cluster, the same endpoints the LAN reaches via auth.bluejungle.net.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: security
            app.kubernetes.io/name: authelia
            app.kubernetes.io/component: authelia
      toPorts:
        - ports: [{port: "8888", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              # api.bluejungle.net is NOT resolvable: it comes from
              # /etc/hosts. A client that bypassed the hosts file would get
              # REFUSED instead of learning the envoy-internal IP.
              - matchPattern: "*.family-ai.svc.cluster.local"
              # the oidc-proxy sidecar resolves its upstream once at start
              - matchName: authelia.security.svc.cluster.local
