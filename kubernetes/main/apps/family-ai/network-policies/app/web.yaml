---
# Controlled internet (chg-2026-09-26-001): searxng and web-extract may only
# talk to egress-proxy; egress-proxy is the only pod with internet egress,
# and only to PUBLIC addresses on 80/443 (the private ranges are excluded
# here at L3 AND denied by squid on the resolved IP).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: egress-proxy
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: egress-proxy
  # One squid port per caller (files/squid.conf): the port IS the profile
  # tag in the log, so each caller may reach only its own port(s). The
  # sandbox rules are inert until land-10 creates those pods.
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: searxng}
      toPorts:
        - ports: [{port: "3128", protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: web-extract}
      toPorts:
        - ports:
            - {port: "3131", protocol: TCP}
            - {port: "3132", protocol: TCP}
            - {port: "3133", protocol: TCP}
            - {port: "3134", protocol: TCP}   # profiel-4 (chg-2026-11-13-004)
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: sandbox, app.kubernetes.io/instance: sandbox-profiel-1}
      toPorts:
        - ports: [{port: "3131", protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: sandbox, app.kubernetes.io/instance: sandbox-profiel-2}
      toPorts:
        - ports: [{port: "3132", protocol: TCP}]
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: sandbox, app.kubernetes.io/instance: sandbox-profiel-3}
      toPorts:
        - ports: [{port: "3133", protocol: TCP}]
  egress:
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 0.0.0.0/8
            - 10.0.0.0/8
            - 100.64.0.0/10
            - 127.0.0.0/8
            - 169.254.0.0/16
            - 172.16.0.0/12
            - 192.0.0.0/24
            - 192.168.0.0/16
            - 198.18.0.0/15
            - 224.0.0.0/4
            - 240.0.0.0/4
      toPorts:
        - ports:
            - {port: "80", protocol: TCP}
            - {port: "443", protocol: TCP}
    # squid must resolve arbitrary public names. This is not an extra
    # channel: whoever can make the proxy fetch a host can already make it
    # resolve that host.
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-web-extract
spec:
  endpointSelector:
    matchExpressions:
      - {key: app.kubernetes.io/name, operator: In, values: [searxng, web-extract]}
  # Ingress moved to searxng-ingress and web-extract-ingress below (kennis_toevoegen C2): CNPs are additive, so the
  # old "every hermes pod, all of :8080" rule would keep POST /v2/raw open to every profile next to any L7 rule.
  egress:
    - toEndpoints:
        - matchLabels: {app.kubernetes.io/name: egress-proxy}
      toPorts:
        - ports:
            - {port: "3128", protocol: TCP}
            - {port: "3131", protocol: TCP}
            - {port: "3132", protocol: TCP}
            - {port: "3133", protocol: TCP}
            - {port: "3134", protocol: TCP}   # profiel-4 (chg-2026-11-13-004)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchName: egress-proxy.family-ai.svc.cluster.local
---
# searxng: unchanged behaviour, every hermes pod on 8080 (was part of searxng-web-extract).
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: searxng-ingress
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: searxng}
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: hermes}
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
---
# web-extract (kennis_toevoegen C2, Argus chg-2026-11-16-001, option a): POST /v2/raw only from hermes-profiel-1.
# Every other hermes pod keeps /health and /v1|/v2/scrape and gets no /v2/raw. Kubelet probes are host identity and
# are not subject to this rule. The code also answers 403 on /v2/raw for other profiles, but that is no second lock:
# the Bearer is just the env value, so Cilium is the only real check. Atlas measures: profiel-2/3/4 POST /v2/raw -> 403
# from Cilium (not from the code), profiel-1 -> 200,
# /v2/scrape from profiel-4 still 200, and a 60 s /v2/raw is not cut by the Envoy proxy idle timeout.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: web-extract-ingress
spec:
  endpointSelector:
    matchLabels: {app.kubernetes.io/name: web-extract}
  ingress:
    - fromEndpoints:
        - matchLabels: {app.kubernetes.io/name: hermes}
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
          rules:
            http:
              - {method: GET, path: "/health"}
              - {method: POST, path: "/v2/scrape"}
              - {method: POST, path: "/v1/scrape"}
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hermes
            app.kubernetes.io/instance: hermes-profiel-1
      toPorts:
        - ports: [{port: "8080", protocol: TCP}]
          rules:
            http:
              - {method: POST, path: "/v2/raw"}
