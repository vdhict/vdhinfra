# oidc-proxy sidecar (see oidc-proxy.yaml). Loopback only; four locations;
# everything else 404. No access log: no URLs, codes or tokens in logs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 64; }
http {
  access_log off;
  server_tokens off;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  client_max_body_size 64k;
  upstream authelia {
    server authelia.security.svc.cluster.local:8888;
  }
  server {
    listen 127.0.0.1:443 ssl;
    server_name auth.bluejungle.net;
    ssl_certificate /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    proxy_http_version 1.1;
    proxy_set_header Host auth.bluejungle.net;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Host auth.bluejungle.net;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_connect_timeout 5s;
    proxy_read_timeout 15s;
    location = /.well-known/openid-configuration { limit_except GET { deny all; } proxy_pass http://authelia; }
    location = /jwks.json { limit_except GET { deny all; } proxy_pass http://authelia; }
    location = /api/oidc/token { limit_except POST { deny all; } proxy_pass http://authelia; }
    location = /api/oidc/userinfo { limit_except GET POST { deny all; } proxy_pass http://authelia; }
    location / { return 404; }
  }
}
