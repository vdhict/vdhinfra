---
# family-ai-openwebui (Mack §Secrets). Values live only in 1Password, vault
# home-infra; nothing here or in any session carries a value.
#
#   item "family-ai"                 WEBUI_SECRET_KEY, WEBUI_ADMIN_EMAIL,
#                                    WEBUI_ADMIN_PASSWORD, API_SERVER_KEY_1..3
#   item "family-ai MODEL_API_KEY"   password   (title contains spaces; ESO's
#                                    1Password provider URL-encodes the
#                                    title filter - connect-sdk-go v1.5.3
#                                    GetItemsByTitle uses url.QueryEscape)
#
# OPENAI_API_KEYS is positional and MUST line up with OPENAI_API_BASE_URLS
# in deployment.yaml:
#   1 http://hermes-profiel-1:8642/v1   API_SERVER_KEY_1
#   2 http://hermes-profiel-2:8642/v1   API_SERVER_KEY_2
#   3 http://hermes-profiel-3:8642/v1   API_SERVER_KEY_3
#   4 https://api.bluejungle.net/v1     MODEL_API_KEY
# The same API_SERVER_KEY_n feeds hermes-profiel-n's Secret, so the two can
# never drift apart.
#
# Open WebUI splits OPENAI_API_KEYS on ';' (config.py, v0.11.3), so a key
# containing ';' would shift every later key by one. The template FAILS the
# render instead of producing a shifted list - the Secret is then never
# written and the ExternalSecret reports the error, without the value.
#
# ⚠ Open WebUI reads OPENAI_API_BASE_URLS / OPENAI_API_KEYS only on FIRST
# start; ENABLE_PERSISTENT_CONFIG defaults to True and the DB wins after
# that. Rotating a key later = edit it in Admin > Connections as well.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-ai-openwebui
  annotations:
    # Go-template variables ($s, $k) must reach ESO untouched by Flux postBuild.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: family-ai-openwebui
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        # Empty admin credentials would SKIP the admin seed, and then the
        # first signup becomes admin even with ENABLE_SIGNUP=false
        # (routers/auths.py). Refuse to render instead (Argus A3).
        WEBUI_SECRET_KEY: >-
          {{- if lt (len (trim .WEBUI_SECRET_KEY)) 32 -}}{{- fail "family-ai-openwebui: WEBUI_SECRET_KEY empty or shorter than 32" -}}{{- end -}}
          {{ .WEBUI_SECRET_KEY }}
        WEBUI_ADMIN_EMAIL: >-
          {{- if not (contains "@" .WEBUI_ADMIN_EMAIL) -}}{{- fail "family-ai-openwebui: WEBUI_ADMIN_EMAIL empty or not an address" -}}{{- end -}}
          {{ .WEBUI_ADMIN_EMAIL }}
        WEBUI_ADMIN_PASSWORD: >-
          {{- if lt (len (trim .WEBUI_ADMIN_PASSWORD)) 24 -}}{{- fail "family-ai-openwebui: WEBUI_ADMIN_PASSWORD empty or shorter than 24" -}}{{- end -}}
          {{ .WEBUI_ADMIN_PASSWORD }}
        # Authelia OIDC client secret (client open-webui). Same 1P field
        # feeds the bcrypt digest Authelia checks (security/authelia/app/
        # oidc-open-webui-secret.yaml). bcrypt reads at most 72 bytes, so
        # 32..72 alphanumeric is enforced here and there.
        OAUTH_CLIENT_SECRET: >-
          {{- $s := trim .OAUTH_CLIENT_SECRET -}}
          {{- if or (lt (len $s) 32) (gt (len $s) 72) (not (regexMatch "^[A-Za-z0-9]+$" $s)) -}}{{- fail "family-ai-openwebui: OAUTH_CLIENT_SECRET must be 32..72 alphanumeric" -}}{{- end -}}
          {{ $s }}
        OPENAI_API_KEYS: >-
          {{- range $k := list .API_SERVER_KEY_1 .API_SERVER_KEY_2 .API_SERVER_KEY_3 .MODEL_API_KEY -}}
          {{- if or (eq $k "") (contains ";" $k) (ne $k (trim $k)) -}}{{- fail "family-ai-openwebui: an API key is empty or contains ';' or surrounding whitespace" -}}{{- end -}}
          {{- end -}}
          {{ .API_SERVER_KEY_1 }};{{ .API_SERVER_KEY_2 }};{{ .API_SERVER_KEY_3 }};{{ .MODEL_API_KEY }}
  data:
    - secretKey: WEBUI_SECRET_KEY
      remoteRef: {key: family-ai, property: WEBUI_SECRET_KEY}
    - secretKey: WEBUI_ADMIN_EMAIL
      remoteRef: {key: family-ai, property: WEBUI_ADMIN_EMAIL}
    - secretKey: WEBUI_ADMIN_PASSWORD
      remoteRef: {key: family-ai, property: WEBUI_ADMIN_PASSWORD}
    - secretKey: API_SERVER_KEY_1
      remoteRef: {key: family-ai, property: API_SERVER_KEY_1}
    - secretKey: API_SERVER_KEY_2
      remoteRef: {key: family-ai, property: API_SERVER_KEY_2}
    - secretKey: API_SERVER_KEY_3
      remoteRef: {key: family-ai, property: API_SERVER_KEY_3}
    - secretKey: MODEL_API_KEY
      remoteRef: {key: "family-ai MODEL_API_KEY", property: password}
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef: {key: family-ai, property: OAUTH_CLIENT_SECRET}
