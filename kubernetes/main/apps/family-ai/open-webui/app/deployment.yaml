---
# Open WebUI v0.11.4 - front-end for the family (Mack, GL-023 §4.2). v0.11.4
# (not Mack's v0.11.3) because it carries the 2026-09-21 security advisory
# fixes (Argus A2); every env name below was re-checked in its source.
#
# Runs as 0:0 because the image does (image config User "0:0"); the
# namespace enforces PSA baseline, which admits that. Everything the
# container does not need is still taken away: no service-account token,
# no service links, no privilege escalation, runtime-default seccomp.
#
# ENV IS MACK'S SPEC VERBATIM, plus the security-review additions marked
# below. Do not "tidy" it: OPENAI_API_BASE_URLS
# is read on FIRST start only and then persisted in the DB
# (ENABLE_PERSISTENT_CONFIG defaults to True in v0.11.4 config.py), so a
# wrong first value survives every later edit of this file.
# WEBUI_ADMIN_EMAIL/PASSWORD seed Sander's admin ONLY while the user table
# is empty (main.py create_admin_user).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  labels:
    app.kubernetes.io/name: open-webui
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  # RWO PVC + SQLite: never two pods on the data at once.
  strategy:
    type: Recreate
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: open-webui
  template:
    metadata:
      labels:
        app.kubernetes.io/name: open-webui
        app.kubernetes.io/part-of: family-ai
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # ndots 1: absolute names (api.bluejungle.net) are tried as-is FIRST,
      # so they never fan out into search-domain queries that the Cilium DNS
      # allow-list in network-policies/ would have to anticipate.
      dnsConfig:
        options:
          - {name: ndots, value: "1"}
      # Sander D5 (v3): talk to Caddy on the Studio DIRECTLY, never through
      # envoy-internal (removes the SNI/Host fronting exposure,
      # inc-2026-09-26-001). /etc/hosts wins over DNS, so the URL, the SNI
      # and the Host header all stay api.bluejungle.net while the packets
      # go to 172.16.2.200. Egress is pinned to that /32 in network-policies/.
      hostAliases:
        - ip: 172.16.2.200
          hostnames: [api.bluejungle.net]
        # OIDC back-channel: the oidc-proxy sidecar on loopback (see
        # oidc-proxy.yaml). Browsers are unaffected (they use real DNS).
        - ip: 127.0.0.1
          hostnames: [auth.bluejungle.net]
      securityContext:
        seccompProfile: {type: RuntimeDefault}
        # lets the non-root oidc-proxy bind 127.0.0.1:443; a "safe" sysctl
        # (namespaced to this pod), admitted by PSA baseline
        sysctls:
          - {name: net.ipv4.ip_unprivileged_port_start, value: "0"}
      initContainers:
        # Trust bundle = Caddy's root (Studio) + the pod-local OIDC proxy CA.
        # Nothing else: the pod reaches only those two TLS endpoints.
        - name: ca-bundle
          image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
          command: ["sh", "-c", "cat /in/studio/ca.crt /in/oidc/ca.crt > /out/bundle.crt && test $(grep -c 'BEGIN CERTIFICATE' /out/bundle.crt) -eq 2"]
          securityContext:
            runAsUser: 65534
            runAsGroup: 65534
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: studio-ca, mountPath: /in/studio, readOnly: true}
            - {name: oidc-ca, mountPath: /in/oidc, readOnly: true}
            - {name: ca-bundle, mountPath: /out}
        # Native sidecar (restartPolicy Always): up before the app starts.
        - name: oidc-proxy
          image: docker.io/nginxinc/nginx-unprivileged:1.29.2-alpine@sha256:031d8c8ab79d2d171a2a383aa50a06f527791c05ba1aeae9ca05d7b9779caf8e
          restartPolicy: Always
          command: ["nginx", "-c", "/etc/oidc-proxy/nginx.conf", "-g", "daemon off;"]
          securityContext:
            runAsUser: 101
            runAsGroup: 101
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          # No probe: nginx listens on loopback only, and PSA baseline forbids
          # a probe `host`. Open WebUI fetches discovery lazily at the first
          # login, and a crashing sidecar is restarted by the kubelet.
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: oidc-proxy-conf, mountPath: /etc/oidc-proxy, readOnly: true}
            - {name: oidc-proxy-tls, mountPath: /tls, readOnly: true}
            - {name: oidc-proxy-tmp, mountPath: /tmp}
      containers:
        - name: app
          image: ghcr.io/open-webui/open-webui:v0.11.4@sha256:9591b13f13843c7721c2b8eaf7382846c81b3ffe126526d1888d1fed50c6a33f
          ports:
            - name: http
              containerPort: 8080
          env:
            - {name: ENABLE_SIGNUP, value: "false"}
            # Kept true ONLY as the break-glass entry for the seeded local
            # admin (Mack addendum 1 §1); family members have no Open WebUI
            # password and log in with "Gezin" (OIDC). ⚠ WEBUI_ADMIN_EMAIL must
            # NOT equal any lldap user's email: with MERGE_ACCOUNTS_BY_EMAIL
            # off, that person's OIDC signup would collide with the seeded
            # account. Admin rights via OIDC come from lldap group `admins`.
            - {name: ENABLE_LOGIN_FORM, value: "true"}
            - {name: DEFAULT_USER_ROLE, value: "pending"}
            - {name: ENABLE_ADMIN_CHAT_ACCESS, value: "false"}
            - {name: ENABLE_ADMIN_EXPORT, value: "false"}
            - {name: ENABLE_COMMUNITY_SHARING, value: "false"}
            - {name: ENABLE_MESSAGE_RATING, value: "false"}
            - {name: ENABLE_MEMORIES, value: "false"}
            - {name: ENABLE_WEB_SEARCH, value: "false"}
            - {name: ENABLE_OLLAMA_API, value: "false"}
            - {name: ENABLE_OPENAI_API, value: "true"}
            - {name: ENABLE_FORWARD_USER_INFO_HEADERS, value: "false"}
            - {name: BYPASS_MODEL_ACCESS_CONTROL, value: "false"}
            - {name: USER_PERMISSIONS_CHAT_SHARE, value: "false"}
            - {name: USER_PERMISSIONS_FEATURES_AUTOMATIONS, value: "false"}
            - {name: OFFLINE_MODE, value: "true"}
            - {name: HF_HUB_OFFLINE, value: "1"}
            - {name: BYPASS_EMBEDDING_AND_RETRIEVAL, value: "true"}
            - {name: ANONYMIZED_TELEMETRY, value: "false"}
            - {name: SCARF_NO_ANALYTICS, value: "true"}
            - {name: DO_NOT_TRACK, value: "true"}
            - {name: WEBUI_URL, value: "https://chat.bluejungle.net"}
            # ── added after security review (Argus, chg-2026-09-26-001) ──
            # B2: /api/v1/analytics/messages returns message CONTENT to the
            # admin; ENABLE_ADMIN_CHAT_ACCESS=false does not cover it. With
            # this false, main.py never mounts /api/v1/analytics (404).
            - {name: ENABLE_ADMIN_ANALYTICS, value: "false"}
            # A3 (names verified in the v0.11.4 source; ENABLE_API_KEY with
            # no S does not exist and would silently do nothing)
            - {name: ENABLE_API_KEYS, value: "false"}
            - {name: ENABLE_EVALUATION_ARENA_MODELS, value: "false"}
            - {name: ENABLE_CODE_INTERPRETER, value: "false"}
            - {name: ENABLE_CODE_EXECUTION, value: "false"}
            # Argus R2: the 30-day retention job deletes chats, not uploaded
            # files; with uploads off nothing outlives the retention window.
            - {name: USER_PERMISSIONS_CHAT_FILE_UPLOAD, value: "false"}
            # Sander 2026-09-26: ~30 days for the family, longer for keuken -
            # NOT expressible: ONE global setting for ALL users
            # (Open WebUI has no per-user lifetime), so it also applies to the
            # admin and the shared keuken account; an OIDC login also gets an
            # Open WebUI JWT with this same lifetime (utils/oauth.py:2154). It is
            # a PersistentConfig key
            # (auth.jwt_expiry): read on FIRST start, then the DB wins.
            - {name: JWT_EXPIRES_IN, value: "30d"}
            # ── login via Authelia OIDC (Mack addendum 1 §1, names checked in
            #    v0.11.4 config.py). OAuth settings are NOT persistent config
            #    (ENABLE_OAUTH_PERSISTENT_CONFIG defaults False): env wins on
            #    every start. auth.jwt_expiry IS persistent (first start).
            - {name: ENABLE_OAUTH_SIGNUP, value: "true"}
            - {name: OAUTH_PROVIDER_NAME, value: "Gezin"}
            - {name: OPENID_PROVIDER_URL, value: "https://auth.bluejungle.net/.well-known/openid-configuration"}
            - {name: OPENID_REDIRECT_URI, value: "https://chat.bluejungle.net/oauth/oidc/login/callback"}
            - {name: OAUTH_CLIENT_ID, value: "open-webui"}
            - {name: OAUTH_SCOPES, value: "openid email profile groups"}
            - {name: OAUTH_CODE_CHALLENGE_METHOD, value: "S256"}
            - {name: OAUTH_TOKEN_ENDPOINT_AUTH_METHOD, value: "client_secret_basic"}
            - {name: OAUTH_MERGE_ACCOUNTS_BY_EMAIL, value: "false"}
            - {name: ENABLE_OAUTH_ROLE_MANAGEMENT, value: "true"}
            - {name: OAUTH_ROLES_CLAIM, value: "groups"}
            - {name: OAUTH_ALLOWED_ROLES, value: "gezin,admins,owui-keuken"}
            - {name: OAUTH_ADMIN_ROLES, value: "admins"}
            - {name: ENABLE_OAUTH_GROUP_MANAGEMENT, value: "true"}
            - {name: OAUTH_GROUP_CLAIM, value: "groups"}
            - {name: ENABLE_OAUTH_GROUP_CREATION, value: "false"}
            # OAUTH_CLIENT_SECRET comes from the Secret (envFrom).
            # ── auxiliary tasks NOT to the Hermes agents (Mack addendum 1 §7)
            - {name: TASK_MODEL_EXTERNAL, value: "household-chat"}
            - {name: ENABLE_TITLE_GENERATION, value: "true"}
            - {name: ENABLE_TAGS_GENERATION, value: "false"}
            - {name: ENABLE_FOLLOW_UP_GENERATION, value: "false"}
            - {name: ENABLE_AUTOCOMPLETE_GENERATION, value: "false"}
            - {name: ENABLE_SEARCH_QUERY_GENERATION, value: "false"}
            - {name: ENABLE_RETRIEVAL_QUERY_GENERATION, value: "false"}
            # Trust ONLY Caddy's root + the pod-local OIDC proxy CA (bundle
            # built by the ca-bundle init container).
            # SSL_CERT_FILE: OpenSSL default context (aiohttp, urllib, httpx
            # with trust_env); REQUESTS_CA_BUNDLE: python-requests (certifi
            # otherwise); CURL_CA_BUNDLE for the test commands.
            - {name: SSL_CERT_FILE, value: /etc/family-ai-ca/bundle.crt}
            - {name: REQUESTS_CA_BUNDLE, value: /etc/family-ai-ca/bundle.crt}
            - {name: CURL_CA_BUNDLE, value: /etc/family-ai-ca/bundle.crt}
            - name: OPENAI_API_BASE_URLS
              value: "http://hermes-profiel-1:8642/v1;http://hermes-profiel-2:8642/v1;http://hermes-profiel-3:8642/v1;https://api.bluejungle.net/v1"
          # WEBUI_SECRET_KEY, WEBUI_ADMIN_EMAIL, WEBUI_ADMIN_PASSWORD,
          # OPENAI_API_KEYS (4 values, same order as above)
          envFrom:
            - secretRef:
                name: family-ai-openwebui
          # Argus A4: uid 0 but NO capabilities. Root without DAC_OVERRIDE
          # still owns (and can write) everything it creates on the PVC.
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 1Gi
            limits:
              memory: 3Gi
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 60   # first start runs DB migrations
          readinessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 30
            failureThreshold: 4
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
            - {name: ca-bundle, mountPath: /etc/family-ai-ca, readOnly: true}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
        - name: studio-ca
          configMap:
            name: studio-ca
        - name: oidc-ca
          secret:
            secretName: oidc-proxy-tls
            items: [{key: ca.crt, path: ca.crt}]
        - name: ca-bundle
          emptyDir: {sizeLimit: 1Mi}
        - name: oidc-proxy-tls
          secret:
            secretName: oidc-proxy-tls
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        - name: oidc-proxy-conf
          configMap:
            name: open-webui-oidc-proxy
        - name: oidc-proxy-tmp
          emptyDir: {sizeLimit: 16Mi}
