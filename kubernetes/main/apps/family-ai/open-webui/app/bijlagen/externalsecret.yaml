---
# Land 3 (chg-2026-10-20-010): bearer token for the Studio transcription worker. Argus addendum 20261113T093930Z T1-T5:
# GENERATED in-cluster (no 1Password write without the owner's Touch ID), own Secret used by open-webui only, never a
# Hermes key. Copied once to the Studio (kubectl -> ssh stdin -> 0600 file), readback as a sha-prefix boolean.
# T4 SILENT DRIFT: ANY edit of this ExternalSecret or the generator regenerates the token, and transcription then
# fails with 403 until the copy is repeated. Every canary step checks a right-token 200.
# T5: moves to 1Password (onepassword-connect) at the owner's next sudo/Touch-ID session, before the OWUI update.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: owui-bijlagen-token
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-ai-owui-bijlagen
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: "0"
  target:
    name: family-ai-owui-bijlagen
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        OWUI_ATTACHMENT_VISION_TOKEN: >-
          {{- if not (regexMatch "^[A-Za-z0-9]{48}$" .password) -}}{{- fail "family-ai-owui-bijlagen: generated token not 48 alphanumeric" -}}{{- end -}}
          {{ .password }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: owui-bijlagen-token
