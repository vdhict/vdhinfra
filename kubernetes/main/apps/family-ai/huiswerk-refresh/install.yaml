---
# chg-2026-10-15-001 huiswerk daily refresh (suspended until all gates pass). Payload from the cluster-wires
# huiswerk bundle 012e632d (app/upstream/, verbatim) + Atlas platform fixes in app/kustomization.yaml.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# ValidatingAdmissionPolicy (cluster-scoped, Argus C2) in its own Kustomization without targetNamespace.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app family-ai-huiswerk-refresh-policy
  namespace: flux-system
spec:
  path: ./kubernetes/main/apps/family-ai/huiswerk-refresh/policy
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app family-ai-huiswerk-refresh
  namespace: flux-system
spec:
  targetNamespace: family-ai
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: family-ai
  dependsOn:
    - name: family-ai-network-policies
    - name: family-ai-kennisdienst
    - name: family-ai-huiswerk-refresh-policy
  path: ./kubernetes/main/apps/family-ai/huiswerk-refresh/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
