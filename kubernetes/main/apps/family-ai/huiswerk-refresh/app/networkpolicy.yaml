---
# chg-2026-10-15-001 (Argus C6): huiswerk-refresh may reach ONLY the Mini's sshd (forced-command export) and the
# Kubernetes API (restart kennisdienst). No DNS (both are IP literals), no ingress.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: huiswerk-refresh
  namespace: family-ai
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: huiswerk-refresh
  ingress:
    - {}
  egress:
    - toCIDR:
        - 172.16.2.201/32
      toPorts:
        - ports: [{port: "22", protocol: TCP}]
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports: [{port: "6443", protocol: TCP}]
