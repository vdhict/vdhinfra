---
# chg-2026-10-15-001. upstream/ = verbatim cluster-wires bundle 012e632d files (cronjob.yaml blob e241fbb4 ==
# family-ai deploy/huiswerk/vullen-job.yaml; scripts.configmap.json blob d57911f4 == render-config.py output of
# refresh.py 674884b8 + bin/vul-kennis-prive 4ed58415). Platform fixes are patches below, never edits upstream.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./upstream/cronjob.yaml
  - ./upstream/scripts.configmap.json
  - ./huiswerk-mini-export.sops.yaml
  - ./networkpolicy.yaml
  - ./prometheusrule.yaml
# Local deviations from upstream (Atlas 2026-10-15, AGR-082 relaxed + owner: Magister once a day ~17:00):
#  - refresh.py: the hour-window check in run() removed (any time; guard.py does canary/restore);
#  - CronJob schedule 05:35 -> 17:20 Europe/Amsterdam via the patch below.
configMapGenerator:
  - name: huiswerk-refresh-guard     # Argus C3: pre-swap UTF-8 check + automatic restore (files/guard.py)
    namespace: family-ai
    files:
      - ./files/guard.py
  - name: huiswerk-refresh-passwd    # F2: ssh needs a passwd entry for uid 65532
    namespace: family-ai
    files:
      - ./files/passwd
generatorOptions:
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
patches:
  - target: {kind: CronJob, name: huiswerk-refresh}   # schedule 05:35 -> 17:20 (see header)
    patch: |
      - op: replace
        path: /spec/schedule
        value: "20 17 * * *"
  - target: {kind: CronJob, name: huiswerk-refresh}
    patch: |-
      # ACTIVE since 2026-10-15 (chg-2026-10-15-001): all Argus gates C1-C3, C5-C9 passed; C4 owed by 2026-10-31.
      - op: replace
        path: /spec/suspend
        value: false
      # F3: vendor image (python3 + openssh-client + tzdata), the base cluster-wires is built on; no pull secret.
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/image
        value: docker.io/library/python:3.13.15-bookworm@sha256:227b6570d6ee07061ae6ca2eb04dedfb6d2b34045835f343065b9869e4d427ea
      # C3: the guard wraps refresh.py (unchanged) with the pre-swap check and the automatic restore.
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/command
        value: [python3, /opt/huiswerk-guard/guard.py]
      - op: replace
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/0/value
        value: sheijden@172.16.2.201
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value: {name: HOME, value: /tmp}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/env/-
        value: {name: PYTHONDONTWRITEBYTECODE, value: "1"}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
        value: {name: guard, mountPath: /opt/huiswerk-guard, readOnly: true}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/containers/0/volumeMounts/-
        value: {name: passwd, mountPath: /etc/passwd, subPath: passwd, readOnly: true}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/-
        value: {name: guard, configMap: {name: huiswerk-refresh-guard, defaultMode: 292}}
      - op: add
        path: /spec/jobTemplate/spec/template/spec/volumes/-
        value: {name: passwd, configMap: {name: huiswerk-refresh-passwd, defaultMode: 292}}
      # Measured 2026-10-15: kennisdienst needs ~100-150 s after the old pod is gone; refresh.py waits 120 s, the
      # guard 300 s more, and the restore path may need one more restart -> deadline 900 s (was 300).
      - op: replace
        path: /spec/jobTemplate/spec/activeDeadlineSeconds
        value: 900
      # F4: kennis-prive is RWO; run on the node where kennisdienst has it attached.
      - op: add
        path: /spec/jobTemplate/spec/template/spec/affinity
        value:
          podAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: kennisdienst
