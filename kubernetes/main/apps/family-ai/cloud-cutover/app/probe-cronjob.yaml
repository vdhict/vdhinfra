---
# G7 (chg-2026-11-17-011, Argus G7 + D-L4): the daily one-token cloud probe, 07:05 local. It does nothing unless
# cloud-off.json exists; then ONE synthetic call ("ping", max_tokens 1, no profile data), cleared only on a 200 in a
# later UTC month (S-F1). Wrapper files/probe_run.py: bundle sha256 check, plugin + probe pinned to the wire blobs of
# family-ai-cluster b7b3a96 (G3 on the probe job), rendered budget_usd <= 99 (C2); reads the JSON result line.
# LIVE since the go-live commit B of chg-2026-11-17-011 (after the G3 one-file-swap p3 bundle, the G4 canary and the G9
# gate). On a state that is not off it makes no call (result not_off). p2 still carries the pre-signal plugin; the probe
# reads the profiel-3 bundle only. Rollback = git revert of commit B (suspend: true again, same commit as the p3 CNP).
# backoffLimit 0 + restartPolicy Never: a failed run is never retried the same day (D-L4: no paid reruns).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: family-cloud-probe
spec:
  schedule: "5 7 * * *"
  timeZone: Europe/Amsterdam
  suspend: false
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: family-cloud-probe
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 172800   # 2 days: the lock job counts probe Jobs per UTC day (D-L2)
      template:
        metadata:
          labels:
            app.kubernetes.io/name: family-cloud-probe
            app.kubernetes.io/instance: family-cloud-probe
            app.kubernetes.io/part-of: family-ai
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          dnsConfig:
            options:
              - {name: ndots, value: "1"}
          securityContext:
            seccompProfile: {type: RuntimeDefault}
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            fsGroup: 10000
            fsGroupChangePolicy: OnRootMismatch
          containers:
            - name: probe
              image: docker.io/nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
              command: ["/opt/hermes/.venv/bin/python", "-I", "/probe/probe_run.py"]
              env:
                - {name: PIN_INIT_SHA256, value: "99fb4183deb1793c4cecf3e2abece50e4375b37962f44fa53c358bf581c37496"}
                - {name: PIN_PROBE_SHA256, value: "f1d9aed6b482808cc72217803e603e2b58b4f581a2c7c362ba259f4fc2e6bba7"}
                - {name: MAX_BUDGET_USD, value: "99"}
                - {name: HOME, value: /tmp}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
                # The key from the SAME ExternalSecret as hermes-profiel-3; only this one key.
                - name: CLOUD_API_KEY
                  valueFrom:
                    secretKeyRef: {name: family-ai-hermes-profiel-3, key: CLOUD_API_KEY}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 20m, memory: 96Mi}
                limits: {memory: 384Mi}
              volumeMounts:
                - {name: cloud-spend, mountPath: /cloud-spend}
                - {name: bundle, mountPath: /bundle, readOnly: true}
                - {name: probe, mountPath: /probe, readOnly: true}
                - {name: plugin, mountPath: /plugin}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: cloud-spend
              persistentVolumeClaim: {claimName: hermes-cloud-spend-shared}
            - name: bundle
              secret: {secretName: family-ai-hermes-profiel-bundle-3}
            - name: probe
              configMap: {name: family-cloud-cutover-scripts, defaultMode: 0555}
            - name: plugin
              emptyDir: {sizeLimit: 16Mi}
            - name: tmp
              emptyDir: {sizeLimit: 16Mi}
