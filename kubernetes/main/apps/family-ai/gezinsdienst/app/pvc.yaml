---
# NOT backed up, by decision (Sander + Mack, chg-2026-09-26-001).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gezinsdienst-data
  labels:
    # A revert of this app's commit must NOT delete the data (children's
    # conversations). Deleting this PVC is a recorded, manual rollback step.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 1Gi
