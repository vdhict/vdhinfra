---
# family-ai-gezinsdienst. Values only in 1Password (item "family-ai").
#
#   GEZIN_NTFY_TOPIC, GEZIN_NTFY_TOPIC_TEST
#   GEZIN_TOKEN_PROFIEL_2, GEZIN_TOKEN_PROFIEL_3
#       Mack's config.json names these via `token_env`; gezinsdienst.py
#       reads them at start, refuses < 24 characters, and keeps only their
#       sha256 in memory. The SAME 1Password fields feed GEZIN_TOKEN of
#       hermes-profiel-2/-3, so the two sides cannot drift. No token and no
#       hash is in Git.
# Guards: an empty value fails the render (Themis A3); the service itself
# also refuses short tokens.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-ai-gezinsdienst
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: family-ai-gezinsdienst
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        GEZIN_NTFY_TOPIC: >-
          {{- if lt (len (trim .GEZIN_NTFY_TOPIC)) 32 -}}{{- fail "family-ai-gezinsdienst: GEZIN_NTFY_TOPIC empty or shorter than 32" -}}{{- end -}}
          {{ .GEZIN_NTFY_TOPIC }}
        GEZIN_NTFY_TOPIC_TEST: >-
          {{- if lt (len (trim .GEZIN_NTFY_TOPIC_TEST)) 32 -}}{{- fail "family-ai-gezinsdienst: GEZIN_NTFY_TOPIC_TEST empty or shorter than 32" -}}{{- end -}}
          {{ .GEZIN_NTFY_TOPIC_TEST }}
        GEZIN_TOKEN_PROFIEL_2: >-
          {{- if lt (len (trim .GEZIN_TOKEN_PROFIEL_2)) 24 -}}{{- fail "family-ai-gezinsdienst: GEZIN_TOKEN_PROFIEL_2 empty or shorter than 24" -}}{{- end -}}
          {{ .GEZIN_TOKEN_PROFIEL_2 }}
        GEZIN_TOKEN_PROFIEL_3: >-
          {{- if lt (len (trim .GEZIN_TOKEN_PROFIEL_3)) 24 -}}{{- fail "family-ai-gezinsdienst: GEZIN_TOKEN_PROFIEL_3 empty or shorter than 24" -}}{{- end -}}
          {{ .GEZIN_TOKEN_PROFIEL_3 }}
  data:
    - secretKey: GEZIN_NTFY_TOPIC
      remoteRef: {key: family-ai, property: GEZIN_NTFY_TOPIC}
    - secretKey: GEZIN_NTFY_TOPIC_TEST
      remoteRef: {key: family-ai, property: GEZIN_NTFY_TOPIC_TEST}
    - secretKey: GEZIN_TOKEN_PROFIEL_2
      remoteRef: {key: family-ai, property: GEZIN_TOKEN_PROFIEL_2}
    - secretKey: GEZIN_TOKEN_PROFIEL_3
      remoteRef: {key: family-ai, property: GEZIN_TOKEN_PROFIEL_3}
