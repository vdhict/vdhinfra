---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
#
# Namespace-level resource list for `family-ai` (chg-2026-09-26-001).
# Picked up by cluster-apps' directory scan, like every other namespace.
#
# Landing order (one commit per step, see the change record):
#   L1  namespace + quota + limitrange + runtime ConfigMap       (medium)
#   L2  network-policies                                         (HIGH)
#   L3  open-webui (no route) + hermes + gezinsdienst (no route) (medium)
#   L4  open-webui chat route + studio-ai hostname edit          (HIGH)
#   L5  gezin route + Authelia ext-auth + header strip           (HIGH)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./namespace.yaml
  - ./resourcequota.yaml
  - ./limitrange.yaml
  - ./runtime-configmap.yaml
  - ./studio-ca-configmap.yaml
  - ./network-policies/install.yaml
  - ./open-webui/install.yaml
  - ./hermes/install.yaml
  - ./gezinsdienst/install.yaml
  - ./web/install.yaml
  - ./kennisdienst/install.yaml
  - ./huiswerk-refresh/install.yaml   # chg-2026-10-15-001
  - ./cloud-cutover/install.yaml   # chg-2026-11-17-011 (G5 lock, G6 alerts, G7 probe; build + drill)
  - ./cloud-digest/install.yaml   # chg-2026-11-22-008 (G8 monthly digest)
