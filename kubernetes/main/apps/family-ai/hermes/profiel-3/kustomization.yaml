---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# hermes-profiel-3. Every name from ../base gets the suffix -3.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
nameSuffix: "-3"
labels:
  - pairs:
      app.kubernetes.io/instance: hermes-profiel-3
    includeSelectors: true
    includeTemplates: true
resources:
  - ../base
  - ./externalsecret.yaml
  - ./bundle.sops.yaml
  - ./volsync.yaml
  # chg-2026-10-20-010 land 2 (W6): profiel-3's OWN ledger PVC (-> hermes-profiel-cloud-spend-3). Since W2c it is only
  # read, once, by the shared guard to move its total onto ../cloud-spend (hermes-cloud-spend-shared); kept, never
  # pruned, as the pre-move record and the rollback's ledger.
  - ./cloud-spend-pvc.yaml
patches:
  # The Secret named here is written by ESO, not by kustomize, so kustomize
  # cannot rename the reference itself. Pin it to the ExternalSecret target.
  - target: {kind: Deployment, name: hermes-profiel}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/envFrom/0/secretRef/name
        value: family-ai-hermes-profiel-3
      # Unique model name per agent (Mack addendum 1 §3; api_server.py:1181).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: API_SERVER_MODEL_NAME, value: hermes-agent-profiel-3}
      # web-extract caller id -> proxy port 3133 (chg-2026-09-26-001)
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: FIRECRAWL_API_KEY, value: profiel-3}
      # huiswerk plugin (chg-2026-10-15-001): own collection huiswerk-profiel-3 via KENNIS_TOKEN from the ES;
      # without KENNIS_TOKEN the plugin registers no hook (inert). Full FQDN: see profiel-1.
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: KENNIS_URL, value: "http://kennisdienst.family-ai.svc.cluster.local:8088"}
      # chg-2026-10-20-010 land 2 (Argus C3/W5): family-cloud runs the cloud ONLY when HERMES_IMAGE equals its
      # PINNED_IMAGE; this value must equal containers[0].image of this same pod spec (checked by
      # hack/family-ai/check-cloud-wiring.py on the render, and read back in the pod at go-live).
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: HERMES_IMAGE, value: "docker.io/nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d"}
      # W2c: the ONE shared spend ledger (../cloud-spend, hermes-cloud-spend-shared), same path as before
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: {name: CLOUD_SPEND_PATH, value: /cloud-spend/month.json}
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value: {name: cloud-spend, mountPath: /cloud-spend}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: cloud-spend
          persistentVolumeClaim: {claimName: hermes-cloud-spend-shared}
      # W2c: profiel-3's own pre-W2c ledger, mounted read-only and ONLY in the init container (the one-time move)
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: cloud-spend-old
          persistentVolumeClaim: {claimName: hermes-profiel-cloud-spend-3, readOnly: true}
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: cloud-spend-init
          configMap: {name: hermes-cloud-spend-init-shared, defaultMode: 0555}
      # W2c shared ledger guard (../cloud-spend/cloud-spend-init.py), runs AFTER seed-once, under the same flock as
      # family-cloud: keeps the shared month.json byte-for-byte, never creates one without the seed, moves profiel-3's
      # own ledger once (only this pod mounts /cloud-spend-old); any refusal -> price_confirmed=false in the freshly
      # seeded settings.json (Studio only). No envFrom, no env, no secret: CLOUD_API_KEY never reaches it (W4).
      - op: add
        path: /spec/template/spec/initContainers/-
        value:
          name: cloud-spend-init
          image: docker.io/nousresearch/hermes-agent:v0.22.5@sha256:9c5561579f3ffdf333401797094ac3a743738d6c25d40f4331c7bf77b694238d
          command: ["/opt/hermes/.venv/bin/python", "-I", "/cloud-spend-init/cloud-spend-init.py"]
          securityContext:
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          volumeMounts:
            - {name: cloud-spend, mountPath: /cloud-spend}
            - {name: cloud-spend-old, mountPath: /cloud-spend-old, readOnly: true}
            - {name: data, mountPath: /opt/data}
            - {name: cloud-spend-init, mountPath: /cloud-spend-init, readOnly: true}
