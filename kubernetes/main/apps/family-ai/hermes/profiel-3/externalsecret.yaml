---
# family-ai-hermes-profiel-3. Values only in 1Password.
#   API_SERVER_KEY  <- item "family-ai" field API_SERVER_KEY_3
#                      (the SAME field feeds position 3 of OPENAI_API_KEYS
#                      in family-ai-openwebui, so they cannot drift)
#   MODEL_API_KEY   <- item "family-ai MODEL_API_KEY" field password
#                      (same value Mack sets in Caddy on the Studio)
#   GEZIN_TOKEN     <- item "family-ai" field GEZIN_TOKEN_PROFIEL_3
#                      The same field feeds env GEZIN_TOKEN_PROFIEL_3 of
#                      gezinsdienst (Mack's token_env), which hashes it at
#                      start. Nothing about the token lands in Git.
#                      With the token, Mack's gezin plugin (86d3149)
#                      registers vergeet + gedragslog + the pre_llm_call hook;
#                      veiligheidssignaal ONLY if instellingen.json says
#                      signaal:true - it says false, and gezinsdienst refuses
#                      signals too (signaal:false per child). Argus B4.
#   CLOUD_API_KEY   <- item "hermes-antrophic-api-key" field credential
#                      (chg-2026-10-20-010 land 2, Argus W2/W4: wired only
#                      after the owner confirmed the USD 200/month budget)
# Every value is guarded: an empty key would make the Hermes API server
# accept ANY caller (fail-open), and sha256("") is a public constant
# (Themis A3). The render fails instead; the pod never gets the Secret.
# nameSuffix does not apply to target.name; it is written out in full.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-ai-hermes-profiel
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: family-ai-hermes-profiel-3
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        API_SERVER_KEY: >-
          {{- if lt (len (trim .API_SERVER_KEY)) 32 -}}{{- fail "family-ai-hermes-profiel-3: API_SERVER_KEY empty or shorter than 32" -}}{{- end -}}
          {{ .API_SERVER_KEY }}
        MODEL_API_KEY: >-
          {{- if eq (trim .MODEL_API_KEY) "" -}}{{- fail "family-ai-hermes-profiel-3: MODEL_API_KEY empty" -}}{{- end -}}
          {{ .MODEL_API_KEY }}
        GEZIN_TOKEN: >-
          {{- if lt (len (trim .GEZIN_TOKEN)) 24 -}}{{- fail "family-ai-hermes-profiel-3: GEZIN_TOKEN empty or shorter than 24" -}}{{- end -}}
          {{ .GEZIN_TOKEN }}
        # chg-2026-10-15-001: ONLY this profile's own kennisdienst token (collection huiswerk-profiel-3).
        KENNIS_TOKEN: >-
          {{- if not (regexMatch "^[A-Za-z0-9]{32,}$" .KENNIS_TOKEN) -}}{{- fail "family-ai-hermes-profiel-3: KENNIS_TOKEN must be >= 32 alphanumeric characters" -}}{{- end -}}
          {{ .KENNIS_TOKEN }}
        # chg-2026-10-20-010 land 2 (Argus W4): the cloud model key, ONLY here (profiel-3) and ONLY as env of
        # the hermes app container (envFrom container 0; seed-once and cloud-spend-init have no envFrom).
        # Fail closed on an empty or malformed value: no Secret, so the pod keeps the previous one.
        CLOUD_API_KEY: >-
          {{- if not (regexMatch "^sk-ant-[A-Za-z0-9_-]{40,}$" (trim .CLOUD_API_KEY)) -}}{{- fail "family-ai-hermes-profiel-3: CLOUD_API_KEY empty or malformed" -}}{{- end -}}
          {{ trim .CLOUD_API_KEY }}
  data:
    - secretKey: API_SERVER_KEY
      remoteRef: {key: family-ai, property: API_SERVER_KEY_3}
    - secretKey: MODEL_API_KEY
      remoteRef: {key: "family-ai MODEL_API_KEY", property: password}
    - secretKey: GEZIN_TOKEN
      remoteRef: {key: family-ai, property: GEZIN_TOKEN_PROFIEL_3}
    - secretKey: KENNIS_TOKEN
      remoteRef: {key: family-ai, property: KENNIS_TOKEN_PROFIEL_3}
    # vault home-infra, item "hermes-antrophic-api-key" (title as stored), field "credential"
    - secretKey: CLOUD_API_KEY
      remoteRef: {key: hermes-antrophic-api-key, property: credential}
