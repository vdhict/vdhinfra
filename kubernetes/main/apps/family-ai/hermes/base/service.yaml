---
# Cluster-only. There is deliberately NO HTTPRoute for any Hermes profile;
# the only permitted client is open-webui (network-policies/).
apiVersion: v1
kind: Service
metadata:
  name: hermes-profiel
  labels:
    app.kubernetes.io/name: hermes
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: hermes
  ports:
    - name: api
      port: 8642
      targetPort: api
