---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hermes-profiel-data
  labels:
    # A revert of this app's commit must NOT delete the data (children's
    # conversations). Deleting this PVC is a recorded, manual rollback step.
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 5Gi
