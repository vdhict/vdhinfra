---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./pvc.yaml
  - ./service.yaml
  - ./deployment.yaml
configMapGenerator:
  - name: hermes-seed
    files:
      - ./seed-once.sh
  - name: hermes-logscrub
    files:
      - sitecustomize.py=./logscrub_sitecustomize.py
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # Shell script: Flux postBuild must not eat ${var}.
    kustomize.toolkit.fluxcd.io/substitute: disabled
