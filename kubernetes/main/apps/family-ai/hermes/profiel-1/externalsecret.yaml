---
# family-ai-hermes-profiel-1. Values only in 1Password.
#   API_SERVER_KEY  <- item "family-ai" field API_SERVER_KEY_1
#                      (the SAME field feeds position 1 of OPENAI_API_KEYS
#                      in family-ai-openwebui, so they cannot drift)
#   MODEL_API_KEY   <- item "family-ai MODEL_API_KEY" field password
#                      (same value Mack sets in Caddy on the Studio)
#   (no GEZIN_TOKEN: profile 1 has no gezin plugin and no gezinsdienst
#    subject in Mack's config.json, so it gets no token at all)
# Every value is guarded: an empty key would make the Hermes API server
# accept ANY caller (fail-open), and sha256("") is a public constant
# (Themis A3). The render fails instead; the pod never gets the Secret.
# nameSuffix does not apply to target.name; it is written out in full.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-ai-hermes-profiel
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: family-ai-hermes-profiel-1
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        API_SERVER_KEY: >-
          {{- if lt (len (trim .API_SERVER_KEY)) 32 -}}{{- fail "family-ai-hermes-profiel-1: API_SERVER_KEY empty or shorter than 32" -}}{{- end -}}
          {{ .API_SERVER_KEY }}
        MODEL_API_KEY: >-
          {{- if eq (trim .MODEL_API_KEY) "" -}}{{- fail "family-ai-hermes-profiel-1: MODEL_API_KEY empty" -}}{{- end -}}
          {{ .MODEL_API_KEY }}
  data:
    - secretKey: API_SERVER_KEY
      remoteRef: {key: family-ai, property: API_SERVER_KEY_1}
    - secretKey: MODEL_API_KEY
      remoteRef: {key: "family-ai MODEL_API_KEY", property: password}
