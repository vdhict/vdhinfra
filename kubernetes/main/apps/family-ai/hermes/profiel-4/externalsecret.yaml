---
# family-ai-hermes-profiel-4 (chg-2026-11-13-004). Two Secrets, both envFrom:
#   family-ai-hermes-profiel-4          MODEL_API_KEY <- 1Password item "family-ai MODEL_API_KEY" (as profiel-1..3)
#   family-ai-hermes-profiel-4-gateway  API_SERVER_KEY, GENERATED in-cluster once (refreshInterval 0), unique to this
#                                       profile. Not in 1Password on purpose: no owner Touch-ID step for a test
#                                       profile. Open WebUI holds the same value in its connection list (set by
#                                       hack/ops/chg-2026-11-13-004-owui-in-pod.py from this Secret, never printed).
#                                       A rebuild regenerates it; then re-run that script (only profiel-4 breaks).
# No KENNIS_TOKEN, no GEZIN_TOKEN.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-ai-hermes-profiel
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: family-ai-hermes-profiel-4
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MODEL_API_KEY: >-
          {{- if eq (trim .MODEL_API_KEY) "" -}}{{- fail "family-ai-hermes-profiel-4: MODEL_API_KEY empty" -}}{{- end -}}
          {{ .MODEL_API_KEY }}
  data:
    - secretKey: MODEL_API_KEY
      remoteRef: {key: "family-ai MODEL_API_KEY", property: password}
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: hermes-profiel-gateway
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-ai-hermes-profiel-gateway
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: "0"
  target:
    name: family-ai-hermes-profiel-4-gateway
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        API_SERVER_KEY: >-
          {{- if not (regexMatch "^[A-Za-z0-9]{48}$" .password) -}}{{- fail "family-ai-hermes-profiel-4-gateway: generated key not 48 alphanumeric" -}}{{- end -}}
          {{ .password }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hermes-profiel-gateway-4
