---
# G8 snapshot every 15 min: keeps the highest usd per month before month.json resets (ledger read-only).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: family-cloud-digest-snapshot
spec:
  schedule: "*/15 * * * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: family-cloud-digest
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 3600
      template:
        metadata:
          labels:
            app.kubernetes.io/name: family-cloud-digest
            app.kubernetes.io/part-of: family-ai
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            seccompProfile: {type: RuntimeDefault}
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            fsGroup: 10000
          containers:
            - name: digest
              image: docker.io/library/python:3.13.15-bookworm@sha256:227b6570d6ee07061ae6ca2eb04dedfb6d2b34045835f343065b9869e4d427ea
              command: ["python3", "-I", "-B", "/scripts/cloud-digest", "snapshot", "--ledger-dir", "/cloud-spend", "--state-dir", "/state"]
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: cloud-spend, mountPath: /cloud-spend, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: cloud-spend
              persistentVolumeClaim: {claimName: hermes-cloud-spend-shared, readOnly: true}
            - name: state
              persistentVolumeClaim: {claimName: family-cloud-digest-state}
            - name: scripts
              configMap: {name: family-cloud-digest-script, defaultMode: 0555}
            - name: tmp
              emptyDir: {sizeLimit: 8Mi}
---
# G8 digest: 1st of the month 00:10 UTC, prints ONE JSON line for the previous UTC month (Loki keeps it; Atlas posts it). Exit 3 = incomplete, 4 = ledger unreadable.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/batch/cronjob_v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: family-cloud-digest-monthly
spec:
  schedule: "10 0 1 * *"
  timeZone: Etc/UTC
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    metadata:
      labels:
        app.kubernetes.io/name: family-cloud-digest
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app.kubernetes.io/name: family-cloud-digest
            app.kubernetes.io/part-of: family-ai
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            seccompProfile: {type: RuntimeDefault}
            runAsUser: 10000
            runAsGroup: 10000
            runAsNonRoot: true
            fsGroup: 10000
          containers:
            - name: digest
              image: docker.io/library/python:3.13.15-bookworm@sha256:227b6570d6ee07061ae6ca2eb04dedfb6d2b34045835f343065b9869e4d427ea
              command: ["python3", "-I", "-B", "/scripts/cloud-digest", "digest", "--ledger-dir", "/cloud-spend", "--state-dir", "/state"]
              env:
                - {name: HOME, value: /tmp}
                - {name: PYTHONDONTWRITEBYTECODE, value: "1"}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: {drop: ["ALL"]}
              resources:
                requests: {cpu: 10m, memory: 32Mi}
                limits: {memory: 128Mi}
              volumeMounts:
                - {name: cloud-spend, mountPath: /cloud-spend, readOnly: true}
                - {name: state, mountPath: /state}
                - {name: scripts, mountPath: /scripts, readOnly: true}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - name: cloud-spend
              persistentVolumeClaim: {claimName: hermes-cloud-spend-shared, readOnly: true}
            - name: state
              persistentVolumeClaim: {claimName: family-cloud-digest-state}
            - name: scripts
              configMap: {name: family-cloud-digest-script, defaultMode: 0555}
            - name: tmp
              emptyDir: {sizeLimit: 8Mi}
