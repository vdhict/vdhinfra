---
# family-ai-kennisdienst. Value only in 1Password (item "family-ai").
#   KENNIS_TOKEN_PROFIEL_1  <- field KENNIS_TOKEN_PROFIEL_1
#       The SAME field feeds KENNIS_TOKEN of hermes-profiel-1, so the two
#       sides cannot drift. KENNIS_TOEGANG (deployment.yaml) maps this env
#       name to the collections it may search. No token and no hash in Git.
# Guard: at least 32 characters, alphanumeric only; anything else fails the
# render and the pod never gets the Secret (the service itself refuses < 24).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: family-ai-kennisdienst
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: family-ai-kennisdienst
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        KENNIS_TOKEN_PROFIEL_1: >-
          {{- if not (regexMatch "^[A-Za-z0-9]{32,}$" .KENNIS_TOKEN_PROFIEL_1) -}}{{- fail "family-ai-kennisdienst: KENNIS_TOKEN_PROFIEL_1 must be >= 32 alphanumeric characters" -}}{{- end -}}
          {{ .KENNIS_TOKEN_PROFIEL_1 }}
        # chg-2026-10-15-001 huiswerk: one token per child profile, distinct from each other and from P1.
        KENNIS_TOKEN_PROFIEL_2: >-
          {{- if not (regexMatch "^[A-Za-z0-9]{32,}$" .KENNIS_TOKEN_PROFIEL_2) -}}{{- fail "family-ai-kennisdienst: KENNIS_TOKEN_PROFIEL_2 must be >= 32 alphanumeric characters" -}}{{- end -}}
          {{- if or (eq .KENNIS_TOKEN_PROFIEL_2 .KENNIS_TOKEN_PROFIEL_1) (eq .KENNIS_TOKEN_PROFIEL_2 .KENNIS_TOKEN_PROFIEL_3) -}}{{- fail "family-ai-kennisdienst: KENNIS_TOKEN_PROFIEL_2 must differ from P1 and P3" -}}{{- end -}}
          {{ .KENNIS_TOKEN_PROFIEL_2 }}
        KENNIS_TOKEN_PROFIEL_3: >-
          {{- if not (regexMatch "^[A-Za-z0-9]{32,}$" .KENNIS_TOKEN_PROFIEL_3) -}}{{- fail "family-ai-kennisdienst: KENNIS_TOKEN_PROFIEL_3 must be >= 32 alphanumeric characters" -}}{{- end -}}
          {{- if eq .KENNIS_TOKEN_PROFIEL_3 .KENNIS_TOKEN_PROFIEL_1 -}}{{- fail "family-ai-kennisdienst: KENNIS_TOKEN_PROFIEL_3 must differ from P1" -}}{{- end -}}
          {{ .KENNIS_TOKEN_PROFIEL_3 }}
  data:
    - secretKey: KENNIS_TOKEN_PROFIEL_1
      remoteRef: {key: family-ai, property: KENNIS_TOKEN_PROFIEL_1}
    - secretKey: KENNIS_TOKEN_PROFIEL_2
      remoteRef: {key: family-ai, property: KENNIS_TOKEN_PROFIEL_2}
    - secretKey: KENNIS_TOKEN_PROFIEL_3
      remoteRef: {key: family-ai, property: KENNIS_TOKEN_PROFIEL_3}
