---
# Keeps cluster pods away from PRINTER-VLAN 70 (172.16.7.0/28, printer .10)
# (chg-2026-10-30-004, Argus ruling 2026-10-30T10:52:10Z).
#
# Why: the UniFi policy Internal -> printer allows the worker-node IPs
# .81-.83, and pod egress is masqueraded to the node IP, so without this
# policy EVERY pod on the workers would reach the printer (Moonraker is
# unauthenticated, full control including heating).
#
# Semantics (Cilium v1.19.8):
#   * Deny always wins over allow, from any policy, so the print3d exception
#     cannot be an allow rule. It is carved out of the endpointSelector.
#   * enableDefaultDeny egress/ingress false: this policy selects (almost)
#     every endpoint; without it every selected pod would drop into
#     default-deny and lose all egress in the cluster.
#   * CIDR rules never match pods or nodes, so only traffic to the printer
#     subnet is affected.
#
# NOT COVERED (residual, by design):
#   * hostNetwork pods (home-assistant, esphome, music-assistant, ...) and
#     node processes on every node: cilium-config enable-host-firewall=false,
#     so no CCNP ever selects them. They keep reaching the printer through
#     the UniFi node-IP allow.
#   * mypka: print3d is NOT denied here, but the mypka tenant egress boundary
#     (apps/mypka/boundary, toCIDRSet 172.16.0.0/12) still denies it; that
#     boundary needs its own carve-out when print3d is deployed.
#   * The tenant sets its own pod labels, so ANY mypka pod labelled
#     app.kubernetes.io/name=print3d is exempt from this policy.
#   * observability: only the dedicated printer exporter (pods labelled
#     app.kubernetes.io/name=blackbox-printer, chg-2026-10-30-004 item 2) is
#     exempt from the /28 deny, and only for 172.16.7.10 TCP 7125 (spec 4).
#     Its own CNP observability/blackbox-printer has egress default-deny and
#     an L7 rule: GET /server/info and GET /printer/objects/query?print_stats=
#     state only. The shared blackbox-exporter is fully denied (spec 3).
#     Only Flux and controllers create pods in observability (Argus checked
#     can-i for every SA there, 2026-11-13), so the label is not forgeable.
#   * ICMP (Argus H4): specs 1-3 are L3 CIDR denies, so ICMP to the /28 is
#     dropped for those pods too. Spec 4 denies only L4 ports on .10, but the
#     printer exporter's egress default-deny drops ICMP as well; nothing in
#     the cluster pings the printer.
#
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: printer-subnet-egress-deny
specs:
  # 1. Every namespace except mypka. NotIn also matches endpoints without a
  #    namespace label (Cilium health/ingress); denying them the printer is
  #    harmless and intended.
  - description: "Deny egress to PRINTER-VLAN 172.16.7.0/28, all namespaces but mypka (chg-2026-10-30-004)"
    endpointSelector:
      matchExpressions:
        - key: k8s:io.kubernetes.pod.namespace
          operator: NotIn
          values: ["mypka", "observability"]
    enableDefaultDeny:
      egress: false
      ingress: false
    egressDeny:
      - toCIDRSet:
          - cidr: 172.16.7.0/28
  # 2. mypka: every pod that is NOT print3d. A pod without the label is denied.
  - description: "Deny egress to PRINTER-VLAN 172.16.7.0/28, mypka pods other than print3d (chg-2026-10-30-004)"
    endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: mypka
      matchExpressions:
        - key: k8s:app.kubernetes.io/name
          operator: NotIn
          values: ["print3d"]
    enableDefaultDeny:
      egress: false
      ingress: false
    egressDeny:
      - toCIDRSet:
          - cidr: 172.16.7.0/28
  # 3. observability: every pod that is NOT the printer exporter, including
  #    the shared blackbox-exporter.
  - description: "Deny egress to PRINTER-VLAN 172.16.7.0/28, observability pods other than blackbox-printer (chg-2026-10-30-004)"
    endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: observability
      matchExpressions:
        - key: k8s:app.kubernetes.io/name
          operator: NotIn
          values: ["blackbox-printer"]
    enableDefaultDeny:
      egress: false
      ingress: false
    egressDeny:
      - toCIDRSet:
          - cidr: 172.16.7.0/28
  # 4. blackbox-printer: the printer subnet stays denied except 172.16.7.10
  #    TCP 7125 (defence in depth under its default-deny CNP).
  - description: "blackbox-printer: deny PRINTER-VLAN except 172.16.7.10 TCP 7125 (chg-2026-10-30-004)"
    endpointSelector:
      matchLabels:
        k8s:io.kubernetes.pod.namespace: observability
        k8s:app.kubernetes.io/name: blackbox-printer
    enableDefaultDeny:
      egress: false
      ingress: false
    egressDeny:
      - toCIDRSet:
          - cidr: 172.16.7.0/28
            except:
              - 172.16.7.10/32
      - toCIDR:
          - 172.16.7.10/32
        toPorts:
          - ports:
              - port: "1"
                endPort: 7124
                protocol: TCP
              - port: "7126"
                endPort: 65535
                protocol: TCP
              - port: "1"
                endPort: 65535
                protocol: UDP
