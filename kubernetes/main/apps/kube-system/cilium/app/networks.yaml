---
apiVersion: cilium.io/v2alpha1
kind: CiliumLoadBalancerIPPool
metadata:
  name: l2-pool
spec:
  allowFirstLastIPs: "Yes"
  blocks:
    - cidr: "172.16.2.0/23"
---
apiVersion: cilium.io/v2alpha1
kind: CiliumL2AnnouncementPolicy
metadata:
  name: l2-policy
spec:
  # chg-2026-10-05-010 (LAB VLAN, design lab-vlan.md rev 2 section 2.1.3): answer ARP
  # for LB IPs ONLY on the physical native NICs. Without this list Cilium announces on
  # every device it selects, so if enp89s0.60 (LAB, VLAN 60) ever got an address and
  # were auto-selected, LB IPs would be announced into LAB. Live 2026-10-05: CPs use
  # enp2s0, workers enp89s0 (cilium-dbg status on all 6 nodes); every current lease
  # holder is on one of them. Anchored regexes: never matches enp89s0.60.
  interfaces:
    - ^enp89s0$
    - ^enp2s0$
  loadBalancerIPs: true
  nodeSelector:
    matchLabels:
      kubernetes.io/os: linux
