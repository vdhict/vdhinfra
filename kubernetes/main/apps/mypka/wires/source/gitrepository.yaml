---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/source.toolkit.fluxcd.io/gitrepository_v1.json
# Mack's tenant repo on the in-cluster forge. Fetched by source-controller
# (flux-system) over the forgejo-ssh Service (port 22 -> pod 2222); the
# tenant pods never see this key.
apiVersion: source.toolkit.fluxcd.io/v1
kind: GitRepository
metadata:
  name: cluster-wires
spec:
  interval: 30m
  url: ssh://git@forgejo-ssh.devtools.svc.cluster.local:22/VDHICT/cluster-wires.git
  # Branch and path confirmed from the delivery (cluster-wires@db7a9a0,
  # docs/atlas-namespace-handoff.md): branch main, manifests under /deploy/.
  # Mack proposed the external name forge-ssh.<domain> (172.16.2.248); we use
  # the in-cluster Service name instead, so the fetch does not depend on LAN
  # DNS or LB hairpin. Same Service, same host key.
  # PINNED (chg-2026-10-11-004, inc-2026-10-09-001). Following the branch let
  # every tenant push go live unreviewed (e27b148 on 10-09, dfea868 on 10-11).
  # The tenant source now advances ONLY when a reviewed vdhinfra commit bumps
  # this SHA: Argus reviews the cluster-wires range <old>..<new>, then the
  # bump goes through the normal change log. The commit must be on the
  # branch named below. Wave 1 (chg-2026-10-07-007): branch
  # cutover/wave1-ortho-tennis, school + ortho + tennis live on image v8,
  # pull secret cluster-wires-pull-v8 (Argus range fea3ea6..c148314).
  # The commit pin is the truth; a push to that branch moves nothing.
  # Back to branch main once Mack fast-forwards cluster-wires main.
  # Rollback: branch cutover/wave1-school commit fea3ea6 (school live on v7,
  # ortho + tennis suspended and shadow).
  ref:
    branch: cutover/wave1-ortho-tennis
    commit: c14831461084d4969744b4171dacf684d470a98e
  # Fetch only what the tenant Kustomization applies (as Mack proposed).
  ignore: |
    /*
    !/deploy/
  secretRef:
    name: cluster-wires-deploy-key
  timeout: 60s
