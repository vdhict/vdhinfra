---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
# Read-only deploy key for VDHICT/cluster-wires (ed25519, public half
# SHA256:mDPKpTwFuJJ/z7dbBkebA6d8WDrixMxogN5yTIyXOBo, "cluster-wires-flux-ro",
# per the delivery), from 1Password vault mypka-cluster, item cluster-wires,
# field flux-key, through store onepassword-mypka (vault mypka-cluster only;
# its conditions admit mypka and flux-system). The item was moved there from
# home-infra by the owner; nothing here reads home-infra any more. The
# delivery confirms the field NAME flux-key and that the value is base64 of
# the OpenSSH key. Agents do not read 1P values.
#
# The Secret stays in flux-system (source-controller only). Because the value
# now comes from the tenant's vault, it is treated as untrusted input: it can
# only ever be used to authenticate the fetch of the URL pinned in
# gitrepository.yaml against the host key pinned below, and the template
# rejects anything that is not a private key.
#
# The template accepts the value raw or base64 and fails the ExternalSecret
# (and so the Kustomization, wait: true) on anything that is not a private
# key.
#
# known_hosts is public data, pinned here. Measured 2026-10-05 with
# ssh-keyscan against forgejo-ssh 172.16.2.248:22 from the LAN (Forgejo's
# built-in Go SSH server offers ONE host key, RSA 4096,
# SHA256:VRbRDnbepo8x5G5SnTmHBxvBqBvHxTKgQ6pJ4gct+pE), written under the
# in-cluster name (same Service, same key). Matches the fingerprint and key
# in Mack's delivery (deploy/base/known_hosts), but both were measured from
# the LAN, not inside the forgejo pod (exec was not permitted); the owner
# can confirm with:
#   kubectl -n devtools exec deploy/forgejo -- sh -c \
#     'for k in /data/ssh/*.pub /data/git/.ssh/*.pub; do ssh-keygen -lf "$k"; done 2>/dev/null'
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-wires-deploy-key
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-mypka
  target:
    name: cluster-wires-deploy-key
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        identity: >-
          {{- $v := trim .FLUX_KEY -}}
          {{- $k := ternary $v ($v | b64dec) (hasPrefix "-----BEGIN " $v) -}}
          {{- if not (and (hasPrefix "-----BEGIN " $k) (contains "PRIVATE KEY-----" $k)) -}}{{- fail "cluster-wires: field flux-key is not an (optionally base64) SSH private key" -}}{{- end -}}
          {{ $k }}{{ "\n" }}
        known_hosts: |
          forgejo-ssh.devtools.svc.cluster.local ssh-rsa 
  data:
    - secretKey: FLUX_KEY
      remoteRef: {key: cluster-wires, property: flux-key}
