---
# Admission guards for the mypka tenant. ValidatingAdmissionPolicy is GA
# (admissionregistration.k8s.io/v1, since Kubernetes 1.30); measured
# 2026-10-05 on the live 1.35.3 API server: validatingadmissionpolicies and
# validatingadmissionpolicybindings are served at admissionregistration.k8s.io/v1.
# In-process CEL, no webhook to run or to fail open.
#
# All bindings select the namespace by kubernetes.io/metadata.name, which
# the API server sets and nobody can change. failurePolicy Fail: if a
# policy cannot be evaluated, the request is rejected.
#
# NOTE: this file is built by the mypka-boundary Kustomization, which gets
# cluster-apps' postBuild substitution: ${SECRET_DOMAIN} below is
# intentional and resolved from cluster-secrets.
#
# ── 1. Services: ClusterIP only ─────────────────────────────────────────
# Quota already caps LoadBalancer and NodePort at 0, but quota cannot see
# ExternalName or externalIPs (CVE-2020-8554: externalIPs let a namespace
# intercept traffic to arbitrary IPs cluster-wide).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mypka-tenant-services
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["services"]
  validations:
    - expression: "!has(object.spec.type) || object.spec.type == 'ClusterIP'"
      message: "mypka: only Services of type ClusterIP are allowed (no LoadBalancer, NodePort or ExternalName)."
      reason: Forbidden
    - expression: "!has(object.spec.externalIPs) || size(object.spec.externalIPs) == 0"
      message: "mypka: spec.externalIPs is not allowed."
      reason: Forbidden
    # Teamregie (chg-2026-10-30-002, Argus T2): a Service must select pods
    # and its selector's app.kubernetes.io/name must equal the Service's own
    # name. So no second Service can select the teamregie pods under another
    # name and be routed to without the SecurityPolicy (which targets the
    # route `teamregie` only; see section 2). An empty selector is refused
    # too (manual endpoints; the tenant has no endpoints RBAC anyway).
    - expression: >-
        has(object.spec.selector) && size(object.spec.selector) > 0 &&
        'app.kubernetes.io/name' in object.spec.selector &&
        object.spec.selector['app.kubernetes.io/name'] == object.metadata.name
      message: "mypka: a Service needs a selector whose app.kubernetes.io/name equals the Service name."
      reason: Forbidden
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mypka-tenant-services
spec:
  policyName: mypka-tenant-services
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: mypka
---
# ── 2. HTTPRoutes: envoy-internal only, own hostnames only ──────────────
# envoy-external accepts routes from ALL namespaces, so without this a
# tenant route on it would be published to the internet.
#
# Hostnames (ADDITION beyond the brief, chg-2026-10-05-003): Gateway API
# MERGES routes that share a hostname, and the more specific path wins. A
# tenant route for an EXISTING hostname with a narrow path (say /auth/...)
# would take that path over from the real app on envoy-internal; a route
# with NO hostnames attaches to every hostname the listener serves. So
# every hostname must be set and must be a single label "mypka-<name>"
# directly under the cluster domain (covered by the existing wildcard cert;
# a deeper level such as x.mypka.<domain> would not be).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mypka-tenant-httproutes
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["gateway.networking.k8s.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["httproutes"]
  variables:
    - name: suffix
      expression: "'.${SECRET_DOMAIN}'"
  validations:
    - expression: >-
        has(object.spec.parentRefs) && size(object.spec.parentRefs) > 0 &&
        object.spec.parentRefs.all(p,
          (!has(p.group) || p.group == 'gateway.networking.k8s.io') &&
          (!has(p.kind) || p.kind == 'Gateway') &&
          has(p.namespace) && p.namespace == 'network' &&
          p.name == 'envoy-internal')
      message: "mypka: HTTPRoute parentRefs must all be Gateway network/envoy-internal (namespace set explicitly)."
      reason: Forbidden
    - expression: >-
        has(object.spec.hostnames) && size(object.spec.hostnames) > 0 &&
        object.spec.hostnames.all(h,
          h.endsWith(variables.suffix) &&
          h.substring(0, size(h) - size(variables.suffix)).matches('^mypka-[a-z0-9]([-a-z0-9]*[a-z0-9])?$'))
      message: "mypka: HTTPRoute hostnames must be set and each must be mypka-<name> directly under the cluster domain."
      reason: Forbidden
    # ── Teamregie guard (chg-2026-10-30-002, Argus C1 + T2) ──
    # Authelia sits in front of the page through the SecurityPolicy
    # mypka/teamregie-authelia, which targets the HTTPRoute named
    # `teamregie` only. So: no tenant route may carry filters (a
    # RequestHeaderModifier could set Remote-User; URLRewrite/ExtensionRef
    # could reshape what Authelia sees); backends are Services in mypka
    # only; and the teamregie host and Service appear on that one route only.
    - expression: >-
        !has(object.spec.rules) || object.spec.rules.all(r,
          (!has(r.filters) || size(r.filters) == 0) &&
          (!has(r.backendRefs) || r.backendRefs.all(b, !has(b.filters) || size(b.filters) == 0)))
      message: "mypka: HTTPRoute filters are not allowed (rules[].filters and backendRefs[].filters)."
      reason: Forbidden
    - expression: >-
        !has(object.spec.rules) || object.spec.rules.all(r, !has(r.backendRefs) || r.backendRefs.all(b,
          (!has(b.group) || b.group == '') && (!has(b.kind) || b.kind == 'Service') &&
          (!has(b.namespace) || b.namespace == 'mypka')))
      message: "mypka: HTTPRoute backends must be Services in namespace mypka."
      reason: Forbidden
    - expression: >-
        object.metadata.name == 'teamregie' ||
        ((!has(object.spec.hostnames) || !object.spec.hostnames.exists(h, h == 'mypka-teamregie' + variables.suffix)) &&
         (!has(object.spec.rules) || object.spec.rules.all(r, !has(r.backendRefs) ||
           r.backendRefs.all(b, b.name != 'teamregie'))))
      message: "mypka: the teamregie host and Service are allowed only on the HTTPRoute named teamregie."
      reason: Forbidden
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mypka-tenant-httproutes
spec:
  policyName: mypka-tenant-httproutes
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: mypka
---
# ── 3. Guardrails (ADDITION beyond the brief, chg-2026-10-05-003) ───────
#   a. No Secret of type service-account-token: the tenant may create
#      Secrets, and such a Secret makes the token controller mint a
#      long-lived token for any SA in mypka - including mypka-tenant, the
#      GitOps identity - usable against the LAN-reachable API VIP.
#   b. No pod runs AS mypka-tenant (same identity, via the projected token).
#   c. No PVC created with spec.volumeName: binding a claim to a named,
#      pre-existing PV could attach another namespace's released data.
#      (CREATE only: the PV controller sets volumeName on bind via UPDATE.)
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mypka-tenant-guardrails
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["secrets", "pods", "persistentvolumeclaims"]
  validations:
    - expression: >-
        request.kind.kind != 'Secret' || !has(object.type) ||
        object.type != 'kubernetes.io/service-account-token'
      message: "mypka: Secrets of type kubernetes.io/service-account-token are not allowed."
      reason: Forbidden
    - expression: >-
        request.kind.kind != 'Pod' || !has(object.spec.serviceAccountName) ||
        object.spec.serviceAccountName != 'mypka-tenant'
      message: "mypka: pods may not run as the mypka-tenant ServiceAccount (the GitOps identity)."
      reason: Forbidden
    - expression: >-
        request.kind.kind != 'PersistentVolumeClaim' || request.operation != 'CREATE' ||
        !has(object.spec.volumeName) || object.spec.volumeName == ''
      message: "mypka: PVCs may not name a pre-existing PersistentVolume (spec.volumeName)."
      reason: Forbidden
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mypka-tenant-guardrails
spec:
  policyName: mypka-tenant-guardrails
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: mypka
---
# ── 4. Platform-owned objects (ADDITION beyond the brief) ───────────────
# The tenant may manage ServiceAccounts and CNPs in mypka, which would
# otherwise include OUR mypka-tenant SA and the baseline CNPs. Objects we
# label vdhinfra.io/boundary=platform cannot be changed or deleted by the
# tenant identity. Only requests made AS the tenant are matched, so Flux
# (cluster-apps / mypka-boundary) still manages them.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mypka-platform-objects
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE", "DELETE"]
        resources: ["serviceaccounts"]
      - apiGroups: ["cilium.io"]
        apiVersions: ["*"]
        operations: ["UPDATE", "DELETE"]
        resources: ["ciliumnetworkpolicies"]
  matchConditions:
    - name: is-tenant
      expression: "request.userInfo.username == 'system:serviceaccount:mypka:mypka-tenant'"
  validations:
    - expression: >-
        !has(oldObject.metadata.labels) ||
        !('vdhinfra.io/boundary' in oldObject.metadata.labels) ||
        oldObject.metadata.labels['vdhinfra.io/boundary'] != 'platform'
      message: "mypka: platform-owned objects (vdhinfra.io/boundary=platform) cannot be changed by the tenant."
      reason: Forbidden
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mypka-platform-objects
spec:
  policyName: mypka-platform-objects
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: mypka
---
# ── 5. CNP port guard (chg-2026-10-05-004, inc-2026-10-05-002) ──────────
# Cilium 1.19.4's embedded Envoy aborts (RELEASE_ASSERT "duplicate entry at
# end when explicitly adding a new range!", cilium/cilium#45811) when one
# endpoint's policy holds two different TCP/ANY port keys that both contain
# port 65535. The platform CCNP already holds one (10444-65535; see its
# PORT-RANGE INVARIANT). Without this guard, a single tenant CNP port entry
# that reaches 65535 would abort Envoy for the WHOLE NODE and stop every new
# mypka endpoint, in any of these forms:
#   - endPort 65535, or port "65535";
#   - a named port: the agent resolves names to whatever number a pod
#     declares, and a tenant pod may declare containerPort 65535.
# So, in every CNP in mypka (spec and specs[], all four rule directions),
# each toPorts entry must be a numeric port below 65535, and any endPort
# must be below 65535. Applies to every requester in mypka, platform too;
# the platform CNPs (53 only) comply. Remove once Cilium >= 1.19.5 (fixed
# proxy) is live AND the tenant actually needs these forms.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mypka-tenant-cnp-ports
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["cilium.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE"]
        resources: ["ciliumnetworkpolicies"]
  variables:
    - name: specs
      expression: >-
        (has(object.spec) ? [object.spec] : []) +
        (has(object.specs) ? object.specs : [])
  validations:
    - expression: >-
        variables.specs.all(s,
          (!has(s.egress) || s.egress.all(r, !has(r.toPorts) || r.toPorts.all(t, !has(t.ports) || t.ports.all(p,
            (!has(p.port) || (p.port.matches('^[0-9]+$') && int(p.port) < 65535)) &&
            (!has(p.endPort) || p.endPort < 65535))))) &&
          (!has(s.egressDeny) || s.egressDeny.all(r, !has(r.toPorts) || r.toPorts.all(t, !has(t.ports) || t.ports.all(p,
            (!has(p.port) || (p.port.matches('^[0-9]+$') && int(p.port) < 65535)) &&
            (!has(p.endPort) || p.endPort < 65535))))) &&
          (!has(s.ingress) || s.ingress.all(r, !has(r.toPorts) || r.toPorts.all(t, !has(t.ports) || t.ports.all(p,
            (!has(p.port) || (p.port.matches('^[0-9]+$') && int(p.port) < 65535)) &&
            (!has(p.endPort) || p.endPort < 65535))))) &&
          (!has(s.ingressDeny) || s.ingressDeny.all(r, !has(r.toPorts) || r.toPorts.all(t, !has(t.ports) || t.ports.all(p,
            (!has(p.port) || (p.port.matches('^[0-9]+$') && int(p.port) < 65535)) &&
            (!has(p.endPort) || p.endPort < 65535))))))
      message: "mypka: CNP toPorts must use numeric ports below 65535 and endPort below 65535 (no named ports). Cilium 1.19.4 Envoy aborts on overlapping ranges that reach 65535 (inc-2026-10-05-002)."
      reason: Forbidden
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mypka-tenant-cnp-ports
spec:
  policyName: mypka-tenant-cnp-ports
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: mypka
---
# ── 6. Teamregie workload guard (chg-2026-10-30-002, Argus V1, 08:20:20Z) ──
# The page is safe only while the teamregie pods are reachable through the
# Service `teamregie` and route `teamregie` alone (sections 1 and 2). Those
# guards key on the label app.kubernetes.io/name, which the tenant sets on
# its own workloads. So: a workload that runs the teamregie image (matched
# on the repository path, any registry host, tag or digest) or mounts the
# PVC teamregie-state must be the Deployment named exactly `teamregie`, with
# app.kubernetes.io/name=teamregie in its selector AND its pod template.
# Then no pod carrying the image or the state can sit behind another Service.
# Tenant workload kinds per the Role: Deployments, StatefulSets, Jobs, CronJobs.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mypka-teamregie-workloads
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs", "cronjobs"]
  variables:
    - name: tpl
      expression: "request.kind.kind == 'CronJob' ? object.spec.jobTemplate.spec.template : object.spec.template"
    - name: containers
      expression: >-
        (has(variables.tpl.spec.initContainers) ? variables.tpl.spec.initContainers : []) +
        (has(variables.tpl.spec.containers) ? variables.tpl.spec.containers : [])
    - name: usesImage
      expression: >-
        variables.containers.exists(c, has(c.image) &&
          c.image.lowerAscii().matches('(^|/)wires-publisher/teamregie([:@].*)?$'))
    - name: usesState
      expression: >-
        has(variables.tpl.spec.volumes) && variables.tpl.spec.volumes.exists(v,
          has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'teamregie-state')
  validations:
    - expression: >-
        !(variables.usesImage || variables.usesState) ||
        (request.kind.kind == 'Deployment' && object.metadata.name == 'teamregie' &&
         has(object.spec.selector.matchLabels) &&
         object.spec.selector.matchLabels.exists(k, k == 'app.kubernetes.io/name') &&
         object.spec.selector.matchLabels['app.kubernetes.io/name'] == 'teamregie' &&
         has(variables.tpl.metadata.labels) &&
         variables.tpl.metadata.labels.exists(k, k == 'app.kubernetes.io/name') &&
         variables.tpl.metadata.labels['app.kubernetes.io/name'] == 'teamregie')
      message: "mypka: the teamregie image and PVC teamregie-state are allowed only in Deployment teamregie, labelled app.kubernetes.io/name=teamregie in selector and template."
      reason: Forbidden
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mypka-teamregie-workloads
spec:
  policyName: mypka-teamregie-workloads
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: mypka
---
# ── 7. Teamregie pod backstop (Argus V2) ────────────────────────────────
# Whatever creates it (the tenant has no pods RBAC; the ReplicaSet controller
# does), a Pod in mypka that runs the teamregie image or mounts teamregie-state
# must carry app.kubernetes.io/name=teamregie and be controlled by a
# ReplicaSet. Deliberately NO owner-name prefix match: a Deployment
# `teamregie-x` makes ReplicaSets `teamregie-x-...`; section 6 stops that.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicy_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mypka-teamregie-pods
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
  variables:
    - name: containers
      expression: >-
        (has(object.spec.initContainers) ? object.spec.initContainers : []) +
        (has(object.spec.containers) ? object.spec.containers : [])
    - name: usesImage
      expression: >-
        variables.containers.exists(c, has(c.image) &&
          c.image.lowerAscii().matches('(^|/)wires-publisher/teamregie([:@].*)?$'))
    - name: usesState
      expression: >-
        has(object.spec.volumes) && object.spec.volumes.exists(v,
          has(v.persistentVolumeClaim) && v.persistentVolumeClaim.claimName == 'teamregie-state')
  validations:
    - expression: >-
        !(variables.usesImage || variables.usesState) ||
        (has(object.metadata.labels) &&
         object.metadata.labels.exists(k, k == 'app.kubernetes.io/name') &&
         object.metadata.labels['app.kubernetes.io/name'] == 'teamregie' &&
         has(object.metadata.ownerReferences) &&
         object.metadata.ownerReferences.exists(o, o.kind == 'ReplicaSet' && o.apiVersion == 'apps/v1' &&
           has(o.controller) && o.controller == true))
      message: "mypka: a pod with the teamregie image or PVC teamregie-state must be labelled app.kubernetes.io/name=teamregie and controlled by a ReplicaSet."
      reason: Forbidden
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/admissionregistration.k8s.io/validatingadmissionpolicybinding_v1.json
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mypka-teamregie-pods
spec:
  policyName: mypka-teamregie-pods
  validationActions: ["Deny"]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: mypka
