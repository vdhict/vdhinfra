---
# Teamregie (chg-2026-10-30-002, Argus C2): Authelia in front of ONE tenant
# route, HTTPRoute mypka/teamregie (tenant repo cluster-wires, envoy-internal,
# host mypka-teamregie.<domain>). Platform-owned: the tenant Role has no
# gateway.envoyproxy.io, and this lands with mypka-boundary BEFORE the tenant
# Kustomization (mypka-wires dependsOn mypka-boundary), so the route never
# exists without it. Envoy asks Authelia's ext-authz endpoint (Authelia 4.39
# default authz endpoint, implementation ExtAuthz) for every request; the
# rule for the host is two_factor group:teamregie, then deny (security/
# authelia configuration.yaml). failOpen false: Authelia down = no page.
# Only Remote-User and Remote-Groups go from Authelia's answer to the app,
# which checks them itself too. The admission policy (section 2) keeps the
# host and the Service on this route only, and forbids route filters.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: teamregie-authelia
  namespace: mypka
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: teamregie
  extAuth:
    failOpen: false
    headersToExtAuth: [cookie, authorization, x-forwarded-proto, x-forwarded-host, accept, user-agent]
    http:
      backendRefs:
        - name: authelia
          namespace: security
          port: 8888
      path: /api/authz/ext-authz/
      headersToBackend: [remote-user, remote-groups]
---
# Lets that SecurityPolicy (and only SecurityPolicies in mypka) reference the
# Authelia Service in security.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/gateway.networking.k8s.io/referencegrant_v1beta1.json
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: mypka-teamregie-to-authelia
  namespace: security
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: mypka
  to:
    - group: ""
      kind: Service
      name: authelia
