---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vikunja
  namespace: flux-system
spec:
  targetNamespace: vikunja
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: vikunja
  dependsOn:
    # The CNPs must exist before any vikunja pod, on every path.
    - name: vikunja-network-policies
    - name: external-secrets-stores
    - name: rook-ceph-cluster
    - name: volsync
    - name: cert-manager   # oidc-proxy CA + leaf
  path: ./kubernetes/main/apps/vikunja/vikunja/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
