---
# Vikunja's two secrets, both from ONE 1Password item that Sander creates
# himself. Nobody types or sees the values.
#
#   1Password item "vikunja" (vault home-infra):
#     SERVICE_SECRET      Vikunja service.secret: signs JWTs and link shares.
#                         Random, >= 32 characters. Changing it logs every
#                         session out.
#     OIDC_CLIENT_SECRET  The OIDC client secret for Authelia client
#                         "vikunja". 32..72 characters, [A-Za-z0-9] only.
#                         security/authelia/app/oidc-vikunja-secret.yaml
#                         turns the SAME field into Authelia's bcrypt digest.
#
# The keys are Vikunja env names. VIKUNJA_<a>_<b>_<c> maps to config key
# a.b.c (pkg/config/config.go setConfigFromEnv: split on "_", lower-case).
# So the provider key "authelia" must never contain an underscore.
#
# If the item or a field is missing, this ExternalSecret stays NotReady, the
# Secret is never created, and the pod never starts (CreateContainerConfig-
# Error). It fails CLOSED; it does not fall back to a random secret.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja
  annotations:
    # Go-template expressions must reach ESO untouched by Flux postBuild.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vikunja-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VIKUNJA_SERVICE_SECRET: >-
          {{- $s := trim .SERVICE_SECRET -}}
          {{- if lt (len $s) 32 -}}{{- fail "vikunja: SERVICE_SECRET must be at least 32 characters" -}}{{- end -}}
          {{ $s }}
        VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_CLIENTSECRET: >-
          {{- $c := trim .OIDC_CLIENT_SECRET -}}
          {{- if or (lt (len $c) 32) (gt (len $c) 72) (not (regexMatch "^[A-Za-z0-9]+$" $c)) -}}{{- fail "vikunja: OIDC_CLIENT_SECRET must be 32..72 alphanumeric" -}}{{- end -}}
          {{ $c }}
  data:
    - secretKey: SERVICE_SECRET
      remoteRef: {key: vikunja, property: SERVICE_SECRET}
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: {key: vikunja, property: OIDC_CLIENT_SECRET}
