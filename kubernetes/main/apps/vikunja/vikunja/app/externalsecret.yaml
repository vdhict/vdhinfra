---
# Vikunja's secrets. Sander creates the 1Password values himself; nobody
# types or sees them.
#
#   1Password item "vikunja" (vault home-infra), NEW:
#     SERVICE_SECRET        Vikunja service.secret: signs JWTs and link
#                           shares. Random, >= 32 characters. Changing it
#                           logs every session out.
#     OIDC_CLIENT_SECRET    Client secret for Authelia client "vikunja".
#                           32..72 characters, [A-Za-z0-9] only.
#                           security/authelia/app/oidc-vikunja-secret.yaml
#                           turns the SAME field into Authelia's bcrypt digest.
#     VIKUNJA_POSTGRES_USER Postgres role name, e.g. "vikunja".
#                           [a-z][a-z0-9_]* (postgres-init passes it unquoted
#                           to createuser).
#     VIKUNJA_POSTGRES_PASS Postgres password, 32..64 characters,
#                           [A-Za-z0-9] only. postgres-init interpolates it
#                           into SQL inside single quotes.
#
#   1Password item "cloudnative-pg", EXISTING (used by mealie/authelia):
#     POSTGRES_SUPER_PASS   read ONLY into vikunja-initdb, below.
#
# Two Secrets, so the postgres16 SUPERUSER password is mounted only in the
# init-db initContainer and never in the Vikunja app container:
#   vikunja-secret   -> app container (envFrom)
#   vikunja-initdb   -> init-db initContainer (envFrom)
#
# Keys in vikunja-secret are Vikunja env names. VIKUNJA_<a>_<b>_<c> maps to
# config key a.b.c (pkg/config/config.go setConfigFromEnv: split on "_",
# lower-case), so the provider key "authelia" must never contain "_".
#
# A missing item or field keeps the ExternalSecret NotReady and the pod
# never starts (CreateContainerConfigError). It fails CLOSED.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja
  annotations:
    # Go-template expressions must reach ESO untouched by Flux postBuild.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vikunja-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VIKUNJA_SERVICE_SECRET: >-
          {{- $s := trim .SERVICE_SECRET -}}
          {{- if lt (len $s) 32 -}}{{- fail "vikunja: SERVICE_SECRET must be at least 32 characters" -}}{{- end -}}
          {{ $s }}
        VIKUNJA_AUTH_OPENID_PROVIDERS_AUTHELIA_CLIENTSECRET: >-
          {{- $c := trim .OIDC_CLIENT_SECRET -}}
          {{- if or (lt (len $c) 32) (gt (len $c) 72) (not (regexMatch "^[A-Za-z0-9]+$" $c)) -}}{{- fail "vikunja: OIDC_CLIENT_SECRET must be 32..72 alphanumeric" -}}{{- end -}}
          {{ $c }}
        # postgres16 (Sander 2026-09-28). host:port is parsed by
        # pkg/db/db.go parsePostgreSQLHostPort.
        VIKUNJA_DATABASE_HOST: postgres16-rw.database.svc.cluster.local:5432
        VIKUNJA_DATABASE_DATABASE: vikunja
        VIKUNJA_DATABASE_USER: >-
          {{- $u := trim .VIKUNJA_POSTGRES_USER -}}
          {{- if not (regexMatch "^[a-z][a-z0-9_]{0,62}$" $u) -}}{{- fail "vikunja: VIKUNJA_POSTGRES_USER must match ^[a-z][a-z0-9_]*$" -}}{{- end -}}
          {{ $u }}
        VIKUNJA_DATABASE_PASSWORD: >-
          {{- $p := trim .VIKUNJA_POSTGRES_PASS -}}
          {{- if or (lt (len $p) 32) (gt (len $p) 64) (not (regexMatch "^[A-Za-z0-9]+$" $p)) -}}{{- fail "vikunja: VIKUNJA_POSTGRES_PASS must be 32..64 alphanumeric" -}}{{- end -}}
          {{ $p }}
  data:
    - secretKey: SERVICE_SECRET
      remoteRef: {key: vikunja, property: SERVICE_SECRET}
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef: {key: vikunja, property: OIDC_CLIENT_SECRET}
    - secretKey: VIKUNJA_POSTGRES_USER
      remoteRef: {key: vikunja, property: VIKUNJA_POSTGRES_USER}
    - secretKey: VIKUNJA_POSTGRES_PASS
      remoteRef: {key: vikunja, property: VIKUNJA_POSTGRES_PASS}
---
# postgres-init (mealie pattern): creates role + database "vikunja" on
# postgres16 and (re)sets the role's password on EVERY pod start. Holds the
# postgres16 superuser password, so it is mounted in init-db ONLY.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-initdb
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vikunja-initdb
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        INIT_POSTGRES_DBNAME: vikunja
        INIT_POSTGRES_HOST: postgres16-rw.database.svc.cluster.local
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        INIT_POSTGRES_USER: >-
          {{- $u := trim .VIKUNJA_POSTGRES_USER -}}
          {{- if not (regexMatch "^[a-z][a-z0-9_]{0,62}$" $u) -}}{{- fail "vikunja-initdb: VIKUNJA_POSTGRES_USER must match ^[a-z][a-z0-9_]*$" -}}{{- end -}}
          {{ $u }}
        INIT_POSTGRES_PASS: >-
          {{- $p := trim .VIKUNJA_POSTGRES_PASS -}}
          {{- if or (lt (len $p) 32) (gt (len $p) 64) (not (regexMatch "^[A-Za-z0-9]+$" $p)) -}}{{- fail "vikunja-initdb: VIKUNJA_POSTGRES_PASS must be 32..64 alphanumeric" -}}{{- end -}}
          {{ $p }}
  data:
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef: {key: cloudnative-pg, property: POSTGRES_SUPER_PASS}
    - secretKey: VIKUNJA_POSTGRES_USER
      remoteRef: {key: vikunja, property: VIKUNJA_POSTGRES_USER}
    - secretKey: VIKUNJA_POSTGRES_PASS
      remoteRef: {key: vikunja, property: VIKUNJA_POSTGRES_PASS}
