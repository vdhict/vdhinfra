---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
# vikunja-sync credentials + config, ALL from 1Password (vault home-infra)
# via ESO. Nothing is SOPS: this repo is public.
#
# Exactly four named fields, nothing else (no dataFrom/extract: item
# vikunja also holds the app's DB password and OIDC secret):
#   item vikunja       field VIKUNJA_VAULTSYNC_API_TOKEN -> VIKUNJA_TOKEN (env)
#   item vikunja-sync  field vault_tasks_key  (READ deploy key, mypka/vault-tasks)
#                      field intents_key      (WRITE deploy key, mypka/vikunja-intents)
#                      field config_json      (area names + owner slug; names a
#                                              client, so it never enters Git)
# Item vikunja-sync is created by the owner (make-deploy-keys.sh).
#
# Shape checks fail the ExternalSecret (and the Flux Kustomization, wait:
# true) instead of every Job. The fail messages are constants; they never
# echo a value.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vikunja-sync
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: vikunja-sync
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        VIKUNJA_TOKEN: >-
          {{- $t := trim .VIKUNJA_VAULTSYNC_API_TOKEN -}}
          {{- if not (hasPrefix "tk_" $t) -}}{{- fail "vikunja-sync: VIKUNJA_VAULTSYNC_API_TOKEN does not start with tk_" -}}{{- end -}}
          {{ $t }}
        vault_tasks_key: >-
          {{- if not (hasPrefix "-----BEGIN OPENSSH PRIVATE KEY-----" (trim .vault_tasks_key)) -}}{{- fail "vikunja-sync: vault_tasks_key is not an OpenSSH private key" -}}{{- end -}}
          {{ .vault_tasks_key }}
        intents_key: >-
          {{- if not (hasPrefix "-----BEGIN OPENSSH PRIVATE KEY-----" (trim .intents_key)) -}}{{- fail "vikunja-sync: intents_key is not an OpenSSH private key" -}}{{- end -}}
          {{ .intents_key }}
        config.json: >-
          {{- if not (hasPrefix "{" (trim .config_json)) -}}{{- fail "vikunja-sync: config_json is not a JSON object" -}}{{- end -}}
          {{ .config_json }}
  data:
    - secretKey: VIKUNJA_VAULTSYNC_API_TOKEN
      remoteRef: {key: vikunja, property: VIKUNJA_VAULTSYNC_API_TOKEN}
    - secretKey: vault_tasks_key
      remoteRef: {key: vikunja-sync, property: vault_tasks_key}
    - secretKey: intents_key
      remoteRef: {key: vikunja-sync, property: intents_key}
    - secretKey: config_json
      remoteRef: {key: vikunja-sync, property: config_json}
