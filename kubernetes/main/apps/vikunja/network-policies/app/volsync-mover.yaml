---
# Under default-deny the VolSync mover pods (labelled through the
# ReplicationSource moverPodLabels) must reach MinIO, or no backup is ever
# written. Egress to the MinIO pod on 9000 and DNS only. Copied from
# family-ai/network-policies/app/volsync-mover.yaml.
#
# The mover pods keep Kubernetes' default ndots:5, so their lookup of
# minio.storage.svc.cluster.local walks the search list first. The
# allow-list is `**.cluster.local`: in Cilium 1.19.4 a leading `**.` matches
# ONE OR MORE labels, so the whole search walk and the final absolute name
# pass, and nothing outside cluster.local can be queried. That leaves no DNS
# side channel from a pod that reads the whole PVC.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: volsync-mover
spec:
  endpointSelector:
    matchLabels:
      vikunja/role: volsync-mover
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: storage
            app.kubernetes.io/name: minio
      toPorts:
        - ports: [{port: "9000", protocol: TCP}]
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
          rules:
            dns:
              - matchPattern: "**.cluster.local"
