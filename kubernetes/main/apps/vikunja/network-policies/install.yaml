---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The vikunja CNPs land BEFORE the workload (vikunja dependsOn this), so no
# vikunja pod ever runs with open ingress or egress, on every path:
# a combined push, a DR rebuild or a re-bootstrap.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app vikunja-network-policies
  namespace: flux-system
spec:
  targetNamespace: vikunja
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: vikunja
  path: ./kubernetes/main/apps/vikunja/network-policies/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
