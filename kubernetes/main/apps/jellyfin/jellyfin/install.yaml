---
# Three Flux Kustomizations, applied strictly in order (chg-2026-10-25-006):
#
#   jellyfin            HelmRelease + config PVC + VolSync backup
#   jellyfin-bootstrap  ExternalSecret jellyfin-admin + a one-shot Job that
#                       runs the startup wizard and sets live TV (from
#                       Dispatcharr), the guide, hardware acceleration and
#                       LAN-only through the API
#   jellyfin-route      the HTTPRoute on envoy-internal
#
# Why the route comes LAST: until the startup wizard is complete, Jellyfin's
# /Startup/* endpoints are open to anyone who can reach port 8096
# (FirstTimeSetupHandler succeeds while IsStartupWizardCompleted is false).
# With no route, only pods in the cluster can reach the ClusterIP in that
# window. jellyfin-bootstrap has wait: true, so jellyfin-route is applied
# only after the Job has COMPLETED. A failed Job keeps the route away.
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app jellyfin
  namespace: flux-system
spec:
  targetNamespace: jellyfin
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: jellyfin
  dependsOn:
    - name: external-secrets-stores
    - name: rook-ceph-cluster
    - name: node-feature-discovery
    - name: volsync
  path: ./kubernetes/main/apps/jellyfin/jellyfin/app
  postBuild:
    substitute:
      # components/volsync
      APP: *app
      VOLSYNC_CLAIM: jellyfin-config
      VOLSYNC_CAPACITY: 10Gi
      # Jellyfin's uid/gid, so the mover can read the clone
      VOLSYNC_PUID: "1000"
      VOLSYNC_PGID: "1000"
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-bootstrap
  namespace: flux-system
spec:
  targetNamespace: jellyfin
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: jellyfin
  dependsOn:
    - name: jellyfin
    - name: external-secrets-stores
    # The tuner and guide are Dispatcharr's outputs; its network-access
    # lists are set by dispatcharr-bootstrap.
    - name: dispatcharr-bootstrap
  path: ./kubernetes/main/apps/jellyfin/jellyfin/bootstrap
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  # A Job's pod template is immutable. The script ConfigMap carries a
  # content hash, so a script change renames it, changes the Job spec, and
  # force makes Flux delete and recreate the Job, which re-runs it. An
  # unchanged spec is left alone: the Job does not re-run every interval.
  force: true
  prune: true
  wait: true
  interval: 30m
  retryInterval: 2m
  timeout: 30m
---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: jellyfin-route
  namespace: flux-system
spec:
  targetNamespace: jellyfin
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: jellyfin
  dependsOn:
    - name: jellyfin-bootstrap
  path: ./kubernetes/main/apps/jellyfin/jellyfin/route
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
