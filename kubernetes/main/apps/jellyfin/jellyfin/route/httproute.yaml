---
# https://jellyfin.${SECRET_DOMAIN} -> envoy-internal (wildcard cert) ->
# jellyfin:8096. LAN and WireGuard only.
#
# NEVER envoy-external, never the Cloudflare tunnel.
#
# NO forward-auth / SecurityPolicy: TV apps cannot do an Authelia login.
# Jellyfin's own user login applies.
#
# DNS, same as vikunja and devtools/forgejo:
#   * external-dns.alpha.kubernetes.io/controller: none keeps BOTH
#     Cloudflare instances off. Without it external-dns-cloudflare-internal
#     would publish a PUBLIC CNAME jellyfin -> internal.${SECRET_DOMAIN} plus
#     a world-readable TXT naming this route.
#   * external-dns-unifi does NOT read that key (it reads only its own
#     annotation prefix), so it DOES write the LAN record
#     jellyfin.${SECRET_DOMAIN} on the UDM, and removes it on revert. Do NOT
#     also hand-write a static record.
#
# Applied by jellyfin-route, which dependsOn jellyfin-bootstrap (wait: true):
# this route exists only after the startup wizard has been completed by the
# Job, and the wizard is blocked below for good. See ../install.yaml.
# Direct play and remux (/Videos/<id>/stream, live TV .ts) are long single
# responses. Envoy's default route timeout is 15s for the WHOLE response
# (measured: 36 of 39 envoy-internal routes have no timeout set), so
# `request: 0s` turns it off for this route, as ntfy does for SSE.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jellyfin
  annotations:
    external-dns.alpha.kubernetes.io/controller: none
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
      namespace: network
      sectionName: https
  hostnames:
    - jellyfin.${SECRET_DOMAIN}
  rules:
    # Argus F2: the startup wizard (/Startup/*) is NEVER reachable through
    # this route, permanently. After data loss (empty jellyfin-config) the
    # wizard is incomplete again and its endpoints need no login
    # (FirstTimeSetupHandler). ASP.NET routing is case-insensitive, hence a
    # case-insensitive RE2 regex. Jellyfin also serves its API under the
    # legacy /emby and /mediabrowser prefixes (Argus ruling b), so those
    # are blocked too. Envoy matches it against the normalised
    # path without the query. No backendRefs = direct 500 in Envoy Gateway
    # v1.3.0, and RegularExpression sorts ahead of PathPrefix (sort.go). The
    # web client only calls /Startup while StartupWizardCompleted is false.
    # jellyfin-bootstrap runs the wizard in-cluster
    # (jellyfin.jellyfin.svc), never through this route.
    - matches:
        - path:
            type: RegularExpression
            value: "(?i)^(/(emby|mediabrowser))?/startup(/.*)?$"
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jellyfin
          port: 8096
      timeouts:
        request: 0s
