---
# One-shot, idempotent configuration of Jellyfin through its API
# (chg-2026-10-25-006). Logic and logging rule: ./bootstrap.py.
#
# Not a Helm hook: a plain Job owned by the jellyfin-bootstrap Flux
# Kustomization (force: true, wait: true). No ttlSecondsAfterFinished: a
# completed Job stays, so Flux does not recreate (and re-run) it every
# interval. It re-runs only when its spec changes (script hash, image, env).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/batch/v1/job.json
apiVersion: batch/v1
kind: Job
metadata:
  name: jellyfin-bootstrap
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 1800
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jellyfin-bootstrap
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: bootstrap
          image: docker.io/library/python:3.13.17-slim@sha256:d98cc29d3266e535dd9da1099688d9cb3ca4753813571e071763d17725460962
          command: ["python3", "-I", "-B", "/scripts/bootstrap.py"]
          env:
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: JELLYFIN_URL
              value: http://jellyfin.jellyfin.svc.cluster.local:8096
            # Dispatcharr outputs, in-cluster, no credential in either URL.
            # The M3U's stream URLs are built from this Host header, so
            # Jellyfin streams from the same in-cluster address.
            - name: TUNER_M3U_URL
              value: http://dispatcharr.dispatcharr.svc.cluster.local:9191/output/m3u
            - name: GUIDE_XMLTV_URL
              value: http://dispatcharr.dispatcharr.svc.cluster.local:9191/output/epg
            # qsv first; if the phase-2 QSV test on the Tiger Lake iGPU
            # fails, set vaapi here (a spec change re-runs the Job).
            - name: HWACCEL
              value: qsv
            - name: RENDER_DEVICE
              value: /dev/dri/renderD128
            - name: JELLYFIN_ADMIN_USER
              valueFrom:
                secretKeyRef: {name: jellyfin-admin, key: JELLYFIN_ADMIN_USER}
            - name: JELLYFIN_ADMIN_PASS
              valueFrom:
                secretKeyRef: {name: jellyfin-admin, key: JELLYFIN_ADMIN_PASS}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          volumeMounts:
            - {name: scripts, mountPath: /scripts, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: scripts
          configMap:
            name: jellyfin-bootstrap
            defaultMode: 0444
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
