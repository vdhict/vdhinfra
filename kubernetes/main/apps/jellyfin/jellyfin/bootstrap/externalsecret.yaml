---
# jellyfin-admin: the Jellyfin administrator, created by the bootstrap Job
# through the startup wizard. For the Job ONLY.
#
#   1Password item "jellyfin-admin" (vault home-infra), created by Atlas on
#   2026-10-25 (chg-2026-10-25-006): username, password (op-generated).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-admin
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: jellyfin-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        JELLYFIN_ADMIN_USER: >-
          {{- $u := trim .username -}}
          {{- if eq $u "" -}}{{- fail "jellyfin-admin: username is empty" -}}{{- end -}}
          {{ $u }}
        JELLYFIN_ADMIN_PASS: >-
          {{- $p := .password -}}
          {{- if lt (len $p) 16 -}}{{- fail "jellyfin-admin: password must be at least 16 characters" -}}{{- end -}}
          {{ $p }}
  data:
    - secretKey: username
      remoteRef: {key: jellyfin-admin, property: username}
    - secretKey: password
      remoteRef: {key: jellyfin-admin, property: password}
