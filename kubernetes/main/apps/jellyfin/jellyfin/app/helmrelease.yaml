---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app jellyfin
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      # Same chart and version as media/plex.
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: intel-device-plugins-gpu
      namespace: gpu-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      jellyfin:
        containers:
          app:
            image:
              # Vendor image, multi-arch index digest (crane digest and the
              # Docker Hub API agree, 2026-10-25). GitHub release v12.3.
              repository: docker.io/jellyfin/jellyfin
              tag: 12.3@sha256:2038fe038ab3876a80f6e7b7e0aef6607b032c7dc0c9b3ad3296d0b2eba3bbb5
            env:
              TZ: Europe/Amsterdam
              # The image already sets JELLYFIN_DATA_DIR=/config,
              # JELLYFIN_CACHE_DIR=/cache and XDG_CACHE_HOME=/cache.
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8096
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *port
                  # First start runs the database migrations.
                  failureThreshold: 60
                  periodSeconds: 10
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                gpu.intel.com/i915: 1
                memory: 4Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      # GPU pattern copied from media/plex: gid 44 is the group the intel
      # device plugin's /dev/dri nodes carry on these Talos workers.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups: [44]
        seccompProfile: {type: RuntimeDefault}
      nodeSelector:
        intel.feature.node.kubernetes.io/gpu: "true"
    service:
      app:
        controller: jellyfin
        # ClusterIP only. LAN/VPN access is the HTTPRoute on envoy-internal
        # (../route). No LoadBalancer IP.
        ports:
          http:
            port: *port
    persistence:
      config:
        existingClaim: jellyfin-config
        globalMounts:
          - path: /config
      # Image cache, fontconfig cache and live TV / transcode segments
      # (Jellyfin's default transcode path is <cache>/transcodes). Node-local
      # scratch; nothing here needs a backup.
      cache:
        type: emptyDir
        sizeLimit: 20Gi
        globalMounts:
          - path: /cache
      tmp:
        type: emptyDir
        sizeLimit: 1Gi
        globalMounts:
          - path: /tmp
