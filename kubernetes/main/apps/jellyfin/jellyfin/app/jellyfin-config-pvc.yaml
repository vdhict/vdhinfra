---
# Jellyfin's data dir (/config): the database, users, metadata, and the
# live TV config (livetv.xml: the in-cluster Dispatcharr M3U and XMLTV URLs,
# no credential; written there by the bootstrap Job).
#
# Backed up by the shared components/volsync to s3://volsync/jellyfin.
#
# prune disabled: taking this file out of Git must NOT delete the config.
# A full removal deletes the PVC BY HAND, as a recorded step.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/v1/persistentvolumeclaim.json
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  labels:
    kustomize.toolkit.fluxcd.io/prune: disabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: rook-ceph-block
  resources:
    requests:
      storage: 10Gi
