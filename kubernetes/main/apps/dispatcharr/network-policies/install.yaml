---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The dispatcharr CNPs land BEFORE the workload (dispatcharr dependsOn
# this), so no dispatcharr pod ever runs with open ingress.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dispatcharr-network-policies
  namespace: flux-system
spec:
  targetNamespace: dispatcharr
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: dispatcharr
  path: ./kubernetes/main/apps/dispatcharr/network-policies/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
