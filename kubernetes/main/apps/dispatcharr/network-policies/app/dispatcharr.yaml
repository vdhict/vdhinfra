---
# dispatcharr: in on TCP 9191 (nginx) from
#   * envoy-internal (the iptv.${SECRET_DOMAIN} route: LAN and WireGuard),
#   * the Jellyfin pod and the jellyfin-bootstrap Job pod ONLY, not the
#     whole jellyfin namespace (Argus F1),
#   * the dispatcharr-bootstrap Job pod,
#   * blackbox-exporter (observability), for the setup-closed probe.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: dispatcharr
spec:
  # app-template 3.7.3 pod labels (helm template, 2026-10-25): name,
  # instance, component. There is NO app.kubernetes.io/controller label in
  # this chart version (vikunja's CNP uses it with a newer chart).
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: dispatcharr
      app.kubernetes.io/component: dispatcharr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            gateway.envoyproxy.io/owning-gateway-name: envoy-internal
        # Pod labels measured with helm template (Jellyfin, app-template
        # 3.7.3: app.kubernetes.io/name jellyfin) and the Job manifest
        # (app.kubernetes.io/name jellyfin-bootstrap).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: jellyfin
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [jellyfin, jellyfin-bootstrap]
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dispatcharr
            app.kubernetes.io/name: dispatcharr-bootstrap
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            app.kubernetes.io/name: blackbox-exporter
      toPorts:
        - ports: [{port: "9191", protocol: TCP}]
