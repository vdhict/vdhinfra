---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  interval: 30m
  maxHistory: 2
  chart:
    spec:
      chart: app-template
      version: 3.7.3
      sourceRef:
        kind: HelmRepository
        name: bjw-s
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  values:
    controllers:
      dispatcharr:
        # One pod owns /data (RWO, its own postgres): never two at once.
        strategy: Recreate
        containers:
          app:
            image:
              # Vendor image, GitHub release v0.33.0 (2026-10-24). Multi-arch
              # index digest, read back with crane 2026-10-25 (`0.33.0` and
              # `latest` agree; the dated 0.33.0-<build> tags are rebuilds
              # with other digests).
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.33.0@sha256:96bc548978c68e684677da7895692eeeefb7f0b2edfa38311dac2b702c61d236
            env:
              TZ: Europe/Amsterdam
              DISPATCHARR_ENV: aio
              DISPATCHARR_LOG_LEVEL: INFO
              # Argus F3: trust forwarded headers from the pod CIDR (the
              # envoy-internal pods; Flux substitutes it from
              # cluster-settings). Effect, from dispatcharr/utils.py +
              # core/utils.py at v0.33.0:
              #   * output URLs (M3U stream URLs, Xtream server_info) take
              #     X-Forwarded-Proto https from Envoy, so clients get
              #     https://iptv... and Xtream credentials never cross the
              #     LAN in cleartext (with `none` they were http, 301-ed);
              #   * the client IP for the network-access lists is the
              #     address Envoy appends to X-Forwarded-For. The route
              #     strips client-sent X-Real-IP / X-Forwarded-Host /
              #     X-Forwarded-Port first (../route/httproute.yaml).
              # Other pods in the CIDR could send forged headers directly,
              # but the ingress CNP admits only envoy-internal, the two
              # jellyfin pods, the bootstrap Job and blackbox on 9191.
              DISPATCHARR_TRUSTED_PROXIES: ${CLUSTER_CIDR}
              # DISPATCHARR_SETUP_ALLOWED_IP is deliberately NOT set; the
              # admin is created by dispatcharr-bootstrap before any route
              # exists (../install.yaml).
              PUID: "1000"
              PGID: "1000"
              POSTGRES_PASSWORD:
                valueFrom:
                  secretKeyRef:
                    name: dispatcharr-postgres
                    key: POSTGRES_PASSWORD
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # AllowAny, no network-access check (core/api_views.py)
                    path: /api/core/version/
                    port: &port 9191
                  periodSeconds: 15
                  timeoutSeconds: 5
                  failureThreshold: 4
              readiness: *probes
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/core/version/
                    port: *port
                  # initdb + Django migrations on first start
                  failureThreshold: 90
                  periodSeconds: 10
                  timeoutSeconds: 5
            # Hardened as far as the all-in-one entrypoint allows. It must
            # START AS ROOT (see ../../namespace.yaml), so NOT possible:
            # runAsNonRoot, readOnlyRootFilesystem (it edits /etc/passwd,
            # /etc/group, /etc/nginx, /etc/environment and chowns /app).
            # Dropped: everything except what the entrypoint uses:
            #   CHOWN         chown /data, /data/db, /app, /var/run/postgresql
            #   DAC_OVERRIDE  root writing into dirs owned by uid 1000
            #   FOWNER        chmod on files owned by uid 1000
            #   SETUID/SETGID `su - dispatch` (postgres, uwsgi, migrate) and
            #                 nginx dropping its workers to `dispatch`
            #   KILL          the shutdown trap pkills uid-1000 processes
            #   AUDIT_WRITE   su/PAM session audit
            # Not granted (Docker would): NET_RAW, MKNOD, SETFCAP, SETPCAP,
            # SYS_CHROOT, FSETID, NET_BIND_SERVICE (nginx listens on 9191).
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities:
                drop: ["ALL"]
                add: ["AUDIT_WRITE", "CHOWN", "DAC_OVERRIDE", "FOWNER", "KILL", "SETGID", "SETUID"]
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 3Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      # hostUsers: false (a user namespace, so root in the container is not
      # root on the node) would be the strongest fit for this root image,
      # and app-template 3.7.3 renders it. NOT set: measured 2026-10-25,
      # /proc/sys/user/max_user_namespaces is 0 on vdhclu01node01/02/03
      # (talosctl read), so such a pod cannot be created. Enabling it is a
      # Talos machine-config change that opens user namespaces to every
      # pod on the node: its own high-risk change, not this one.
      securityContext:
        seccompProfile: {type: RuntimeDefault}
    service:
      app:
        controller: dispatcharr
        # ClusterIP only: Jellyfin uses the in-cluster name, LAN/VPN clients
        # the HTTPRoute (../route). No LoadBalancer IP.
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: dispatcharr-data
        globalMounts:
          - path: /data
      # postgres parallel workers use POSIX shared memory
      shm:
        type: emptyDir
        medium: Memory
        sizeLimit: 256Mi
        globalMounts:
          - path: /dev/shm
