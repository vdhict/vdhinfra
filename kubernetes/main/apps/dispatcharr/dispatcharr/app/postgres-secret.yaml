---
# The all-in-one postgres inside the Dispatcharr pod listens on *:5432 with
# md5 from 0.0.0.0/0, and its role `dispatch` is SUPERUSER
# (docker/init/02-postgres.sh). The image default password is "secret".
# Dispatcharr itself connects over the unix socket (trust), so this password
# is only what stands in front of TCP. A generated one replaces the default;
# the ingress CNP (only 9191 admitted) is the other layer.
#
# Generated by ESO, never in 1Password or Git. refreshInterval 0: generated
# once, never rotated (the role password is set when postgres first creates
# the role). Losing the Secret only re-generates it; the app is unaffected
# (socket auth).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: dispatcharr-postgres
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
  secretKeys:
    - POSTGRES_PASSWORD
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-postgres
spec:
  refreshInterval: "0"
  target:
    name: dispatcharr-postgres
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: dispatcharr-postgres
