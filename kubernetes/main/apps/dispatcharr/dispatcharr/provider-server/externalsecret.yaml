---
# dispatcharr-provider-server: the Xtream server URL, scheme://host[:port],
# from the 1Password field TiViMate/server_url, which Sander adds later.
#
# Its own ExternalSecret AND its own Flux Kustomization (wait: false, in
# ../install.yaml): in ESO 2.4.1 a remoteRef to a missing 1Password field
# fails the sync (ErrExpectedOneField). Until the field exists this
# ExternalSecret is NotReady and writes no Secret; nothing waits on it, and
# the bootstrap Job reads it with optional: true ("provider: not
# configured"). No ExternalSecret alert rule exists, so it makes no noise.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-provider-server
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dispatcharr-provider-server
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PROVIDER_SERVER_URL: >-
          {{- regexReplaceAll `/+$` (trim .server_url) "" -}}
  data:
    - secretKey: server_url
      remoteRef: {key: TiViMate, property: server_url}
