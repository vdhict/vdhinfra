---
# dispatcharr-admin: the Dispatcharr administrator (user_level 10), created
# by the bootstrap Job through /api/accounts/initialize-superuser/. For the
# Job ONLY.
#
#   1Password item "dispatcharr-admin" (vault home-infra), created by Atlas
#   on 2026-10-25 (chg-2026-10-25-006): username, password.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-admin
  annotations:
    # Go-template expressions must reach ESO untouched by Flux postBuild.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dispatcharr-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DISPATCHARR_ADMIN_USER: >-
          {{- $u := trim .username -}}
          {{- if eq $u "" -}}{{- fail "dispatcharr-admin: username is empty" -}}{{- end -}}
          {{ $u }}
        DISPATCHARR_ADMIN_PASS: >-
          {{- $p := .password -}}
          {{- if lt (len $p) 16 -}}{{- fail "dispatcharr-admin: password must be at least 16 characters" -}}{{- end -}}
          {{ $p }}
  data:
    - secretKey: username
      remoteRef: {key: dispatcharr-admin, property: username}
    - secretKey: password
      remoteRef: {key: dispatcharr-admin, property: password}
---
# dispatcharr-provider: the IPTV provider (Xtream codes) credentials. For
# the Job ONLY; the Job hands them to Dispatcharr's API, and Dispatcharr
# keeps them in its postgres on /data.
#
#   1Password item "TiViMate" (vault home-infra, category LOGIN), EXISTING:
#     username, password    Xtream account
#   notesPlain is deliberately NOT read: its M3U host is NXDOMAIN and its
#   Xtream servers answer HTTP 512 to this account (Atlas, measured
#   2026-10-25 14:06Z).
#
# Explicit remoteRefs (Atlas): the Secret holds exactly these two keys.
# The third field, server_url, does not exist yet and is in its own
# ExternalSecret (../provider-server), because in ESO 2.4.1 a remoteRef to
# a missing 1Password field fails the WHOLE sync: getField returns
# ErrExpectedOneField (0 fields with that label), a plain error, not
# NoSecretErr, so no deletionPolicy skips it
# (providers/v1/onepassword/onepassword.go).
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-provider
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dispatcharr-provider
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PROVIDER_USERNAME: >-
          {{- trim .username -}}
        PROVIDER_PASSWORD: >-
          {{- .password -}}
  data:
    - secretKey: username
      remoteRef: {key: TiViMate, property: username}
    - secretKey: password
      remoteRef: {key: TiViMate, property: password}
