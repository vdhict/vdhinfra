---
# dispatcharr-admin: the Dispatcharr administrator (user_level 10), created
# by the bootstrap Job through /api/accounts/initialize-superuser/. For the
# Job ONLY.
#
#   1Password item "dispatcharr-admin" (vault home-infra), created by Atlas
#   on 2026-10-25 (chg-2026-10-25-006): username, password.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-admin
  annotations:
    # Go-template expressions must reach ESO untouched by Flux postBuild.
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dispatcharr-admin
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DISPATCHARR_ADMIN_USER: >-
          {{- $u := trim .username -}}
          {{- if eq $u "" -}}{{- fail "dispatcharr-admin: username is empty" -}}{{- end -}}
          {{ $u }}
        DISPATCHARR_ADMIN_PASS: >-
          {{- $p := .password -}}
          {{- if lt (len $p) 16 -}}{{- fail "dispatcharr-admin: password must be at least 16 characters" -}}{{- end -}}
          {{ $p }}
  data:
    - secretKey: username
      remoteRef: {key: dispatcharr-admin, property: username}
    - secretKey: password
      remoteRef: {key: dispatcharr-admin, property: password}
---
# dispatcharr-provider: the IPTV provider (Xtream codes) account. For the
# Job ONLY; the Job hands it to Dispatcharr's API, and Dispatcharr keeps it
# in its postgres on /data.
#
#   1Password item "TiViMate" (vault home-infra, category LOGIN), EXISTING:
#     username     Xtream username
#     password     Xtream password
#     server_url   Xtream server, scheme://host[:port]. NOT THERE YET:
#                  Sander adds it. notesPlain is deliberately NOT used: its
#                  M3U host is NXDOMAIN and its Xtream servers answer HTTP
#                  512 to this account (Atlas, measured 2026-10-25 14:06Z).
#
# dataFrom.extract, not per-field remoteRefs: a remoteRef to a field that
# does not exist fails the whole ExternalSecret, and the Job would never
# start. With extract, the template reads server_url through `index`, which
# yields "" for a missing key even under ESO's missingkey=error. The other
# fields (notesPlain) are read by ESO but rendered nowhere: the template
# output holds only the three keys below (mergePolicy defaults to Replace).
#
# PROVIDER_SERVER_URL "" means "not configured": the Job then skips the
# provider step and exits 0.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dispatcharr-provider
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: dispatcharr-provider
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        PROVIDER_SERVER_URL: >-
          {{- regexReplaceAll `/+$` (trim (index . "server_url")) "" -}}
        PROVIDER_USERNAME: >-
          {{- trim (index . "username") -}}
        PROVIDER_PASSWORD: >-
          {{- index . "password" -}}
  dataFrom:
    - extract:
        key: TiViMate
