---
# Nightly dev-tenant E2E against the .NET LAB (chg-2026-10-20-001, Mack 2026-10-20 requirement 3). Dev tenant 7m5b27gbc only.
# Pod shape = the TS nightly passkey-point-e2e (devtenant/base/app/e2e-nightly-cronjob.yaml), with these deltas:
#   image   passkey-point-e2e e2e-3ccfbab, index sha256:514feb9a (amd64 78a61881, arm64 aeffab6f), built 2026-10-21 from
#           VDHICT/passkey-point e2e/secreq-1.0-idtype 3ccfbab (merge of ac1358d into ef59c24; under e2e/ only the
#           Containerfile base node@sha256:7f486cab differs), signed + SLSA-attested with the Passkey cosign key.
#           CVE-2026-6653 (libxml2, wont-fix) accepted as ar-015, scoped to this image. Previous value: all-zero placeholder.
#           Unsuspended 2026-10-21 for the first run that night at 03:50 (Argus qa_failed C12 implemented by the
#           persona-gate below; gate dry runs on 460659c0: pass exit 0 before the cutoff, exit 1 past it). The refresh
#           runs on devtenant ac1358d (6f7d3f12), which keeps the .NET LAB callbacks on AR1/AR2.
#   chg-2026-10-21-012 (Node 24.22.1): image e2e-aee4e84, index sha256:e3341b12 (amd64 ca41f17a, arm64 7e785277), from
#           e2e/secreq-1.0-idtype aee4e84 (= 3ccfbab + Node 24.22.1 base node:24-trixie-slim 1375326a); grype 0 outside
#           ar-015, signed + attested, cosign verify vs OOB key. Desk under test 7e090d0. Rollback: git revert.
#   config  passkey-point-e2e-dotnet-config (origins.web = the .NET LAB); hostAliases for that host on envoy-internal.
#   E2E_COMMIT / E2E_LAB_IMAGE_DIGEST  the desk under test: 7e090d0, desk digest (components/desk-image).
#   initContainer desk-ready: GET https://<.NET LAB>/readyz through envoy-internal, 15 s apart for up to 10 min; not 200
#           -> exit 1 BEFORE any tenant step (no password attempt, no TAP): "must not run before the desk is up".
#   initContainer persona-gate (Argus C12, 2026-10-21), AFTER desk-ready: personas are shared and Entra allows one TAP
#           per user, and concurrencyPolicy only guards one CronJob, so the schedule alone does not serialise runs.
#           Every 15 s it lists Jobs in this namespace (SA passkey-point-e2e-dotnet-gate, Role batch/jobs get+list,
#           projected token 600 s mounted in this initContainer ONLY; the e2e container has no token) and passes only
#           when every OTHER Job labelled app.kubernetes.io/name passkey-point-e2e or passkey-point-e2e-dotnet (pod
#           template or Job label) is Complete or Failed with active=0 and terminating=0, AND Europe/Amsterdam time
#           is before GATE_CUTOFF_HHMM (04:00). At the cutoff, on any API error, on missing tzdata or a missing own
#           job-name: exit 1, no tenant step. Own Job excluded by its job-name label (downward API). Image: vendor
#           bitnamilegacy/kubectl, digest-pinned (already used in this repo). CNP e2e-dotnet-gate-apiserver allows
#           kube-apiserver TCP 6443. startingDeadlineSeconds 300: a run that cannot start by 03:55 is skipped.
#           Flux substitution is disabled on this object (the gate script uses shell $ variables).
# Timing: 03:50 Europe/Amsterdam. The TS run starts 02:40 with activeDeadlineSeconds 3600; that is NOT relied on any
#   more (a late-created TS Job or an ad-hoc Job can overlap): the persona-gate above enforces it.
#   tp-contractor-new is re-created 02:10 and counts as "new" for PP_CONTRACTOR_TENURE_MINUTES=120, i.e. until 04:10:
#   a normal ~6 min run ends ~03:56. Clear of the Envoy window runner (01:05) and forge-pg backup (03:10).
apiVersion: batch/v1
kind: CronJob
metadata:
  name: passkey-point-e2e-dotnet
  namespace: passkey-point-e2e
  labels:
    vdhinfra.io/standing: devtenant-nightly
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled  # the persona-gate script uses shell $ variables
spec:
  schedule: "50 3 * * *"
  timeZone: Europe/Amsterdam
  startingDeadlineSeconds: 300  # Argus C12: start by 03:55 or skip; the persona-gate cutoff is 04:00
  suspend: false  # Argus C12: serialised by the persona-gate initContainer, fail closed at 04:00 (chg-2026-10-20-001)
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 7
  failedJobsHistoryLimit: 7
  jobTemplate:
    spec:
      backoffLimit: 0  # a failed run is not retried: no second password attempt (smart lockout)
      activeDeadlineSeconds: 3600
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels: {app.kubernetes.io/name: passkey-point-e2e-dotnet}
        spec:
          serviceAccountName: passkey-point-e2e-dotnet-gate  # read-only Jobs; token only in persona-gate
          automountServiceAccountToken: false
          restartPolicy: Never
          nodeSelector: {kubernetes.io/hostname: vdhclu01node02}
          hostAliases: [{ip: "172.16.2.241", hostnames: ["passkey-point-dotnet-lab.bluejungle.net"]}]
          imagePullSecrets: [{name: passkey-point-e2e-pull}]
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 0, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
          initContainers:
            - name: desk-ready
              image: forge.bluejungle.net/palamedes/passkey-point-e2e@sha256:e3341b128ac05b300b760fbc47a5826194e87d1aca8d822275fe07fb71d483df
              command:
                - node
                - -e
                - >-
                  const u='https://passkey-point-dotnet-lab.bluejungle.net/readyz'; const end=Date.now()+600000;
                  (async()=>{ for(;;){ try{ const r=await fetch(u, {redirect:'manual'}); console.log('desk-ready: /readyz HTTP '+r.status);
                  if(r.status===200) process.exit(0); }catch(e){ console.log('desk-ready: '+((e.cause&&e.cause.code)||e.name)); }
                  if(Date.now()>end){ console.log('desk-ready: desk not ready in 10 min, no tenant step taken'); process.exit(1); }
                  await new Promise(x=>setTimeout(x,15000)); } })();
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 128Mi}}
            - name: persona-gate
              image: docker.io/bitnamilegacy/kubectl:1.33.4@sha256:ed0b31a0508da84ee655c5c6e01bd3897fc56ad6cf69debb27fa1893a06d2246
              command:
                - /bin/sh
                - -c
                - |
                  set -u
                  log() { echo "persona-gate: $*"; }
                  cutoff="${GATE_CUTOFF_HHMM:-0400}"
                  case "$cutoff" in [0-2][0-9][0-5][0-9]) ;; *) log "bad GATE_CUTOFF_HHMM, fail closed, no tenant step taken"; exit 1;; esac
                  self="${GATE_SELF_JOB:-}"
                  [ -n "$self" ] || { log "own job-name label missing, fail closed, no tenant step taken"; exit 1; }
                  [ -f /usr/share/zoneinfo/Europe/Amsterdam ] || { log "no tzdata for Europe/Amsterdam, fail closed, no tenant step taken"; exit 1; }
                  export TZ=Europe/Amsterdam
                  # Explicit kubeconfig: with --request-timeout kubectl ignores in-cluster config (falls back to localhost).
                  sa=/var/run/secrets/kubernetes.io/serviceaccount
                  [ -n "${KUBERNETES_SERVICE_HOST:-}" ] && [ -n "${KUBERNETES_SERVICE_PORT:-}" ] && [ -r "$sa/token" ] && [ -r "$sa/ca.crt" ] \
                    || { log "no API endpoint or token, fail closed, no tenant step taken"; exit 1; }
                  export KUBECONFIG="$HOME/kubeconfig"
                  printf '%s\n' 'apiVersion: v1' 'kind: Config' 'current-context: gate' \
                    "clusters: [{name: in, cluster: {server: \"https://$KUBERNETES_SERVICE_HOST:$KUBERNETES_SERVICE_PORT\", certificate-authority: $sa/ca.crt}}]" \
                    "users: [{name: gate, user: {tokenFile: $sa/token}}]" \
                    'contexts: [{name: gate, context: {cluster: in, user: gate, namespace: passkey-point-e2e}}]' > "$KUBECONFIG" \
                    || { log "cannot write kubeconfig, fail closed, no tenant step taken"; exit 1; }
                  tmpl='{{range .items}}{{.metadata.name}}|{{with .spec.template.metadata.labels}}{{index . "app.kubernetes.io/name"}}{{end}}|{{with .metadata.labels}}{{index . "app.kubernetes.io/name"}}{{end}}|{{.status.active}}|{{.status.terminating}}|{{range .status.conditions}}{{if eq .status "True"}}{{.type}},{{end}}{{end}}{{"\n"}}{{end}}'
                  while :; do
                    now="$(date +%H%M)" && zone="$(date +%Z)" || { log "date failed, fail closed, no tenant step taken"; exit 1; }
                    case "$zone" in CET|CEST) ;; *) log "zone '$zone' is not CET/CEST, fail closed, no tenant step taken"; exit 1;; esac
                    case "$now" in [0-2][0-9][0-5][0-9]) ;; *) log "bad local time, fail closed, no tenant step taken"; exit 1;; esac
                    if [ "$now" -ge "$cutoff" ]; then log "local $now $zone >= cutoff $cutoff, no tenant step taken"; exit 1; fi
                    out="$(kubectl -n passkey-point-e2e get jobs.batch --request-timeout=10s -o go-template="$tmpl")" \
                      || { log "API error, fail closed, no tenant step taken"; exit 1; }
                    blocking=""; seen=0
                    while IFS='|' read -r name tl ml active term conds; do
                      [ -n "$name" ] || continue
                      if [ "$name" = "$self" ]; then seen=1; continue; fi
                      rel=0
                      for l in "$tl" "$ml"; do case "$l" in passkey-point-e2e|passkey-point-e2e-dotnet) rel=1;; esac; done
                      [ "$rel" = 1 ] || continue
                      [ "$active" = "<no value>" ] && active=0
                      fin=0
                      case ",$conds" in *,Complete,*|*,Failed,*) fin=1;; esac
                      [ "$fin" = 1 ] && [ "$active" = 0 ] && [ "$term" = 0 ] && continue
                      blocking="$blocking $name(active=$active,terminating=$term,conditions=$conds)"
                    done <<EOF
                  $out
                  EOF
                    [ "$seen" = 1 ] || { log "own Job $self not in the list, fail closed, no tenant step taken"; exit 1; }
                    if [ -z "$blocking" ]; then
                      now="$(date +%H%M)" || { log "date failed, fail closed, no tenant step taken"; exit 1; }
                      case "$now" in [0-2][0-9][0-5][0-9]) ;; *) log "bad local time, fail closed, no tenant step taken"; exit 1;; esac
                      if [ "$now" -ge "$cutoff" ]; then log "local $now $zone >= cutoff $cutoff after the check, no tenant step taken"; exit 1; fi
                      log "PASS at $now $zone: no other e2e Job active, cutoff $cutoff"; exit 0
                    fi
                    log "waiting at $now $zone:$blocking"
                    sleep 15
                  done
              env:
                - {name: GATE_CUTOFF_HHMM, value: "0400"}
                - {name: TZ, value: Europe/Amsterdam}
                - {name: HOME, value: /gate-tmp}
                - {name: TMPDIR, value: /gate-tmp}
                - name: GATE_SELF_JOB
                  valueFrom: {fieldRef: {fieldPath: "metadata.labels['batch.kubernetes.io/job-name']"}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              resources: {requests: {cpu: 10m, memory: 64Mi}, limits: {memory: 128Mi}}
              volumeMounts:
                - {name: gate-token, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true}
                - {name: gate-tmp, mountPath: /gate-tmp}
          containers:
            - name: e2e
              image: forge.bluejungle.net/palamedes/passkey-point-e2e@sha256:e3341b128ac05b300b760fbc47a5826194e87d1aca8d822275fe07fb71d483df
              args: ["--set", "nightly"]
              env:
                - {name: E2E_SECRETS_DIR, value: /secrets}
                - {name: E2E_COMMIT, value: "7e090d0b0136c2d0f7a9d50cd903dafa49c1f562"}
                - {name: E2E_LAB_IMAGE_DIGEST, value: "sha256:9dc3dbca2df9d17ff7a0153b417313ef576b1adef34e641f5ba1894aa3f7dba8"}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {memory: 2Gi}}
              volumeMounts:
                - {name: secrets, mountPath: /secrets, readOnly: true}
                - {name: config, mountPath: /e2e/config/dev-tenant.json, subPath: dev-tenant.json, readOnly: true}
                - {name: denylist, mountPath: /e2e/config/denylist.txt, subPath: denylist.txt, readOnly: true}
                - {name: out, mountPath: /out}
                - {name: tmp, mountPath: /tmp}
          volumes:
            - {name: secrets, secret: {secretName: passkey-point-e2e, defaultMode: 0440}}
            - {name: config, configMap: {name: passkey-point-e2e-dotnet-config}}
            - {name: denylist, configMap: {name: passkey-point-e2e-denylist}}
            - {name: out, persistentVolumeClaim: {claimName: passkey-point-e2e-out}}
            - {name: tmp, emptyDir: {sizeLimit: 512Mi}}
            - {name: gate-tmp, emptyDir: {sizeLimit: 16Mi}}
            - name: gate-token  # mounted in persona-gate only
              projected:
                sources:
                  - serviceAccountToken: {path: token, expirationSeconds: 600}
                  - configMap: {name: kube-root-ca.crt, items: [{key: ca.crt, path: ca.crt}]}
                  - downwardAPI: {items: [{path: namespace, fieldRef: {fieldPath: metadata.namespace}}]}
