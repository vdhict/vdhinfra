---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
# ADR-027 Flux commit 2 (chg-2026-10-10-001, F2): image pull secret per devtenant namespace, from that namespace's own
# store. Item forge-pull (fields username, credential) = a palamedes read:package token per namespace (Heph S3,
# 2026-10-11); it reads only palamedes/passkey-point-devtenant. Copied from passkey-point-app 76d736e
# deploy/devtenant/flux-1/storage.yaml (reviewed, APPROVED 2026-10-11T14:21:31Z): semantically identical, reformatted
# from flow to block style for yamllint (equality checked with PyYAML).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devtenant-pull
  namespace: devtenant-build
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-devtenant-build
  target:
    name: devtenant-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"forge.bluejungle.net":{"username":"{{ .username }}","password":"{{ .token }}"}}}'
  data:
  - secretKey: username
    remoteRef:
      key: forge-pull
      property: username
  - secretKey: token
    remoteRef:
      key: forge-pull
      property: credential
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: devtenant-pull
  namespace: devtenant-ops
spec:
  refreshInterval: 12h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-devtenant-ops
  target:
    name: devtenant-pull
    template:
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: '{"auths":{"forge.bluejungle.net":{"username":"{{ .username }}","password":"{{ .token }}"}}}'
  data:
  - secretKey: username
    remoteRef:
      key: forge-pull
      property: username
  - secretKey: token
    remoteRef:
      key: forge-pull
      property: credential
