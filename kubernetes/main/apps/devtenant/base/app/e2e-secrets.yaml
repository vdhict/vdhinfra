---
# Secrets for the dev-tenant E2E runner in passkey-point-e2e (chg-2026-10-12-004 created them with kubectl; adopted
# into Git unchanged by chg-2026-10-13-004, Atlas 2026-10-13). Synthetic dev-tenant personas only (7m5b27gbc).
#
#   onepassword-passkey-point-dev-token  ExternalSecret, home-infra ClusterSecretStore, ONE item: the Connect token
#                                        scoped to vault passkey-point-dev (read).
#   onepassword-passkey-point-dev        namespaced SecretStore on that token; vault passkey-point-dev only.
#   passkey-point-e2e                    ExternalSecret: persona passwords, virtual passkeys, runner cert.
#                                        refreshInterval 5m (Atlas 2026-10-13 ~09:00Z): at 1h the Secret still held the
#                                        OLD tp-contractor-new passkey after the 08:46Z refresh, and E09 failed on it.
#                                        The nightly refresh (02:10) is 30 min before the E2E (02:40): 5m is well inside.
#
# Pull secret passkey-point-e2e-pull is NOT managed here (values never in Git): a one-off copy of
# devtenant-build/devtenant-pull (read-only palamedes read:package token), created 2026-10-12T14:51Z with kubectl create,
# labelled vdhinfra.io/copied-from=devtenant-build.devtenant-pull and vdhinfra.io/chg=chg-2026-10-12-004; the same pattern
# as lab-passkey/passkey-point-palamedes-pull. Re-copy it if the source token is rotated. Replace it with an
# ExternalSecret once a forge-pull item exists in a vault this namespace can read.
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: onepassword-passkey-point-dev-token
  namespace: passkey-point-e2e
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword-connect
  target:
    name: onepassword-passkey-point-dev-token
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: token
      remoteRef: {key: op-connect-token-passkey-point-dev, property: credential}
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: onepassword-passkey-point-dev
  namespace: passkey-point-e2e
spec:
  provider:
    onepassword:
      connectHost: http://onepassword-connect.security.svc.cluster.local
      vaults:
        passkey-point-dev: 1
      auth:
        secretRef:
          connectTokenSecretRef:
            name: onepassword-passkey-point-dev-token
            key: token
---
# yaml-language-server: $schema=https://kubernetes-schemas.zinn.ca/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: passkey-point-e2e
  namespace: passkey-point-e2e
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: onepassword-passkey-point-dev
  target:
    name: passkey-point-e2e
    creationPolicy: Owner
    deletionPolicy: Delete
  data:
    - {secretKey: persona-tp-employee.password, remoteRef: {key: pp-e2e-tp-employee, property: password}}
    - {secretKey: persona-tp-contractor-ok.password, remoteRef: {key: pp-e2e-tp-contractor-ok, property: password}}
    - {secretKey: persona-tp-contractor-new.password, remoteRef: {key: pp-e2e-tp-contractor-new, property: password}}
    - {secretKey: persona-tp-other-type.password, remoteRef: {key: pp-e2e-tp-other-type, property: password}}
    - {secretKey: persona-tp-noe3.password, remoteRef: {key: pp-e2e-tp-noe3, property: password}}
    - {secretKey: persona-tp-password.password, remoteRef: {key: pp-e2e-tp-password, property: password}}
    - {secretKey: persona-emp-f3r-1.password, remoteRef: {key: pp-e2e-emp-f3r-1, property: password}}
    - {secretKey: persona-emp-f3r-2.password, remoteRef: {key: pp-e2e-emp-f3r-2, property: password}}
    - {secretKey: persona-emp-f3r-3.password, remoteRef: {key: pp-e2e-emp-f3r-3, property: password}}
    - {secretKey: persona-emp-nonf3r.password, remoteRef: {key: pp-e2e-emp-nonf3r, property: password}}
    - {secretKey: credential-tp-employee.json, remoteRef: {key: pp-e2e-tp-employee-passkey, property: credential.json}}
    - {secretKey: credential-tp-contractor-ok.json, remoteRef: {key: pp-e2e-tp-contractor-ok-passkey, property: credential.json}}
    - {secretKey: credential-tp-contractor-new.json, remoteRef: {key: pp-e2e-tp-contractor-new-passkey, property: credential.json}}
    - {secretKey: credential-tp-other-type.json, remoteRef: {key: pp-e2e-tp-other-type-passkey, property: credential.json}}
    - {secretKey: credential-tp-noe3.json, remoteRef: {key: pp-e2e-tp-noe3-passkey, property: credential.json}}
    - {secretKey: runner.key, remoteRef: {key: pp-v01-runner-cert, property: private key}}
    - {secretKey: runner.crt, remoteRef: {key: pp-v01-runner-cert, property: certificate}}
