---
# Adopted by Atlas from passkey-point deploy/devtenant/mack/refresh-contractor-new-cronjob.yaml: 0611022 (chg-2026-10-12-004),
# template re-mirrored from b4d91cc (chg-2026-10-13-004): guard init (BASELINE must be 64-hex, stops before renew-persona
# deletes anything), renew init, bootstrap init, leak-check last container (Argus F3; searches out + /tmp for the three
# tokens, names the variable only). Re-creates tp-contractor-new 30 min before the nightly E2E (02:40) for E09.
# Standing nightly run approved (Larry for the owner 2026-10-13, AGR-094/099, chg-2026-10-13-004): the ops write token
# devtenant-ops-write-token is a standing ExternalSecret (ops-write-token.yaml), guarded by admission policy
# devtenant-ops-token-guard (only the CronJob/Job controllers, Flux and admin users may reference it).
# SUSPENDED until a green test run on the b4d91cc devtenant image (inc-2026-10-13-001: the c74bd438 renew failed on a
# recycle-bin 404).
apiVersion: batch/v1
kind: CronJob
metadata: {name: devtenant-refresh-contractor-new, namespace: devtenant-build}
spec:
  schedule: "10 2 * * *"
  timeZone: Europe/Amsterdam
  suspend: true
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels: {app.kubernetes.io/name: devtenant, devtenant.passkey-point/connect: "true"}
        spec:
          serviceAccountName: devtenant
          automountServiceAccountToken: false
          restartPolicy: Never
          imagePullSecrets: [{name: devtenant-pull}]
          dnsConfig: {options: [{name: ndots, value: "1"}]}
          securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
          initContainers:
            # Nothing is deleted unless the bootstrap after it can run: a BASELINE that is not 64-hex stops the Job here.
            - name: guard
              image: forge.bluejungle.net/palamedes/passkey-point-devtenant@sha256:cae92f5aa934f25480acfc5735356eb0c4b308b2036d05b6bce585ad0b023aa9
              command: [node, -e, "process.exit(/^[0-9a-f]{64}$/.test(process.env.BASELINE ?? '') ? 0 : 78)"]
              env:
                - {name: BASELINE, value: 31b738a4a438f2464d844779c05b60994f5728d48a7f022672327225a112268b}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
            - name: renew
              image: forge.bluejungle.net/palamedes/passkey-point-devtenant@sha256:cae92f5aa934f25480acfc5735356eb0c4b308b2036d05b6bce585ad0b023aa9
              command: [node, infra/devtenant/devtenant.ts]
              args: [renew-persona, --alias, tp-contractor-new, --yes]
              env:
                - {name: DEVTENANT_KEY_DIR, value: /var/run/secrets/devtenant}
                - {name: OP_CONNECT_HOST, value: http://onepassword-connect.security.svc.cluster.local}
                - {name: OP_CONNECT_TOKEN_PASSKEY_POINT_DEV, valueFrom: {secretKeyRef: {name: devtenant-dev-write-tokens, key: dev}}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              volumeMounts:
                - {name: build-key, mountPath: /var/run/secrets/devtenant/build, readOnly: true}
                - {name: tmp, mountPath: /tmp}
            - name: bootstrap
              image: forge.bluejungle.net/palamedes/passkey-point-devtenant@sha256:cae92f5aa934f25480acfc5735356eb0c4b308b2036d05b6bce585ad0b023aa9
              command: [node, infra/devtenant/devtenant.ts]
              args: [bootstrap-v01, --execute, --yes, --baseline-sha256, 31b738a4a438f2464d844779c05b60994f5728d48a7f022672327225a112268b]
              env:
                - {name: DEVTENANT_KEY_DIR, value: /var/run/secrets/devtenant}
                - {name: DEVTENANT_ADMIN_UPN, value: admsheijden@7m5b27gbc.onmicrosoft.com}
                - {name: OP_CONNECT_HOST, value: http://onepassword-connect.security.svc.cluster.local}
                - {name: OP_CONNECT_TOKEN_PASSKEY_POINT_DEV, valueFrom: {secretKeyRef: {name: devtenant-dev-write-tokens, key: dev}}}
                - {name: OP_CONNECT_TOKEN_PASSKEY_POINT_DEV_APP, valueFrom: {secretKeyRef: {name: devtenant-dev-write-tokens, key: dev-app}}}
                - {name: OP_CONNECT_TOKEN_DEVTENANT_OPS, valueFrom: {secretKeyRef: {name: devtenant-ops-write-token, key: token}}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 1Gi}}
              volumeMounts:
                - {name: build-key, mountPath: /var/run/secrets/devtenant/build, readOnly: true}
                - {name: out, mountPath: /app/infra/devtenant/out}
                - {name: tmp, mountPath: /tmp}
          # Argus F3: the out volume and /tmp searched for the tokens the run held (plain, base64, URL-encoded); a hit fails
          # the Job and names the file, never the value. Pod logs: kubectl logs job/<name> --all-containers | leak-check --stdin.
          containers:
            - name: leak-check
              image: forge.bluejungle.net/palamedes/passkey-point-devtenant@sha256:cae92f5aa934f25480acfc5735356eb0c4b308b2036d05b6bce585ad0b023aa9
              command: [node, infra/devtenant/leak-check.ts, /app/infra/devtenant/out, /tmp]
              env:
                - {name: OP_CONNECT_TOKEN_PASSKEY_POINT_DEV, valueFrom: {secretKeyRef: {name: devtenant-dev-write-tokens, key: dev}}}
                - {name: OP_CONNECT_TOKEN_PASSKEY_POINT_DEV_APP, valueFrom: {secretKeyRef: {name: devtenant-dev-write-tokens, key: dev-app}}}
                - {name: OP_CONNECT_TOKEN_DEVTENANT_OPS, valueFrom: {secretKeyRef: {name: devtenant-ops-write-token, key: token}}}
              securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
              resources: {requests: {cpu: 50m, memory: 128Mi}, limits: {memory: 512Mi}}
              volumeMounts:
                - {name: out, mountPath: /app/infra/devtenant/out, readOnly: true}
                - {name: tmp, mountPath: /tmp, readOnly: true}
          volumes:
            - {name: build-key, secret: {secretName: atlas-devtenant-build-key, defaultMode: 0400}}
            - {name: out, persistentVolumeClaim: {claimName: devtenant-out}}
            - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
