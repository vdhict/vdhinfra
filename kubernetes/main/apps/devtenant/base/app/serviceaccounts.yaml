---
# No Kubernetes API rights (no Role, no RoleBinding), no token mounted.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devtenant
  namespace: devtenant-build
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: devtenant
  namespace: devtenant-ops
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: passkey-point-e2e
  namespace: passkey-point-e2e
automountServiceAccountToken: false
---
# Mack's team (ops-build) runs dev-tenant Jobs with this SA's token (kubeconfig on the Mini).
# Rights: rbac-mack-dev.yaml. Its token Secret mack-dev-token is created out of band (not in Git).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mack-dev
  namespace: devtenant-build
automountServiceAccountToken: false
