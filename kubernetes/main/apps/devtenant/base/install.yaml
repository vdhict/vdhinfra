---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devtenant-base
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: devtenant
  dependsOn:
    - name: devtenant-network-policies
  path: ./kubernetes/main/apps/devtenant/base/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
