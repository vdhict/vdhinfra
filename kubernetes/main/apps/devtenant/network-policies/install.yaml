---
# yaml-language-server: $schema=https://schemas.zinn.ca/kustomize.toolkit.fluxcd.io/kustomization_v1.json
# The devtenant CNPs land BEFORE anything else in the namespaces
# (devtenant-base dependsOn this), so no pod ever runs with open egress.
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: devtenant-network-policies
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/part-of: devtenant
  path: ./kubernetes/main/apps/devtenant/network-policies/app
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 5m
