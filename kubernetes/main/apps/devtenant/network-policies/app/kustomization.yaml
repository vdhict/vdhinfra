---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# Per namespace: default-deny every pod both ways; pods labelled
# app.kubernetes.io/name=devtenant get DNS for exactly
# login.microsoftonline.com + graph.microsoft.com and TCP 443 to those two;
# pods ALSO labelled devtenant.passkey-point/connect=true get DNS for the
# Connect service name and TCP 80 to onepassword-connect pods (service port
# 80 -> targetPort 80, measured 2026-10-11). No ingress. Plain allow rules
# only: no deny rules, no port ranges (inc-2026-10-05-002).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./devtenant-build.yaml
  - ./devtenant-ops.yaml
