---
# PSA privileged: rootful podman inside the gate Job. The Job only runs on the dedicated, tainted worker (Argus
# chg-2026-10-22-006 condition 2). Nothing else may run here.
apiVersion: v1
kind: Namespace
metadata:
  name: pp-ci
  labels:
    vdhinfra.io/tenant: pp-ci
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
