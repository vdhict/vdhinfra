# ============================================================================
# chg-2026-09-09-006 — DRAFT. Install only on Atlas's go-ahead, after the
# chg-2026-09-09-004 lighting supervised window closes.
#
# Prerequisites (config-flow helpers — no configuration.yaml edit, no restart,
# no automation.reload, so they cannot disturb the lighting window):
#   sensor.kantoor_zon_pv_15m               statistics mean, evcc_pv_power, 15 min
#   sensor.kantoor_zon_pv_45m               statistics mean, evcc_pv_power, 45 min
#   input_boolean.kantoor_screen_auto       default ON  — user's off-switch
#   input_boolean.kantoor_screen_auto_dicht default OFF — set when THIS
#       automation closed the screen. Rules 4/5 only re-open a screen carrying
#       this flag, so a MANUAL close is never undone.
# ============================================================================

- id: '1757400001'
  alias: Kantoor Screen - Zonwering
  description: >-
    Laat het kantoorscreen zakken bij felle zon op de zuidgevel en weer omhoog
    als de zon van de gevel af is of het langdurig bewolkt wordt. Doel is
    zowel warmtewering (kantoor leeg) als verblindingswering (kantoor bezet).

    STUURT OP BUITENSIGNALEN, NIET OP DE LUX IN DE KAMER. Gemeten op
    2026-09-09: het screen laten zakken bracht sensor.multisensor_illuminance
    van 1300-2400 lx terug naar ~300 lx. Die zelfveroorzaakte stap van
    1000-2000 lx is groter dan elke werkbare hysterese, dus sturen op de
    binnenlux zou de motor laten pendelen. Daarom sensor.evcc_pv_power plus
    zonnestand.

    GEVELRICHTING ~182 graden (zuid). Afgeleid uit 7 dagen lux-envelope
    per zonazimut (halfwaarde bij az 118 en az 247, midden 182) en
    onafhankelijk bevestigd door de gebruiker zelf: handmatig gesloten bij
    az 157 en az 183, handmatig geopend bij az 246.

    WINDBEVEILIGING - LEES DIT. Het scherm is een zip/cassette-scherm met
    zijgeleiding, windklasse ~49 km/h (Bft 6). Daarom terugtrekken bij 45
    km/h en niet uitrollen boven 38 km/h. De ENIGE windbron is
    OpenWeatherMap: stadsniveau, mediaan 30 min tussen updates, soms 150 min
    oud, en windvlagen zijn 34% van de tijd 'unknown'. Die data kan een
    valwind of rukwindfront NIET zien. Let op: bij deze hogere drempels komt
    de veiligheidsmarge van de STOFKLASSE, niet van de datakwaliteit - de
    OWM-data past hier juist slechter dan bij lage drempels, omdat een
    uurgemiddelde op stadsniveau de pieken uitvlakt precies in het bereik
    waar het ertoe doet. Dit is GEEN echte windbeveiliging. Daarvoor is een
    lokale windmeter aan de gevel nodig.

    WINTERSLAAP - VERWACHT GEDRAG, GEEN STORING. De drempels zijn geijkt op
    8 dagen begin-september-data. Van november tot en met januari haalt
    sensor.evcc_pv_power het 15-minuten gemiddelde van 1800 W vrijwel nooit
    en komt de zon nauwelijks boven 12 graden, dus deze automatisering doet
    dan simpelweg NIETS. Ook opent regel 5 niet omdat de zon dan ondergaat
    voor azimut 245. Dat is bewust. Drempels moeten per seizoen herijkt
    worden; Forecast.Solar is als seizoensnormalisatie getest en AFGEKEURD
    (verhouding werkelijk/voorspeld varieerde 1,06 tot 3,88).

    UIT ZETTEN: input_boolean.kantoor_screen_auto op off. De windterugtrekking
    (regel 1) blijft dan wel actief.
  triggers:
    - trigger: time_pattern
      minutes: /5
      id: tick
    - trigger: numeric_state
      entity_id: sensor.openweathermap_windsnelheid
      above: 45
      id: wind
  conditions: []
  actions:
    - variables:
        az: "{{ state_attr('sun.sun','azimuth') | float(-1) }}"
        el: "{{ state_attr('sun.sun','elevation') | float(-90) }}"
        pv15: "{{ states('sensor.kantoor_zon_pv_15m') | float(-1) }}"
        pv45: "{{ states('sensor.kantoor_zon_pv_45m') | float(-1) }}"
        wind: "{{ states('sensor.openweathermap_windsnelheid') | float(-1) }}"
        wind_age: >-
          {{ (now() - states.sensor.openweathermap_windsnelheid.last_updated).total_seconds() / 60 }}
        gust: "{{ states('sensor.openweathermap_windvlaag_snelheid') | float(0) }}"
        bezet: "{{ is_state('binary_sensor.kantoor_bezet','on') }}"
        auto: "{{ is_state('input_boolean.kantoor_screen_auto','on') }}"
        auto_dicht: "{{ is_state('input_boolean.kantoor_screen_auto_dicht','on') }}"
        cur: "{{ states('cover.screen') }}"
        since: >-
          {{ (now() - states.cover.screen.last_changed).total_seconds() / 60 }}
        in_beam: "{{ el > 12 and 120 <= az <= 245 }}"
        at_edge: "{{ az > 245 and el > 8 }}"
        wind_stale: "{{ wind < 0 or wind_age > 180 }}"
        wind_bad: "{{ wind >= 45 or gust >= 60 }}"
        wind_marginal: "{{ wind >= 38 or gust >= 50 or wind_stale }}"

    # ---- 1. WIND RETRACT — ignores the auto switch on purpose ----
    - if:
        - condition: template
          value_template: "{{ (wind_bad or wind_stale) and cur != 'open' }}"
      then:
        - action: cover.open_cover
          target: {entity_id: cover.screen}
        - action: input_boolean.turn_off
          target: {entity_id: input_boolean.kantoor_screen_auto_dicht}
        - action: logbook.log
          data:
            name: Kantoor Screen
            message: >-
              Windterugtrekking: wind {{ wind }} km/h, vlaag {{ gust }} km/h
              (OpenWeatherMap, {{ wind_age | round(0) }} min oud){{
              ', WINDDATA VEROUDERD/ONTBREEKT' if wind_stale else '' }}.
            entity_id: cover.screen
        - stop: "wind retract done"

    # ---- 2. automatic mode off ----
    - if:
        - condition: template
          value_template: "{{ not auto }}"
      then:
        - stop: "auto mode off"

    # ---- 3. minimum re-command interval; also absorbs a manual move ----
    - if:
        - condition: template
          value_template: "{{ since < 45 }}"
      then:
        - stop: "moved {{ since | round(0) }} min ago, holding off"

    # ---- 4. CLOSE: strong sun on the facade ----
    - if:
        - condition: template
          value_template: >-
            {{ in_beam and pv15 >= 1800 and not wind_marginal and cur == 'open' }}
      then:
        - action: cover.close_cover
          target: {entity_id: cover.screen}
        - action: input_boolean.turn_on
          target: {entity_id: input_boolean.kantoor_screen_auto_dicht}
        - stop: "closed for sun"

    # ---- 5. OPEN: sustained dull AND he is there to notice ----
    - if:
        - condition: template
          value_template: >-
            {{ in_beam and pv45 <= 700 and bezet and cur == 'closed' and auto_dicht }}
      then:
        - action: cover.open_cover
          target: {entity_id: cover.screen}
        - action: input_boolean.turn_off
          target: {entity_id: input_boolean.kantoor_screen_auto_dicht}
        - stop: "opened, sun gone and room occupied"

    # ---- 6. OPEN once when the sun leaves the facade ----
    #      az>245 is the measured falling half-max edge and matches his own
    #      manual open at az 246. el>8 stops this firing when too little
    #      daylight is left to be worth a motor cycle: from mid-Oct to
    #      end-Feb the sun sets before az 245 so this rule does not fire and
    #      the screen stays down until the existing sunset-30 automation.
    - if:
        - condition: template
          value_template: "{{ at_edge and cur == 'closed' and auto_dicht }}"
      then:
        - action: cover.open_cover
          target: {entity_id: cover.screen}
        - action: input_boolean.turn_off
          target: {entity_id: input_boolean.kantoor_screen_auto_dicht}
        - stop: "opened, sun off the facade"

    # ---- 7. nightly reset so the flag never leaks across days ----
    - if:
        - condition: template
          value_template: "{{ el <= 0 and auto_dicht }}"
      then:
        - action: input_boolean.turn_off
          target: {entity_id: input_boolean.kantoor_screen_auto_dicht}
        - stop: "night reset"
  mode: single
  max_exceeded: silent
