spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: {app.kubernetes.io/name: devtenant, devtenant.passkey-point/connect: "true"}
    spec:
      serviceAccountName: devtenant
      automountServiceAccountToken: false
      restartPolicy: Never
      imagePullSecrets: [{name: devtenant-pull}]
      dnsConfig: {options: [{name: ndots, value: "1"}]}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, fsGroupChangePolicy: OnRootMismatch, seccompProfile: {type: RuntimeDefault}}
      initContainers:
        # Nothing is deleted unless the bootstrap after it can run: a BASELINE that is not 64-hex stops the Job here.
        - name: guard
          image: forge.bluejungle.net/palamedes/passkey-point-devtenant@sha256:0f8411ac993fc5515778f91497268ee5d02750fdd6a1ecd88da2f4e54e45763c
          command: [node, -e, "process.exit(/^[0-9a-f]{64}$/.test(process.env.BASELINE ?? '') ? 0 : 78)"]
          env:
            - {name: BASELINE, value: 31b738a4a438f2464d844779c05b60994f5728d48a7f022672327225a112268b}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
      containers:
        - name: bootstrap
          image: forge.bluejungle.net/palamedes/passkey-point-devtenant@sha256:0f8411ac993fc5515778f91497268ee5d02750fdd6a1ecd88da2f4e54e45763c
          # Argus F3: leak-check wraps the step (output redacted, out and /tmp scanned after it, pass or fail).
          command: [node, infra/devtenant/leak-check.ts, /app/infra/devtenant/out, /tmp, --ok-exit, '3', --run, --, node, infra/devtenant/devtenant.ts]
          args: [bootstrap-v01, --execute, --baseline-sha256, 31b738a4a438f2464d844779c05b60994f5728d48a7f022672327225a112268b]
          env:
            - {name: DEVTENANT_KEY_DIR, value: /var/run/secrets/devtenant}
            - {name: DEVTENANT_ADMIN_UPN, value: admsheijden@7m5b27gbc.onmicrosoft.com}
            - {name: OP_CONNECT_HOST, value: 'http://onepassword-connect.security.svc.cluster.local'}
            - {name: OP_CONNECT_TOKEN_PASSKEY_POINT_DEV, valueFrom: {secretKeyRef: {name: devtenant-dev-write-tokens, key: dev}}}
            - {name: OP_CONNECT_TOKEN_PASSKEY_POINT_DEV_APP, valueFrom: {secretKeyRef: {name: devtenant-dev-write-tokens, key: dev-app}}}
            - {name: OP_CONNECT_TOKEN_DEVTENANT_OPS, valueFrom: {secretKeyRef: {name: devtenant-ops-write-token, key: token}}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
          resources: {requests: {cpu: 200m, memory: 512Mi}, limits: {memory: 1Gi}}
          volumeMounts:
            - {name: build-key, mountPath: /var/run/secrets/devtenant/build, readOnly: true}
            - {name: out, mountPath: /app/infra/devtenant/out}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - {name: build-key, secret: {secretName: atlas-devtenant-build-key, defaultMode: 0400}}
        - {name: out, persistentVolumeClaim: {claimName: devtenant-out}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
apiVersion: batch/v1
kind: Job
metadata:
  name: devtenant-refresh-dry-ac1358d-20261021t0701z
  namespace: devtenant-build
  labels:
    app.kubernetes.io/name: devtenant
