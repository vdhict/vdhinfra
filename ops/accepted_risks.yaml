# Machine-readable list of accepted risks. Argus reads this to suppress
# matching findings (downgrades severity to `info`, adds an `accepted_risk`
# pointer to the entry id and ADR).
#
# Each entry MUST link to an ADR in docs/adr/. Risks without an ADR are
# not real "acceptances" — they're "we forgot to write it down" which
# defeats the purpose.
#
# Schema:
#   id:              short stable id, format ar-NNN
#   adr:             path to the ADR doc (required)
#   finding_title:   exact title (or regex if anchored with ^...$) the
#                    finding must have to match
#   target:          exact target string (or regex) the finding must have
#   accepted_by:     who decided (user|atlas|...)
#   accepted_at:     YYYY-MM-DD
#   review_by:       YYYY-MM-DD (annual unless ADR says otherwise)
#   rationale:       one-line summary; full reasoning lives in the ADR
#
# Argus's matching is conservative: both finding_title AND target must
# match. If you find this suppressing too much, tighten the patterns.

risks:
  - id: ar-001
    adr: docs/adr/0001-flux-cluster-admin.md
    finding_title: "ClusterRoleBinding grants cluster-admin"
    target: "^(cluster-reconciler-flux-system|flux-operator) -> ServiceAccount/(kustomize-controller|helm-controller|flux-operator)/flux-system$"
    accepted_by: user
    accepted_at: 2026-05-13
    review_by: 2027-05-13
    rationale: Flux v2 requires cluster-admin on its core controllers; multi-tenant Flux + custom ClusterRole alternatives rejected as too costly for this scale.
  - id: ar-002
    adr: docs/adr/0004-forge-no-offsite-backup-interim.md
    finding_title: "^.*(no off-?site|off-?site).*(backup|copy).*$"
    target: "^(devtools/.*|k8s\\.devtools\\..*|s3://forge-(backups|volsync).*)$"
    accepted_by: user
    accepted_at: 2026-09-23
    review_by: 2027-03-23
    rationale: Forge backups stay on-prem only until Sander decides on off-site backups in general; interim, typed in session 2026-09-23.
  # ar-017 (Connect token for vault cursus-gast) CLOSED 2026-10-29: store, ExternalSecret and
  # vault link removed after go-live (Argus D1). Keep the id reserved; ar-003..ar-016 are
  # taken in unpushed work (main worktree). ar-002 landed on main 2026-11-26 (G1 row e).
  # chg-2026-10-28-002 (Argus go-live D2/B1).
  - id: ar-018
    adr: "ops change chg-2026-10-28-002 (Argus go-live review 72427592, D2); closes with tsk-2026-10-26-002"
    finding_title: "^.*(cloudflared-tunnel|rogue connector|cursus-gast tunnel token|uid 501).*$"
    target: "^(app\\.cursus-gast|cursus-gast/cloudflared-tunnel|host\\.mini/uid-501)$"
    accepted_by: atlas
    accepted_at: 2026-10-29
    review_by: 2026-11-06
    rationale: >-
      myPKA runs as the same macOS user (uid 501) as Atlas on the Mini and can read the Mini kubeconfig,
      so it could read Secret cursus-gast/cloudflared-tunnel and run a rogue connector for tunnel
      cursus-gast. Bounded: every request still passes the Access app (email-only policy + MFA) at the
      edge, so a rogue connector can serve other content to invited users but cannot widen who gets in;
      the daily T9 posture check alerts when the connector count or origin differs from the cluster's.
      Closes with tsk-2026-10-26-002 (narrow the mypka-agents SA, 30-10) plus an own uid for myPKA on the
      Mini, at the latest on review_by.
  - id: ar-019
    adr: "ops change chg-2026-10-12-004 (Themis qa_passed on desk v9 c3614a7, condition 70197); owner decision relayed by Larry 2026-10-29 (handoff e8fbefa4); ADR to follow with the Passkey release ADR"
    finding_title: "^(CVE-2026-70197|DOTNET-RUNTIME-BEHIND)$"
    target: "^registry\\.access\\.redhat\\.com/hi/aspnet-runtime(:10\\.0)?(@sha256:f99c1b0754713eb4060e2be75c43fbad0339099c2d2c6ffe61b4e4db612380b9)?$"
    accepted_by: user
    accepted_at: 2026-10-29
    review_by: 2026-11-28
    rationale: >-
      CVE-2026-70197 (RCE in Kestrel sockets, fixed by Microsoft in .NET 10.0.14 on 2026-10-25) ships
      unfixed in the Passkey Point runtime base f99c1b07 (.NET 10.0.13), because Red Hat has not yet
      published 10.0.14. The owner accepted it in writing, per release, for the push of the release to the
      client's source host and for deployment to the client's dev environment only. NOT for production:
      a production rollout needs a base image carrying the fix (Mack re-pins the digest only). Covers this
      CVE on this base digest only; -102870 and -111497 are not covered by this entry. The release
      still needs the full pre-client review (AGR-087/AGR-100). Closes when the re-pin to a 10.0.14 base
      lands (cron 390fc807 watches for it), at the latest on review_by.
  - id: ar-020
    adr: "ops change chg-2026-11-20-090 (Argus qa_failed C2 on recheck 2026-11-20T08:49:40Z; team choice (b), Larry 095719)"
    finding_title: "^.*(workqueue|tick).*(integrity|uid 501|tamper).*$"
    target: "^host\\.vdhmini01\\.workqueue-tick$"
    accepted_by: team
    accepted_at: 2026-11-20
    review_by: 2026-12-20
    rationale: "Atlas work-queue tick (hack/ops/workqueue.py, launchd com.sheijden.workqueue-tick, queue ~/.local/state/workqueue/) runs as uid 501, which myPKA shares, so the copy, plist, queue and environment can be replaced and the in-copy sha check disabled (e.g. via the plist environment) without any outside alert; there is no check outside uid 501, unlike the approval verifier, which runs as root. Bound: the wake file is DATA only (fixed header AUTOMATISCHE TICK, one json-quoted line per item, Argus C1 PASS 36/36 forgery variants); Atlas treats every tick as data and never as an approval or order. The header proves format, not origin: any uid-501 process can write it, and can already reach Atlas without the tick. The in-copy sha check against origin/main detects accidental drift only. Valid only once atlas-say --tick (refuses files without the header, with a test) is on origin/main; until then no tick file is delivered to Atlas. Lapses at review_by, or earlier if a tick is ever treated as an instruction, if the wake route stops enforcing the header, or when myPKA gets its own uid on the Mini (same closing task as ar-018); then add a check outside the copy and Argus re-reviews."
  - id: ar-011
    adr: "forge VDHICT/passkey-point docs/adr/ADR-027-atlas-devtenant-app-credential.md; Argus re-review 20261120T091726Z (ops/evidence/chg-2026-11-18-001/argus-ar011-rereview-20261120T091726Z.txt)"
    finding_title: "^.*(atlas-devtenant-build|atlas-devtenant-ops|standing (tenant-)?admin|build key|devtenant-ops).*$"
    target: "^app\\.passkey-point$"
    accepted_by: team
    accepted_at: 2026-11-20
    review_by: 2026-12-04
    rationale: "Renewed in reduced form (Argus 2026-11-20). Until 2026-11-23T22:59Z the measured 24-role state (sha 7d850ff5) stands; from D1 the build app holds only K4 (AppRoleAssignment.ReadWrite.All, Application.Read.All, RoleManagement.Read.Directory, Organization.Read.All): latent tier-0 via self-grant, dev tenant 7m5b27gbc only, synthetic data. Write roles only inside a logged provisioning window (reviewed Job, plan sha, max 8 h, never past 22:59Z, close readback to K4 sha). While Passkey Point sleeps the key is not in the cluster (vault passkey-point-devtenant-build only). Plan: D2 2026-11-27 OwnedBy + window helper, D3 2026-12-02 rehearsal, D4 2026-12-04 review. LAPSES on: D1 missed; roles != K4 sha outside a logged window; a window open > 8 h or past 22:59Z; Secret atlas-devtenant-build-key present while asleep; any use against a non-dev tenant; any new key holder or vault reader; owner links or wids != [0997a1d0...] drift; D2-D4 missed; anything leaving 7m5b27gbc for the client before D4. Reversal: delete both apps and both vault items, readback."
  # chg-2026-11-24-002 / tsk-2026-11-24-103 C1 (Argus G3, 20261124T220036Z). Count only, no name.
  - id: ar-021
    adr: docs/adr/0011-chase-client-fence-uncovered-work-contact.md
    finding_title: "^.*(work contacts? without a term|uncovered_work_contacts|client fence (gap|uncovered)).*$"
    target: "^(wire\\.pka-chase|host\\.vdhmini01\\.pka-chase)(/client-terms)?$"
    accepted_by: team
    accepted_at: 2026-11-24
    review_by: 2027-05-24
    rationale: "The chase client fence (keyed client term list v2, chase 088fb44) has no term for exactly one work contact: a person known only by a 3-letter first name, with no surname and no alias. A lone word under 4 letters is not a term (too many false hits on ordinary text) and is weakly identifying on its own. Team choice via Larry (AGR-120). Bound: count 1, as reported by build_client_terms.py / rotate_client_terms.py (uncovered_work_contacts=1). Lapses when that count rises above 1 (a new uncovered contact needs its own decision), when the contact gains a surname or alias in the CRM (then it becomes a term), or at review_by."
  # chg-2026-11-23-012 / wq-097 C7 point 2 (Argus 20261127T114525Z). Residual for go-live.
  - id: ar-022
    adr: "ops change chg-2026-11-23-012 (Argus C7 review ops/evidence/chg-2026-11-23-012/argus-wq097-c7-20261127T114525Z.txt, point 2); a Cilium host-policy ADR follows with its own change"
    finding_title: "^.*(ha-zones|home-assistant).*(8123|host|remote-node|hostNetwork|ingress).*$"
    target: "^(k8s\\.ns\\.ha-zones|cnp\\.ha-zones/ha-zones|app\\.home-assistant)$"
    accepted_by: atlas
    accepted_at: 2026-11-27
    review_by: 2027-02-27
    rationale: >-
      Home Assistant runs hostNetwork, so the ha-zones job pod reaches HA :8123 through Cilium entities
      host/remote-node (cilium policy-cidr-match-mode is empty, so toCIDR cannot select node IPs;
      toEndpoints cannot match a hostNetwork pod). This admits TCP 8123 on any node IP from that pod
      only; only HA listens there. The C7 ask 'HA-side ingress admits the ha-zones namespace only' is
      not expressible for hostNetwork HA without a Cilium host policy (cluster-wide, own future change);
      HA is LAN-reachable by design anyway. Compensating: dedicated HA user local_only=true (C6 proof:
      external hostname refused, in-cluster Service 200, status codes only), weekly token last_used_at
      check, default-deny on everything else in the namespace. Lapses at review_by, when a host policy
      lands, or if anything else on the nodes starts listening on 8123.
